name: Diagnose Evia runtime

on:
  push:
    branches:
      - diagnose-evia-runtime

permissions:
  contents: read
  id-token: write

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app

jobs:
  diagnose:
    name: read-only Evia runtime diagnostics
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Read filtered Evia diagnostics
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          latest_revision=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestRevisionName -o tsv)

          ready_revision=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestReadyRevisionName -o tsv)

          echo "latest_revision=$latest_revision"
          echo "latest_ready_revision=$ready_revision"

          environment_id=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.environmentId -o tsv)

          workspace_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv 2>/dev/null || true)

          echo "::group::Filtered centralized Evia diagnostics"
          if [ -n "$workspace_id" ]; then
            az monitor log-analytics query \
              --workspace "$workspace_id" \
              --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated > ago(2h) | where ContainerAppName_s == '$AZURE_CONTAINER_APP_NAME' | where Log_s contains '[EviaDiag]' or Log_s contains 'Unhandled API error' or Log_s contains 'AGREEMENT_NOT_FOUND' or Log_s contains 'EVIA_COMPLETED' or Log_s contains 'EVIA_SIGNED_DOCUMENT' or Log_s contains 'EVIA_API_KEY' | project TimeGenerated, Log_s | order by TimeGenerated asc" \
              --output table || true
          else
            echo "No Log Analytics workspace configured."
          fi
          echo "::endgroup::"

          replica=$(az containerapp replica list \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$latest_revision" \
            --query '[0].name' -o tsv 2>/dev/null || true)

          echo "::group::Filtered current replica Evia diagnostics"
          if [ -n "$replica" ]; then
            tmp=$(mktemp)
            az containerapp logs show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$latest_revision" \
              --replica "$replica" \
              --type console \
              --tail 300 \
              --format text > "$tmp" || true
            grep -E '\[EviaDiag\]|Unhandled API error|AGREEMENT_NOT_FOUND|EVIA_COMPLETED|EVIA_SIGNED_DOCUMENT|EVIA_API_KEY' "$tmp" || true
            rm -f "$tmp"
          else
            echo "No active replica found."
          fi
          echo "::endgroup::"

