name: R5 deployed LK issuer cutover acceptance
on:
  workflow_dispatch:
    inputs:
      expected_build:
        description: Exact serving main SHA containing this reviewed runtime path
        required: true
        type: string
      operation_id:
        description: New UUID for the disposable workspace and provider fixture
        required: true
        type: string
      confirmation:
        description: VERIFY-DEPLOYED-LK-ISSUER
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: khrental-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: khrental-prod-rg
      AZURE_CONTAINER_APP_NAME: khrental-app
      AZURE_MIGRATION_JOB_NAME: khrental-db-migrator
      EXPECTED_BUILD: ${{ inputs.expected_build }}
      OPERATION_ID: ${{ inputs.operation_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify exact reviewed and serving source
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = VERIFY-DEPLOYED-LK-ISSUER
          [[ "$EXPECTED_BUILD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OPERATION_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]
          test "$EXPECTED_BUILD" = "$GITHUB_SHA"
          node --check scripts/verify-deployed-lk-issuer-cutover.mjs
          curl -fsS --retry 3 --retry-delay 3 --max-time 30 https://app.quixo.homes/build-info.json |
            jq -e --arg sha "$EXPECTED_BUILD" '.buildSha==$sha'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 3d42a180-fda5-4013-afcc-fdba10266f9b
      - name: Open one tenant-scoped deployed acceptance window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" -o json > "$RUNNER_TEMP/app-before.json"
          jq -e '.properties.configuration.activeRevisionsMode=="Single" and
            .properties.latestRevisionName==.properties.latestReadyRevisionName and
            .properties.template.scale.minReplicas==1 and .properties.template.scale.maxReplicas==1' "$RUNNER_TEMP/app-before.json" >/dev/null
          jq -e 'all(.properties.template.containers[0].env[]?;
            .name!="MANAGEMENT_LK_SANDBOX_INVOICE_TENANT" and .name!="MANAGEMENT_LK_SANDBOX_ISSUER_MARKET")' "$RUNNER_TEMP/app-before.json" >/dev/null
          ready=$(jq -r '.properties.latestReadyRevisionName' "$RUNNER_TEMP/app-before.json")
          image=$(az containerapp revision show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" --revision "$ready" --query 'properties.template.containers[0].image' -o tsv)
          test "${image##*:}" = "$EXPECTED_BUILD"
          jq -S '.properties.template | del(.revisionSuffix) | .containers |= map(.env |= sort_by(.name))' \
            "$RUNNER_TEMP/app-before.json" > "$RUNNER_TEMP/template-before.json"
          echo 'mutated=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" --set-env-vars \
            MANAGEMENT_LK_SANDBOX_INVOICE_TENANT="$OPERATION_ID" MANAGEMENT_LK_SANDBOX_ISSUER_MARKET=XZ -o none
          for attempt in $(seq 1 90); do
            az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" -o json > "$RUNNER_TEMP/app-window.json"
            if jq -e --arg id "$OPERATION_ID" '.properties.latestRevisionName==.properties.latestReadyRevisionName and
              any(.properties.template.containers[0].env[]; .name=="MANAGEMENT_LK_SANDBOX_INVOICE_TENANT" and .value==$id) and
              any(.properties.template.containers[0].env[]; .name=="MANAGEMENT_LK_SANDBOX_ISSUER_MARKET" and .value=="XZ")' "$RUNNER_TEMP/app-window.json" >/dev/null; then break; fi
            sleep 10
          done
          jq -e --arg id "$OPERATION_ID" '.properties.latestRevisionName==.properties.latestReadyRevisionName and
            any(.properties.template.containers[0].env[]; .name=="MANAGEMENT_LK_SANDBOX_INVOICE_TENANT" and .value==$id)' "$RUNNER_TEMP/app-window.json" >/dev/null
          curl -fsS --retry 3 --retry-delay 3 --max-time 30 https://app.quixo.homes/build-info.json |
            jq -e --arg sha "$EXPECTED_BUILD" '.buildSha==$sha'
      - name: Verify genuine renewal, signed receiver and historical issuer
        shell: bash
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for required in STRIPE_SANDBOX_SECRET_KEY STRIPE_SANDBOX_WEBHOOK_SECRET; do
            test -n "${!required:-}"
          done
          job=$(az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MIGRATION_JOB_NAME" -o json)
          test "$(jq -r '.properties.template.containers[0].args[0]' <<<"$job")" = scripts/run-production-migration-plan.sh
          jq -S '.properties.template' <<<"$job" > "$RUNNER_TEMP/migrator-template-before.json"
          container=$(jq -c '.properties.template.containers[0]' <<<"$job")
          container_name=$(jq -er '.name' <<<"$container")
          cpu=$(jq -er '.resources.cpu' <<<"$container")
          memory=$(jq -er '.resources.memory' <<<"$container")
          server=$(jq -er '.env[] | select(.name=="MSSQL_SERVER") | .value' <<<"$container")
          database=$(jq -er '.env[] | select(.name=="MSSQL_DATABASE") | .value' <<<"$container")
          app_server=$(jq -er '.properties.template.containers[0].env[] | select(.name=="MSSQL_SERVER") | .value' \
            "$RUNNER_TEMP/app-window.json")
          app_database=$(jq -er '.properties.template.containers[0].env[] | select(.name=="MSSQL_DATABASE") | .value' \
            "$RUNNER_TEMP/app-window.json")
          test "${server,,}" = "${app_server,,}"
          test "$database" = "$app_database"
          revision=$(jq -er '.properties.latestReadyRevisionName' "$RUNNER_TEMP/app-window.json")
          image=$(az containerapp revision show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" \
            --revision "$revision" --query 'properties.template.containers[0].image' -o tsv)
          test "${image##*:}" = "$EXPECTED_BUILD"
          active=$(az containerapp job execution list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MIGRATION_JOB_NAME" \
            --query "[?properties.status=='Running' || properties.status=='Pending' || properties.status=='Processing'] | length(@)" -o tsv)
          test "$active" = 0
          execution=$(az containerapp job start -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MIGRATION_JOB_NAME" \
            --container-name "$container_name" --image "$image" --cpu "$cpu" --memory "$memory" \
            --command node --args /app/scripts/verify-deployed-lk-issuer-cutover.mjs --env-vars \
              NODE_ENV=production MSSQL_SERVER="$server" MSSQL_DATABASE="$database" MSSQL_AUTHENTICATION=managed-identity \
              MANAGEMENT_BILLING_SCHEMA_READY=true MANAGEMENT_BILLING_SANDBOX_ENABLED=true \
              STRIPE_SANDBOX_ACCOUNT_ID=acct_1UTgcdQ4sARuLNQa \
              STRIPE_SANDBOX_SECRET_KEY="$STRIPE_SANDBOX_SECRET_KEY" \
              STRIPE_SANDBOX_WEBHOOK_SECRET="$STRIPE_SANDBOX_WEBHOOK_SECRET" \
              MANAGEMENT_LK_SANDBOX_INVOICE_TENANT="$OPERATION_ID" MANAGEMENT_LK_SANDBOX_ISSUER_MARKET=XZ \
              R5_LK_ISSUER_OPERATION="$OPERATION_ID" --query name -o tsv)
          test -n "$execution"
          printf '%s\n' "$execution" > lk-issuer-cutover-execution.txt
          status=
          for attempt in $(seq 1 120); do
            status=$(az containerapp job execution show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MIGRATION_JOB_NAME" \
              --job-execution-name "$execution" --query properties.status -o tsv)
            case "$status" in
              Succeeded|Failed|Stopped) break ;;
            esac
            sleep 5
          done
          case "$status" in Succeeded|Failed|Stopped) ;; *) echo 'Acceptance job did not reach a terminal state.' >&2; exit 1 ;; esac
          raw_log=$(mktemp)
          found=0
          for attempt in $(seq 1 12); do
            if az containerapp job logs show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MIGRATION_JOB_NAME" \
              --execution "$execution" --container "$container_name" --tail 200 --format text > "$raw_log" 2>/dev/null \
              && grep -Eq 'LK_ISSUER_(PASS|FAILED|CLEANUP_FAILED)=' "$raw_log"; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1
          grep -Eo 'LK_ISSUER_(CHECK|FAILED|CLEANUP|CLEANUP_FAILED|PASS)=.*' "$raw_log" > lk-issuer-cutover.txt
          rm -f "$raw_log"
          test "$status" = Succeeded
          if grep -Eq 'LK_ISSUER_FAILED=|LK_ISSUER_CLEANUP_FAILED=' lk-issuer-cutover.txt; then exit 1; fi
          grep -Eo 'LK_ISSUER_PASS=\{[^}]+\}' lk-issuer-cutover.txt | tr -d '\r' | sed 's/^LK_ISSUER_PASS=//' > lk-issuer-cutover-summary.json
          jq -e '.passed and .signedDelivery and .authenticatedReadback and .viewerDenied and
            .sharedLkCalendarUnchanged and .protectedBillingUnchanged and .providerClean and .sqlClean and
            .sessionRevoked and .liveChargingEnabled==false and .currency=="lkr" and .totalMinor==300000' lk-issuer-cutover-summary.json
          az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MIGRATION_JOB_NAME" -o json > "$RUNNER_TEMP/migrator-after.json"
          test "$(jq -r '.properties.template.containers[0].args[0]' "$RUNNER_TEMP/migrator-after.json")" = scripts/run-production-migration-plan.sh
          jq -S '.properties.template' "$RUNNER_TEMP/migrator-after.json" > "$RUNNER_TEMP/migrator-template-after.json"
          diff -u "$RUNNER_TEMP/migrator-template-before.json" "$RUNNER_TEMP/migrator-template-after.json"
      - name: Restore the exact serving configuration and verify health
        if: always() && steps.window.outputs.mutated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" --remove-env-vars \
            MANAGEMENT_LK_SANDBOX_INVOICE_TENANT MANAGEMENT_LK_SANDBOX_ISSUER_MARKET -o none
          for attempt in $(seq 1 90); do
            az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" -o json > "$RUNNER_TEMP/app-after.json"
            if jq -e '.properties.latestRevisionName==.properties.latestReadyRevisionName and
              all(.properties.template.containers[0].env[]?;
                .name!="MANAGEMENT_LK_SANDBOX_INVOICE_TENANT" and .name!="MANAGEMENT_LK_SANDBOX_ISSUER_MARKET")' "$RUNNER_TEMP/app-after.json" >/dev/null; then break; fi
            sleep 10
          done
          jq -S '.properties.template | del(.revisionSuffix) | .containers |= map(.env |= sort_by(.name))' \
            "$RUNNER_TEMP/app-after.json" > "$RUNNER_TEMP/template-after.json"
          diff -u "$RUNNER_TEMP/template-before.json" "$RUNNER_TEMP/template-after.json"
          curl -fsS --retry 3 --retry-delay 3 --max-time 30 https://app.quixo.homes/build-info.json |
            jq -e --arg sha "$EXPECTED_BUILD" '.buildSha==$sha'
          curl -fsS --retry 3 --retry-delay 3 --max-time 30 https://app.quixo.homes/api/mssql/health |
            jq -e '.ok and .connection=="ready"'
          test "$(az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MIGRATION_JOB_NAME" \
            --query 'properties.template.containers[0].args[0]' -o tsv)" = scripts/run-production-migration-plan.sh
          if [ -f "$RUNNER_TEMP/migrator-template-before.json" ]; then
            az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MIGRATION_JOB_NAME" -o json |
              jq -S '.properties.template' > "$RUNNER_TEMP/migrator-template-restored.json"
            diff -u "$RUNNER_TEMP/migrator-template-before.json" "$RUNNER_TEMP/migrator-template-restored.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r5-deployed-lk-issuer-cutover
          path: |
            lk-issuer-cutover.txt
            lk-issuer-cutover-summary.json
            lk-issuer-cutover-execution.txt
          if-no-files-found: ignore
          retention-days: 30
