name: Test production password recovery

on:
  workflow_run:
    workflows:
      - Build and deploy KH Rentals container
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      APP_URL: https://khrental-app.proudpebble-f58b5187.southeastasia.azurecontainerapps.io
    steps:
      - name: Verify recovery page is publicly routable
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 5 --retry-delay 4 \
            "$APP_URL/reset-password?token=deployment-smoke-invalid")

          if ! echo "$response" | grep -Fq '<div id="root">'; then
            echo "Password recovery route did not return the KH Rentals application shell." >&2
            exit 1
          fi

      - name: Verify stale browser session cannot block token validation
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 5 --retry-delay 4 \
            -H 'Authorization: Bearer intentionally-stale-deployment-smoke-token' \
            "$APP_URL/api/platform/auth/reset-password/validate?token=deployment-smoke-invalid")

          if echo "$response" | grep -Eq 'AUTH_SESSION_REQUIRED|INVALID_SESSION'; then
            echo "Password recovery was incorrectly blocked by session authentication." >&2
            echo "$response" >&2
            exit 1
          fi

          if ! echo "$response" | grep -Eq '"valid"[[:space:]]*:[[:space:]]*false'; then
            echo "Password reset validation did not return the expected anonymous invalid-token result." >&2
            echo "$response" >&2
            exit 1
          fi

          echo "Production password recovery route and anonymous token validation are healthy."
