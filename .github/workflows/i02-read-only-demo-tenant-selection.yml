name: I02 read-only demo tenant selection

on:
  push:
    branches: [diagnostics/i02-select-demo-tenant-20261023]

permissions:
  contents: read
  id-token: write

concurrency:
  group: khrental-i02-demo-tenant-selection
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app
  AZURE_MIGRATION_JOB_NAME: khrental-db-migrator

jobs:
  discovery:
    if: github.repository == 'WasanthaK/khrental' && github.ref == 'refs/heads/diagnostics/i02-select-demo-tenant-20261023'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Azure sign-in
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Select demo tenant via isolated job, READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          expected_sha=cd4855799df2745f3e892d7ddb81d2674e5e2490
          revision=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestReadyRevisionName -o tsv)
          fqdn=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          info=$(curl --fail --silent --show-error "https://${fqdn}/build-info.json")
          grep -Fq "$expected_sha" <<< "$info" || {
            echo 'Serving app changed; refuse unreviewed tenant selection.' >&2; exit 1;
          }
          existing=$(az containerapp job show --name "$AZURE_MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].args | [0]" -o tsv)
          test "$existing" = scripts/run-production-migration-plan.sh || {
            echo 'Dedicated job is not resting in read-only plan mode.' >&2; exit 1;
          }
          json=$(az containerapp job show --name "$AZURE_MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0]" -o json)
          name=$(jq -r '.name' <<< "$json")
          cpu=$(jq -r '.resources.cpu' <<< "$json")
          memory=$(jq -r '.resources.memory' <<< "$json")
          server=$(jq -r '.env[]? | select(.name=="MSSQL_SERVER") | .value // empty' <<< "$json")
          database=$(jq -r '.env[]? | select(.name=="MSSQL_DATABASE") | .value // empty' <<< "$json")
          for v in name cpu memory server database; do
            if [ -z "${!v:-}" ] || [ "${!v}" = "null" ]; then echo "Missing $v" >&2; exit 1; fi
          done
          principal=$(az containerapp job identity show --name "$AZURE_MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" --query principalId -o tsv)
          test -n "$principal" && test "$principal" != None || {
            echo 'Dedicated managed identity missing.' >&2; exit 1;
          }
          image=$(az containerapp revision show --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" --revision "$revision" \
            --query "properties.template.containers[0].image" -o tsv)
          encoded=$(base64 -w0 scripts/inspect-i02-demo-tenant-readiness.mjs)
          read_command="cd /app && node -e \"eval(Buffer.from('$encoded','base64').toString('utf8'))\""
          # JSON is valid YAML; supplying the complete template avoids the
          # CLI's ambiguous parsing of a literal -c startup argument. Only
          # this execution is overridden; the resting job stays plan-only.
          template=$(mktemp --suffix=.yaml)
          trap 'rm -f "$template"' EXIT
          az containerapp job show --name "$AZURE_MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.template -o json | \
            jq --arg cmd "$read_command" --arg image "$image" \
               --arg server "$server" --arg database "$database" \
              '.containers[0].image=$image |
               .containers[0].command=["/bin/sh"] |
               .containers[0].args=["-c",$cmd] |
               .containers[0].env=[
                 {"name":"MSSQL_SERVER","value":$server},
                 {"name":"MSSQL_DATABASE","value":$database},
                 {"name":"MSSQL_AUTHENTICATION","value":"managed-identity"},
                 {"name":"INVOICE_IMMUTABLE_ARCHIVE_ENABLED","value":"false"}
               ]' > "$template"
          # Inspect only the already-failed execution. Do not start a new job.
          execution=khrental-db-migrator-i0gtif7
          name="$name"
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          az containerapp job logs show --name "$AZURE_MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" --execution "$execution" \
            --container "$name" --tail 100 --format text > "$log"
          grep -Ei 'failed|error|exception|syntax|missing|I02_DEMO|sqlserver|MODULE_NOT_FOUND|Cannot find|unexpected' "$log" | cut -c 1-400 | tail -30
          echo "I02_PREVIOUS_FAILURE_LOG_INSPECTED"
