name: I02 read-only demo tenant selection

on:
  push:
    branches: [diagnostics/i02-select-demo-tenant-20261023]

permissions:
  contents: read
  id-token: write

concurrency:
  group: khrental-i02-demo-tenant-selection
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app

jobs:
  discovery:
    if: github.repository == 'WasanthaK/khrental' && github.ref == 'refs/heads/diagnostics/i02-select-demo-tenant-20261023'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Azure sign-in
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Select one candidate from production app, READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          revision=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestReadyRevisionName -o tsv)
          fqdn=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          info=$(curl --fail --silent --show-error "https://${fqdn}/build-info.json")
          # Compare read-only diagnostic against the last verified deployed image.
          grep -Fq 'cd4855799df2745f3e892d7ddb81d2674e5e2490' <<< "$info" || {
            echo 'Serving app changed; refuse an unreviewed tenant selection.' >&2; exit 1;
          }
          encoded=$(base64 -w0 scripts/inspect-i02-demo-tenant-readiness.mjs)
          command="node -e \"eval(Buffer.from('$encoded','base64').toString('utf8'))\""
          exec_command="az containerapp exec --name '$AZURE_CONTAINER_APP_NAME' --resource-group '$AZURE_RESOURCE_GROUP' --revision '$revision' --command '$command'"
          script -q -e -c "$exec_command" /dev/null | tee tenant-selection-evidence.txt
          grep -Fq 'I02_DEMO_TENANT_READ_ONLY_OK' tenant-selection-evidence.txt
          if grep -Fq 'I02_DEMO_TENANT_READ_ONLY_FAILED' tenant-selection-evidence.txt; then exit 1; fi
          {
            echo '### I02 read-only demo-tenant discovery'
            echo 'No PII fields selected; no SQL writes, invoice operations or feature flag changes.'
          } >> "$GITHUB_STEP_SUMMARY"
