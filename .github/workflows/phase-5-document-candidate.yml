name: Phase 5 document release candidate

on:
  push:
    branches:
      - phase-5-release-hardening

permissions:
  contents: write

jobs:
  document:
    if: github.event.head_commit.message == 'Phase 5 trigger candidate documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5-release-hardening
          fetch-depth: 0
      - name: Update canonical execution plan
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/EXECUTION-PLAN.md')
          text = path.read_text()
          text = text.replace('**Status date:** 2026-09-22', '**Status date:** 2026-09-23', 1)

          unresolved = """- [ ] Password-reset flow needs a fresh end-to-end regression check.\n- [ ] Agreement signature placement/lifecycle needs focused review against the business requirement; the previously working marker/AutoStamp behavior must be compared with the current Evia path.\n- [ ] Remaining compatibility-client usage has not yet been migrated domain-by-domain.\n\n---\n"""
          prepared = """- [ ] Password-reset flow still needs physical end-to-end acceptance, but the hardening implementation is prepared off main and regression-tested.\n- [ ] Agreement signature placement/lifecycle still needs physical Evia acceptance, but the proven marker/AutoStamp implementation is prepared off main with automated placement coverage.\n- [ ] Compatibility-client storage removal is prepared off main across document, payment-proof, utility, maintenance, admin tooling, and legacy Evia storage domains; production acceptance remains blocked by P0.3.\n\n### Prepared release-hardening candidate — **NOT MERGED / NOT DEPLOYED**\n\n- Candidate branch: `phase-5-release-hardening`.\n- Integrated candidate before documentation: `55aa191468ec5f94de5e7f2217a5a22a437c2cf9`.\n- Includes P0.4 password-reset hardening, Phase 1 renter integrity, Phase 2 Evia AutoStamp placement restoration, Phase 3 document storage cleanup, Phase 4 storage-domain cleanup, compatibility-storage shim retirement, and aggregate release regression coverage.\n- All component draft branches passed their own authorization/build gates; the final integrated draft PR must still pass the complete exact-head CI gate.\n- `docs/RELEASE-HARDENING-ACCEPTANCE-STORIES.md` is the physical acceptance pack for RH-01 through RH-16.\n- This candidate does **not** change the production baseline and must not be merged/deployed before P0.3 US-INV-01 through US-INV-09 pass.\n\n---\n"""
          if unresolved not in text:
              raise SystemExit('Expected unresolved-area marker not found')
          text = text.replace(unresolved, prepared, 1)

          text = text.replace(
              '### P0.4 - Password reset regression\n',
              '### P0.4 - Password reset regression — **IMPLEMENTATION PREPARED OFF MAIN / PHYSICAL ACCEPTANCE PENDING**\n',
              1
          )
          p04_exit = 'Exit criteria: a clean end-to-end password reset works from a logged-out browser session.\n'
          p04_note = """Prepared implementation evidence:\n\n- [x] Reset links validate the recovery token before showing the password-entry form.\n- [x] Recovery reads are non-cacheable and the anonymous reset route remains isolated from tenant/application initialization.\n- [x] Regression coverage locks atomic credential update, single-use token consumption, and prior-session revocation.\n- [ ] Physical RH-01 acceptance is still required before P0.4 can complete.\n\nExit criteria: a clean end-to-end password reset works from a logged-out browser session.\n"""
          if p04_exit not in text:
              raise SystemExit('P0.4 exit marker not found')
          text = text.replace(p04_exit, p04_note, 1)

          text = text.replace(
              '## Phase 1 - Tenant/rentee workflow integrity\n',
              '## Phase 1 - Tenant/rentee workflow integrity — **IMPLEMENTATION PREPARED OFF MAIN / PHYSICAL ACCEPTANCE PENDING**\n',
              1
          )
          phase1_exit = "- [ ] Tenant and Team onboarding paths are clearly separated.\n"
          phase1_note = """- [ ] Tenant and Team onboarding paths are clearly separated.\n\nPrepared implementation evidence:\n\n- [x] Canonical renter persistence/list/detail paths are tightened and regression-covered.\n- [x] Existing global identity attachment and renter property-assignment persistence are implemented on the candidate.\n- [x] Tenant-side platform-admin escalation remains blocked by authorization checks.\n- [ ] RH-02 through RH-05 physical acceptance is still required.\n"""
          if phase1_exit not in text:
              raise SystemExit('Phase 1 exit marker not found')
          text = text.replace(phase1_exit, phase1_note, 1)

          text = text.replace(
              '## Phase 2 - Agreement generation and digital signing\n',
              '## Phase 2 - Agreement generation and digital signing — **IMPLEMENTATION PREPARED OFF MAIN / PHYSICAL ACCEPTANCE PENDING**\n',
              1
          )
          phase2_exit = 'Exit criteria: both signatures consistently appear in the intended agreement locations and the fully signed document is retained and linked to the agreement lifecycle.\n'
          phase2_note = """Prepared implementation evidence:\n\n- [x] V2 OAuth/token behavior is preserved while the send path delegates to the previously proven type-3 AutoStamp placement implementation.\n- [x] Automated placement coverage locks the landlord/tenant marker contract.\n- [x] Existing Evia CI workflows passed on the prepared signing branch.\n- [ ] RH-06 through RH-08 physical agreement/signing acceptance is still required.\n\nExit criteria: both signatures consistently appear in the intended agreement locations and the fully signed document is retained and linked to the agreement lifecycle.\n"""
          if phase2_exit not in text:
              raise SystemExit('Phase 2 exit marker not found')
          text = text.replace(phase2_exit, phase2_note, 1)

          text = text.replace(
              '## Phase 3 - Document/storage domain cleanup\n',
              '## Phase 3 - Document/storage domain cleanup — **IMPLEMENTATION PREPARED OFF MAIN / PHYSICAL ACCEPTANCE PENDING**\n',
              1
          )
          text = text.replace('- [ ] Review `DocumentService` / agreement document storage.', '- [x] Review `DocumentService` / agreement document storage.', 1)
          text = text.replace('- [ ] Route agreement document storage through explicit KH Rentals storage APIs.', '- [x] Route agreement document storage through explicit KH Rentals storage APIs.', 1)
          text = text.replace('- [ ] Preserve tenant-scoped R2 paths and cross-tenant protections.', '- [x] Preserve tenant-scoped R2 paths and cross-tenant protections.', 1)
          text = text.replace('- [ ] Remove only the compatibility dependency for this domain.', '- [x] Remove only the compatibility dependency for this domain.', 1)
          phase3_exit = 'Exit criteria: agreement/document storage no longer depends on the compatibility storage shape and signing behavior remains unchanged.\n'
          phase3_note = """Prepared implementation evidence:\n\n- [x] Agreement/document storage uses the explicit tenant storage service on the candidate.\n- [x] Raw storage delivery is tenant-authorized and regression-covered.\n- [ ] RH-08 and RH-09 physical storage/signing acceptance is still required.\n\nExit criteria: agreement/document storage no longer depends on the compatibility storage shape and signing behavior remains unchanged.\n"""
          if phase3_exit not in text:
              raise SystemExit('Phase 3 exit marker not found')
          text = text.replace(phase3_exit, phase3_note, 1)

          text = text.replace(
              '## Phase 4 - Remaining compatibility-client removal\n',
              '## Phase 4 - Remaining compatibility-client removal — **IMPLEMENTATION PREPARED OFF MAIN / PHYSICAL ACCEPTANCE PENDING**\n',
              1
          )
          phase4_marker = 'Do **not** perform a repo-wide rewrite.\n'
          phase4_note = """Do **not** perform a repo-wide rewrite.\n\nPrepared domains on the integrated candidate:\n\n- [x] Payment-proof storage uses explicit tenant storage.\n- [x] Utility-reading/meter media uses explicit tenant storage.\n- [x] Maintenance card no longer contains the dead compatibility URL fallback.\n- [x] Admin storage explorer/tooling uses explicit KH storage APIs; bucket mutation routes require administrator authorization.\n- [x] Legacy Evia signed-document persistence uses explicit tenant storage.\n- [x] Application consumers of `platformClient.storage` are removed and the compatibility storage shim/aliases are retired on the integrated candidate.\n- [x] Aggregate regression coverage prevents normal application code from reintroducing the compatibility storage path.\n- [ ] RH-10 through RH-14 physical acceptance is still required.\n"""
          if phase4_marker not in text:
              raise SystemExit('Phase 4 marker not found')
          text = text.replace(phase4_marker, phase4_note, 1)

          text = text.replace(
              '## Phase 5 - Product regression and release hardening\n',
              '## Phase 5 - Product regression and release hardening — **INTEGRATED CANDIDATE PREPARED / CI AND PHYSICAL ACCEPTANCE PENDING**\n',
              1
          )
          phase5_body = 'After the core flows above are stable, run focused regression passes for Platform Admin, properties/units, billing/invoices/receipts, maintenance lifecycle, notifications/email, agreement cancellation/deletion, and authorization boundaries.\n'
          phase5_note = """After the core flows above are stable, run focused regression passes for Platform Admin, properties/units, billing/invoices/receipts, maintenance lifecycle, notifications/email, agreement cancellation/deletion, and authorization boundaries.\n\nPrepared evidence:\n\n- [x] The off-main integration branch assembled P0.4 through Phase 4 product code without product-code merge conflicts.\n- [x] Storage-domain test additions were consolidated into one aggregate regression file.\n- [x] `tests/release-hardening.test.js` is wired into `npm run test:authorization`.\n- [x] `docs/RELEASE-HARDENING-ACCEPTANCE-STORIES.md` defines RH-01 through RH-16.\n- [ ] The exact final integrated PR head must pass full CI/build/Evia checks.\n- [ ] RH-01 through RH-15 must pass before production acceptance.\n- [ ] RH-16 must pass after any authorized production deployment.\n"""
          if phase5_body not in text:
              raise SystemExit('Phase 5 marker not found')
          text = text.replace(phase5_body, phase5_note, 1)

          path.write_text(text)
          PY
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase-5-document-candidate.yml
          git add docs/EXECUTION-PLAN.md .github/workflows/phase-5-document-candidate.yml
          git commit -m "Document prepared release-hardening candidate"
          git push origin HEAD:phase-5-release-hardening
