name: Phase 4 admin storage tooling refactor

on:
  push:
    branches:
      - phase-4-admin-storage-tooling

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-admin-storage-tooling
          fetch-depth: 0
      - name: Apply focused admin storage refactor
        run: python scripts/phase4_admin_storage.py
      - name: Commit refactor
        run: |
          rm .github/workflows/phase-4-admin-storage.yml scripts/phase4_admin_storage.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 4 harden admin storage tooling"
          git push origin HEAD:phase-4-admin-storage-tooling
