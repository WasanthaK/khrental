name: Verify production migrations on SQL Server

on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'scripts/run-production-migrations.mjs'
      - 'scripts/inspect-property-enquiries-schema.mjs'
      - 'scripts/inspect-property-viewings-schema.mjs'
      - 'scripts/inspect-property-applications-schema.mjs'
      - 'scripts/inspect-rental-offers-schema.mjs'
      - 'scripts/inspect-management-billing-schema.mjs'
      - 'scripts/inspect-management-billing-access.mjs'
      - 'scripts/check-management-billing-release.mjs'
      - 'scripts/test-management-billing-sql.mjs'
      - 'scripts/test-management-recovery-sql.mjs'
      - 'src/api/managementBilling/**'
      - 'scripts/test-production-migrations-sqlserver.mjs'
      - '.github/workflows/verify-production-migrations-sqlserver.yml'
      - '.github/workflows/run-production-db-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'scripts/run-production-migrations.mjs'
      - 'scripts/inspect-property-enquiries-schema.mjs'
      - 'scripts/inspect-property-viewings-schema.mjs'
      - 'scripts/inspect-property-applications-schema.mjs'
      - 'scripts/inspect-rental-offers-schema.mjs'
      - 'scripts/inspect-management-billing-schema.mjs'
      - 'scripts/inspect-management-billing-access.mjs'
      - 'scripts/check-management-billing-release.mjs'
      - 'scripts/test-management-billing-sql.mjs'
      - 'scripts/test-management-recovery-sql.mjs'
      - 'src/api/managementBilling/**'
      - 'scripts/test-production-migrations-sqlserver.mjs'
      - '.github/workflows/verify-production-migrations-sqlserver.yml'
      - '.github/workflows/run-production-db-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('khrental-migration-proof-pr-{0}', github.event.pull_request.number) || format('khrental-migration-proof-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  sqlserver-proof:
    name: SQL Server migration execution proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute pending production migrations against disposable SQL Server 2022
        env:
          MSSQL_TEST_IMAGE: mcr.microsoft.com/mssql/server:2022-latest
        run: node scripts/test-production-migrations-sqlserver.mjs
