name: Phase 3 document storage refactor

on:
  push:
    branches:
      - phase-3-document-storage

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-document-storage
          fetch-depth: 0
      - name: Apply focused storage refactor
        run: python scripts/phase3_refactor.py
      - name: Commit refactor
        run: |
          rm .github/workflows/phase-3-refactor.yml scripts/phase3_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 3 route agreement documents through tenant storage API"
          git push origin HEAD:phase-3-document-storage
