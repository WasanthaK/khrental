name: R5 inspect deployed LK issuer attempt
on:
  workflow_dispatch:
    inputs:
      expected_build:
        description: Exact serving main SHA containing this reviewed read-only inspection
        required: true
        type: string
      operation_id:
        description: UUID of the ambiguous issuer-cutover operation to reconcile
        required: true
        type: string
      confirmation:
        description: INSPECT-DEPLOYED-LK-ISSUER
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: khrental-production
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: khrental-prod-rg
      AZURE_CONTAINER_APP_NAME: khrental-app
      EXPECTED_BUILD: ${{ inputs.expected_build }}
      OPERATION_ID: ${{ inputs.operation_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify exact reviewed and serving source
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = INSPECT-DEPLOYED-LK-ISSUER
          [[ "$EXPECTED_BUILD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OPERATION_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]
          test "$EXPECTED_BUILD" = "$GITHUB_SHA"
          node --check scripts/inspect-deployed-lk-issuer-attempt.mjs
          curl -fsS --retry 3 --retry-delay 3 --max-time 30 https://app.quixo.homes/build-info.json |
            jq -e --arg sha "$EXPECTED_BUILD" '.buildSha==$sha'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 3d42a180-fda5-4013-afcc-fdba10266f9b
      - name: Inspect exact operation without writes
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          app=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" -o json)
          revision=$(jq -er '.properties.latestReadyRevisionName' <<<"$app")
          test "$(jq -r '.properties.latestRevisionName' <<<"$app")" = "$revision"
          image=$(az containerapp revision show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" \
            --revision "$revision" --query 'properties.template.containers[0].image' -o tsv)
          test "${image##*:}" = "$EXPECTED_BUILD"
          command="R5_LK_ISSUER_OPERATION=$OPERATION_ID node /app/scripts/inspect-deployed-lk-issuer-attempt.mjs"
          printf -v invocation '%q ' az containerapp exec -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" \
            --revision "$revision" --command "$command"
          script -q -e -c "$invocation" /dev/null | tee lk-issuer-reconciliation.txt
          if grep -Fq 'LK_ISSUER_RECONCILIATION_FAILED=' lk-issuer-reconciliation.txt; then exit 1; fi
          grep -Eo 'LK_ISSUER_RECONCILIATION=\{.*\}' lk-issuer-reconciliation.txt | tr -d '\r' |
            sed 's/^LK_ISSUER_RECONCILIATION=//' > lk-issuer-reconciliation-summary.json
          jq -e '.readOnly and .safeToRetry and .liveChargingEnabled==false and
            ([.sql[]]|all(.==0)) and .provider.clocks==0 and .provider.customers==0 and
            .provider.liveObjects==0' lk-issuer-reconciliation-summary.json
          curl -fsS --retry 3 --retry-delay 3 --max-time 30 https://app.quixo.homes/api/mssql/health |
            jq -e '.ok and .connection=="ready"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r5-deployed-lk-issuer-reconciliation
          path: |
            lk-issuer-reconciliation.txt
            lk-issuer-reconciliation-summary.json
          if-no-files-found: ignore
          retention-days: 30
