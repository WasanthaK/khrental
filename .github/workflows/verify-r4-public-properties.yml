name: Verify R4 default-public listings
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/api/publicListings/**'
      - 'marketing/assets/public-listing-client.mjs'
      - 'tests/public-listing*.test.js'
      - 'migrations/20261026_01_public_listing_preferences.sql'
      - 'scripts/test-public-listings-sqlserver.mjs'
      - 'server.js'
      - '.github/workflows/verify-r4-public-properties.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  availability-and-opt-out:
    name: Default-public visibility and privacy boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax validation
        run: |
          node --check server.js
          node --check src/api/publicListings/contract.js
          node --check src/api/publicListings/eligibility.js
          node --check src/api/publicListings/store.js
          node --check src/api/publicListings/router.js
          node --check src/api/publicListings/rateLimit.js
          node --check src/api/publicListings/media.js
          node --check src/api/publicListings/sourceImages.js
          node --check src/api/publicListings/processor.js
          node --check marketing/assets/public-listing-client.mjs
      - name: Public eligibility and API isolation tests
        run: node --test tests/public-listing-eligibility.test.js tests/public-listing-projection.test.js tests/public-listing-router.test.js tests/public-listing-media.test.js tests/public-listing-processor.test.js
      - name: Produce pinned Sharp lockfile dependency manifest for review
        run: |
          cp package-lock.json /tmp/r4-package-lock-before.json
          npm install sharp@0.34.4 --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/r4-package-lock-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const changed=Object.fromEntries(Object.entries(after.packages).filter(([k,v])=>
            JSON.stringify(before.packages[k])!==JSON.stringify(v)));
          console.log('SHARP_LOCK_DELTA='+JSON.stringify({version:after.lockfileVersion,changed}));
          NODE
      - name: Install and execute real native image re-encode tests
        run: |
          npm install --no-save --package-lock=false sharp@0.34.4 --no-audit --no-fund
          node --test tests/public-listing-sharp.test.js
      - name: Verify migration, tenant isolation, availability and opt-out on disposable SQL Server
        env:
          MSSQL_TEST_IMAGE: mcr.microsoft.com/mssql/server:2022-latest
        run: node scripts/test-public-listings-sqlserver.mjs
      - name: Show default-OFF flags
        run: |
          echo "PUBLIC_LISTING_READ_ENABLED default OFF"
          echo "PUBLIC_LISTING_SHARED_RATE_LIMIT_READY default OFF"
          echo "PUBLIC_LISTING_MANAGEMENT_ENABLED default OFF"
          echo "No data migration applied; no real property was published."
