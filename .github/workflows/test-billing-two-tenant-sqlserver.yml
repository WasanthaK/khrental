name: Disposable two-tenant SQL Server billing acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test-billing-two-tenant-sqlserver.mjs'
      # Maintenance business contracts are exercised by the same disposable
      # two-tenant SQL/Puppeteer harness; runtime edits must trigger this gate.
      - 'scripts/verify-phase4-staff-maintenance-http.mjs'
      - 'src/api/platform/maintenanceLifecycleRouter.js'
      - 'src/api/platform/maintenanceNotificationWriter.js'
      - 'scripts/verify-phase4-notification-inbox-browser.mjs'
      - 'scripts/verify-phase4-agreement-signed-document-browser.mjs'
      - 'src/api/platform/invoiceDeliveryState.js'
      - 'src/components/invoices/InvoiceDraftEditor.jsx'
      - 'src/pages/InvoiceDetails.jsx'
      - 'src/services/platformClient.js'
      - 'src/api/platform/billingRouter.js'
      - 'scripts/verify-phase4-payment-lifecycle-http.mjs'
      - 'src/components/agreements/AgreementDocument.jsx'
      - 'src/hooks/useAuthenticatedAgreementDocument.js'
      - 'src/pages/AgreementDetails.jsx'
      - 'scripts/validate-r2-connection.mjs'
      - 'src/api/evia/signedDocumentAccess.js'
      - 'src/api/mssql/agreementWritePolicy.js'
      - 'src/api/mssql/router.js'
      - 'src/api/storage/authenticatedTenantRoute.js'
      - 'src/api/platform/paymentProofAccess.js'
      - 'src/hooks/useAuthenticatedPaymentProof.js'
      - 'src/components/invoices/PaymentVerification.jsx'
      - 'src/services/paymentService.js'
      - 'scripts/verify-phase4-payment-lifecycle-http.mjs'
      - 'src/pages/Notifications.jsx'
      - 'src/routes.jsx'
      - 'src/components/layouts/DashboardLayout.jsx'
      - 'src/components/layouts/RenteePortalLayout.jsx'
      - 'src/services/maintenanceLifecycleClient.js'
      - 'src/services/maintenanceImageAttachment.js'
      - 'src/services/maintenanceImageService.js'
      - 'src/services/maintenanceService.js'
      - 'tests/phase4-maintenance-image-compatibility.test.js'
      - 'src/components/maintenance/StaffAssignment.jsx'
      - 'src/components/maintenance/MaintenanceRequestForm.jsx'
      - 'src/services/maintenancePropertyEligibility.js'
      - 'tests/phase4-maintenance-property-eligibility.test.js'
      - 'src/pages/MaintenanceDetails.jsx'
      - 'src/pages/MaintenanceList.jsx'
      - 'src/pages/rentee/RenteeMaintenance.jsx'
      - 'src/api/platform/maintenanceListScope.js'
      - 'src/services/maintenanceListReadService.js'
      - 'tests/phase4-maintenance-list-isolation.test.js'
      - 'src/pages/rentee/RenteeMaintenanceDetails.jsx'
      - 'src/services/maintenanceDetailReadService.js'
      - 'src/services/maintenanceProjectionMapper.js'
      - 'tests/phase4-maintenance-detail-read-authority.test.js'
      - 'scripts/verify-utility-review-transitions.mjs'
      - 'src/api/platform/utilityReviewRouter.js'
      - 'scripts/verify-evia-real-session-audit-http.mjs'
      - 'src/api/platform/monthlyBillingService.js'
      - 'src/api/platform/billingLifecycle.js'
      - 'src/api/mssql/repositories.js'
      - 'migrations/**'
      - 'src/api/storage/authenticatedTenantRoute.js'
      - 'tests/evia-audit-http.test.js'
      - '.github/workflows/test-billing-two-tenant-sqlserver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-tenant-sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check scripts/test-billing-two-tenant-sqlserver.mjs
      - name: Execute disposable SQL Server billing acceptance
        run: npm run test:billing:sqlserver
