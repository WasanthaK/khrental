name: Disposable two-tenant SQL Server billing acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test-billing-two-tenant-sqlserver.mjs'
      # Maintenance business contracts are exercised by the same disposable
      # two-tenant SQL/Puppeteer harness; runtime edits must trigger this gate.
      - 'scripts/verify-phase4-staff-maintenance-http.mjs'
      - 'src/api/platform/maintenanceLifecycleRouter.js'
      - 'src/api/platform/maintenanceNotificationWriter.js'
      - 'scripts/verify-phase4-notification-inbox-browser.mjs'
      - 'scripts/verify-phase4-agreement-signed-document-browser.mjs'
      - 'src/api/evia/signedDocumentAccess.js'
      - 'src/api/mssql/router.js'
      - 'src/api/storage/authenticatedTenantRoute.js'
      - 'src/pages/Notifications.jsx'
      - 'src/routes.jsx'
      - 'src/components/layouts/DashboardLayout.jsx'
      - 'src/components/layouts/RenteePortalLayout.jsx'
      - 'src/services/maintenanceLifecycleClient.js'
      - 'src/components/maintenance/StaffAssignment.jsx'
      - 'src/pages/MaintenanceDetails.jsx'
      - 'scripts/verify-utility-review-transitions.mjs'
      - 'src/api/platform/utilityReviewRouter.js'
      - 'scripts/verify-evia-real-session-audit-http.mjs'
      - 'src/api/platform/monthlyBillingService.js'
      - 'src/api/platform/billingLifecycle.js'
      - 'src/api/mssql/repositories.js'
      - 'migrations/**'
      - 'src/api/storage/authenticatedTenantRoute.js'
      - 'tests/evia-audit-http.test.js'
      - '.github/workflows/test-billing-two-tenant-sqlserver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-tenant-sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check scripts/test-billing-two-tenant-sqlserver.mjs
      - name: Execute disposable SQL Server billing acceptance
        run: npm run test:billing:sqlserver
