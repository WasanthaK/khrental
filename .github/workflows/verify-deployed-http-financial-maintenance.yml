name: Scoped public HTTP financial and maintenance acceptance
on:
  workflow_dispatch:
    inputs:
      inspect_only:
        description: Read-only fixture schema inspection; no enforcement changes or acceptance run
        type: boolean
        default: false
        required: true
      expected_build:
        description: Exact accepted serving application SHA
        required: true
        type: string
      operation_id:
        description: New isolated fixture UUID; never rerun a partially created fixture
        required: true
        type: string
      confirmation:
        description: VERIFY-FINANCIAL-MAINTENANCE
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: khrental-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_BUILD: ${{ inputs.expected_build }}
      OPERATION_ID: ${{ inputs.operation_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate exact request and unchanged deployed implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = VERIFY-FINANCIAL-MAINTENANCE
          [[ "$EXPECTED_BUILD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OPERATION_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]
          curl -fsS --max-time 30 https://app.quixo.homes/build-info.json | jq -e --arg sha "$EXPECTED_BUILD" '.buildSha==$sha'
          git merge-base --is-ancestor "$EXPECTED_BUILD" "$GITHUB_SHA"
          while IFS= read -r changed; do
            case "$changed" in
              docs/*|*.md|tests/*|.github/workflows/inspect-r5-genuine-customer-attempt.yml|.github/workflows/verify-deployed-customer-create-recovery.yml|.github/workflows/verify-r5-customer-fixture-rollback.yml|.github/workflows/verify-r5-customer-recovery-preflight.yml|scripts/inspect-r5-genuine-customer-attempt.mjs|scripts/verify-deployed-customer-create-recovery.mjs|scripts/verify-r5-customer-fixture-rollback.mjs|.github/workflows/inspect-management-recovery.yml|.github/workflows/verify-deployed-portal-recovery.yml|scripts/verify-deployed-portal-recovery.mjs|.github/workflows/verify-deployed-delayed-failure.yml|scripts/verify-deployed-delayed-failure.mjs|.github/workflows/verify-deployed-grace-recovery.yml|scripts/verify-deployed-grace-recovery.mjs|.github/workflows/verify-deployed-http-enforcement.yml|scripts/verify-deployed-http-enforcement.mjs|.github/workflows/verify-deployed-http-financial-maintenance.yml|scripts/verify-deployed-http-financial-maintenance.mjs) ;;
              *) echo "Unverified runtime difference: $changed" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$EXPECTED_BUILD" "$GITHUB_SHA")
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 3d42a180-fda5-4013-afcc-fdba10266f9b
      - name: Temporarily scope serving HTTP enforcement to the new fixture
        if: inputs.inspect_only != true
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          az containerapp show -g khrental-prod-rg -n khrental-app -o json > "$RUNNER_TEMP/enforcement-before.json"
          jq -e '.properties.configuration.activeRevisionsMode=="Single" and
            .properties.latestRevisionName==.properties.latestReadyRevisionName and
            .properties.template.scale.minReplicas==1 and .properties.template.scale.maxReplicas==1' "$RUNNER_TEMP/enforcement-before.json" >/dev/null
          jq '[.properties.template.containers[0].env[]? | select(.name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED" or .name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_TENANT_IDS")]' "$RUNNER_TEMP/enforcement-before.json" > "$RUNNER_TEMP/enforcement-original.json"
          jq -e 'all(.[]; has("value")) and all(.[]; .name!="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED" or .value=="false")' "$RUNNER_TEMP/enforcement-original.json" >/dev/null
          image=$(jq -r '.properties.template.containers[0].image' "$RUNNER_TEMP/enforcement-before.json")
          test "${image##*:}" = "$EXPECTED_BUILD"
          echo 'RESTORE_ENFORCEMENT=true' >> "$GITHUB_ENV"
          az containerapp update -g khrental-prod-rg -n khrental-app --set-env-vars "MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED=true" "MANAGEMENT_BILLING_WRITE_ENFORCEMENT_TENANT_IDS=$OPERATION_ID" -o none
          ready=false
          for attempt in $(seq 1 60); do
            az containerapp show -g khrental-prod-rg -n khrental-app -o json > "$RUNNER_TEMP/enforcement-ready.json"
            if jq -e '.properties.latestRevisionName==.properties.latestReadyRevisionName' "$RUNNER_TEMP/enforcement-ready.json" >/dev/null; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true
          jq -e --arg id "$OPERATION_ID" 'any(.properties.template.containers[0].env[]; .name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED" and .value=="true") and any(.properties.template.containers[0].env[]; .name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_TENANT_IDS" and .value==$id)' "$RUNNER_TEMP/enforcement-ready.json" >/dev/null
          jq -r '"HTTP_SCOPE_ENABLED="+.properties.latestReadyRevisionName' "$RUNNER_TEMP/enforcement-ready.json" > enforcement-config.txt
      - name: Inspect fixture schema without writes
        if: inputs.inspect_only == true
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          revision=$(az containerapp show -g khrental-prod-rg -n khrental-app --query properties.latestReadyRevisionName -o tsv)
          image=$(az containerapp revision show -g khrental-prod-rg -n khrental-app --revision "$revision" --query 'properties.template.containers[0].image' -o tsv)
          test "${image##*:}" = "$EXPECTED_BUILD"
          command="node --input-type=module -e \"const{getMssqlPool,closeMssqlPool}=await import('/app/src/api/mssql/pool.js');try{const p=await getMssqlPool();const r=await p.request().query(Buffer.from('U0VMRUNUIFRBQkxFX05BTUUsQ09MVU1OX05BTUUsREFUQV9UWVBFLElTX05VTExBQkxFLENPTFVNTl9ERUZBVUxUIEZST00gSU5GT1JNQVRJT05fU0NIRU1BLkNPTFVNTlMgV0hFUkUgVEFCTEVfTkFNRSBJTigncHJvcGVydGllcycsJ2FwcF91c2VycycsJ2FncmVlbWVudHMnLCdtYWludGVuYW5jZV9yZXF1ZXN0cycpIE9SREVSIEJZIFRBQkxFX05BTUUsT1JESU5BTF9QT1NJVElPTg==','base64').toString());console.log('FIXTURE_SCHEMA='+JSON.stringify(r.recordset));console.log('INSPECT_PASS')}finally{await closeMssqlPool()}\""
          printf -v invocation '%q ' az containerapp exec -g khrental-prod-rg -n khrental-app --revision "$revision" --command "$command"
          script -q -e -c "$invocation" /dev/null | tee deployed-http.txt
          grep -Fq 'INSPECT_PASS' deployed-http.txt
      - name: Verify public HTTP writes and retained reads
        if: inputs.inspect_only != true
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          folder=$(mktemp -d); trap 'rm -rf "$folder"' EXIT
          az containerapp show -g khrental-prod-rg -n khrental-app -o json > "$folder/app"
          jq -e '.properties.configuration.activeRevisionsMode=="Single" and
            .properties.latestRevisionName==.properties.latestReadyRevisionName and
            .properties.template.scale.minReplicas==1 and .properties.template.scale.maxReplicas==1' "$folder/app" >/dev/null
          revision=$(jq -r '.properties.latestReadyRevisionName' "$folder/app")
          image=$(az containerapp revision show -g khrental-prod-rg -n khrental-app --revision "$revision" --query 'properties.template.containers[0].image' -o tsv)
          test "${image##*:}" = "$EXPECTED_BUILD"
          # Transfer only the bounded difference from the image-bundled harness.
          # Verify both original and corrected bytes before importing a temp file.
          git show "$EXPECTED_BUILD:scripts/verify-deployed-http-financial-maintenance.mjs" > "$folder/baseline.mjs"
          node --check scripts/verify-deployed-http-financial-maintenance.mjs
          original_digest=$(sha256sum "$folder/baseline.mjs" | cut -d ' ' -f 1)
          digest=$(sha256sum scripts/verify-deployed-http-financial-maintenance.mjs | cut -d ' ' -f 1)
          patch=$(node --input-type=module - "$folder/baseline.mjs" <<'JS'
          import {readFileSync} from 'node:fs';
          const a=readFileSync(process.argv[2],'utf8'),b=readFileSync('scripts/verify-deployed-http-financial-maintenance.mjs','utf8');
          let start=0,end=0;
          while(start<a.length&&start<b.length&&a[start]===b[start]){start++;}
          while(end<a.length-start&&end<b.length-start&&a[a.length-1-end]===b[b.length-1-end]){end++;}
          console.log(Buffer.from(JSON.stringify([start,a.length-end,b.slice(start,b.length-end)])).toString('base64url'));
          JS
          )
          command="node --input-type=module -e \"const fs=await import('node:fs');const hash=b=>(awaitCrypto.createHash('sha256').update(b).digest('hex'));const awaitCrypto=await import('node:crypto');const p='/app/scripts/verify-deployed-http-financial-maintenance.mjs';const b=fs.readFileSync(p);if(hash(b)!=='$original_digest')throw Error('Deployed harness mismatch');const [s,e,t]=JSON.parse(Buffer.from('$patch','base64url'));const a=b.toString();const c=a.slice(0,s)+t+a.slice(e);if(hash(c)!=='$digest')throw Error('Corrected harness mismatch');const f='/tmp/r5-http-$OPERATION_ID.mjs';fs.writeFileSync(f,c,{flag:'wx'});process.env.HTTP_ACCEPTANCE_TARGET=JSON.stringify({id:'$OPERATION_ID'});try{await import('file://'+f)}finally{fs.unlinkSync(f)}\""
          if [ "${#command}" -gt 2000 ]; then echo 'HTTP_BLOCKED=oversized_harness_patch' >&2; exit 1; fi
          printf -v invocation '%q ' az containerapp exec -g khrental-prod-rg -n khrental-app --revision "$revision" --command "$command"
          script -q -e -c "$invocation" /dev/null | tee deployed-http.txt
          marker=HTTP_PASS
          if grep -Eq 'HTTP_FAILED=|HTTP_CLEANUP_FAILED=' deployed-http.txt; then exit 1; fi
          grep -Eo 'HTTP_PASS=\{[^}]+\}' deployed-http.txt | tr -d '\r' > http-acceptance-summary.txt
          sed 's/^HTTP_PASS=//' http-acceptance-summary.txt | jq -e '.passed==true and .fixtureClosed==true and .protectedBillingFixturesUnchanged==true and .stripeWrites==0 and (.checks|length)==20' >/dev/null
          echo "Serving revision: $revision" >> "$GITHUB_STEP_SUMMARY"
          cat http-acceptance-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Restore original HTTP enforcement configuration
        if: always() && env.RESTORE_ENFORCEMENT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for name in MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED MANAGEMENT_BILLING_WRITE_ENFORCEMENT_TENANT_IDS; do
            if jq -e --arg name "$name" 'any(.[]; .name==$name)' "$RUNNER_TEMP/enforcement-original.json" >/dev/null; then
              value=$(jq -r --arg name "$name" '.[] | select(.name==$name) | .value' "$RUNNER_TEMP/enforcement-original.json")
              args+=(--set-env-vars "$name=$value")
            else
              args+=(--remove-env-vars "$name")
            fi
          done
          # Separate set/remove lists avoid repeated argparse options dropping values.
          set_values=(); remove_names=()
          for ((i=0;i<${#args[@]};i+=2)); do
            if [ "${args[i]}" = --set-env-vars ]; then set_values+=("${args[i+1]}"); else remove_names+=("${args[i+1]}"); fi
          done
          restore=(); if [ "${#set_values[@]}" -gt 0 ]; then restore+=(--set-env-vars "${set_values[@]}"); fi
          if [ "${#remove_names[@]}" -gt 0 ]; then restore+=(--remove-env-vars "${remove_names[@]}"); fi
          az containerapp update -g khrental-prod-rg -n khrental-app "${restore[@]}" -o none
          ready=false
          for attempt in $(seq 1 60); do
            az containerapp show -g khrental-prod-rg -n khrental-app -o json > "$RUNNER_TEMP/enforcement-restored.json"
            if jq -e '.properties.latestRevisionName==.properties.latestReadyRevisionName' "$RUNNER_TEMP/enforcement-restored.json" >/dev/null; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true
          jq '[.properties.template.containers[0].env[]? | select(.name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED" or .name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_TENANT_IDS")] | sort_by(.name)' "$RUNNER_TEMP/enforcement-restored.json" > "$RUNNER_TEMP/enforcement-actual.json"
          jq 'sort_by(.name)' "$RUNNER_TEMP/enforcement-original.json" > "$RUNNER_TEMP/enforcement-expected.json"
          diff -u "$RUNNER_TEMP/enforcement-expected.json" "$RUNNER_TEMP/enforcement-actual.json"
          image=$(jq -r '.properties.template.containers[0].image' "$RUNNER_TEMP/enforcement-restored.json")
          test "${image##*:}" = "$EXPECTED_BUILD"
          curl -fsS --retry 4 --retry-delay 3 --max-time 30 https://app.quixo.homes/api/health >/dev/null
          jq -r '"HTTP_SCOPE_RESTORED="+.properties.latestReadyRevisionName' "$RUNNER_TEMP/enforcement-restored.json" | tee -a enforcement-config.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scoped-public-http-enforcement
          path: |
            deployed-http.txt
            enforcement-config.txt
          retention-days: 30
