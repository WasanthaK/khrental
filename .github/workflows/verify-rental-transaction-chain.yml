name: Verify renter-to-owner transaction chain (disposable acceptance)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-rental-transaction-chain.yml'
      - 'src/api/enquiries/**'
      - 'src/components/properties/PropertyViewing.jsx'
      - 'src/components/properties/PropertyApplication.jsx'
      - 'src/components/properties/PropertyOffer.jsx'
      - 'src/pages/PropertyEnquiry.jsx'
      - 'src/pages/OwnerEnquiries.jsx'
      - 'src/pages/RentalJourney.jsx'
      - 'src/api/platform/tenancyOnboardingRouter.js'
      - 'src/api/platform/tenancyActivation.js'
      - 'src/pages/TenancyOnboarding.jsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify identity, enquiry, viewing, application, offers and activation guards
        run: |
          node --test tests/owner-onboarding.test.js tests/seeker-session-continuation.test.js tests/property-enquiries.test.js tests/property-viewings.test.js tests/property-applications.test.js tests/rental-offers.test.js tests/tenancy-activation.test.js tests/agreement-signing-authority.test.js tests/manual-agreement-signing.test.js tests/payment-proof-access.test.js tests/maintenance-lifecycle.test.js tests/tenancy-exit.test.js
      - name: Disposable SQL concurrency, privacy, offers and agreement bridge
        env:
          PROPERTY_RENTAL_OFFERS_SCHEMA_READY: 'true'
        run: node scripts/test-property-enquiries-sqlserver.mjs
      - name: Real enquiry, owner inbox, viewing and application components
        env:
          ENQUIRY_PROOF_DIR: transaction-browser-proof
        run: node scripts/test-property-enquiries-browser.mjs
      - name: Real versioned offer, reservation and agreement-handoff components
        run: node scripts/test-rental-offers-browser.mjs
      - name: Verify exact application build
        run: npm run build
      - name: Distinguish test proof from unperformed production actions
        run: |
          echo 'TRANSACTION_SOURCE_ACCEPTANCE=PASS disposable_sql real_components agreement_activation_guards'
          echo 'REAL_CUSTOMER_ENQUIRY=NOT_TESTED'
          echo 'REAL_CUSTOMER_VIEWING=NOT_TESTED'
          echo 'REAL_CUSTOMER_APPLICATION=NOT_TESTED'
          echo 'REAL_CUSTOMER_OFFER=NOT_TESTED'
          echo 'REAL_EVIASIGN_SIGNATURE=NOT_TESTED'
          echo 'REAL_DEPOSIT_EVIDENCE=NOT_TESTED'
          echo 'REAL_TENANCY_ACTIVATION=NOT_TESTED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transaction-browser-proof
          path: |
            transaction-browser-proof/
            enquiry-browser-proof/
          if-no-files-found: ignore
