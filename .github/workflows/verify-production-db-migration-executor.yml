name: Verify production database migration executor

on:
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: strict
      confirmation:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: Pre-apply read-only executor preflight or post-apply strict acceptance
        required: true
        type: choice
        default: strict
        options:
          - preflight
          - strict
      confirmation:
        description: Type VERIFY-MIGRATION-EXECUTOR exactly
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: khrental-production-db-migration-executor
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app
  AZURE_MIGRATION_JOB_NAME: khrental-db-migrator
  VERIFICATION_MODE: ${{ inputs.mode }}

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - name: Validate explicit verification confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmation }}" != "VERIFY-MIGRATION-EXECUTOR" ]; then
            echo "Verification requires confirmation text VERIFY-MIGRATION-EXECUTOR." >&2
            exit 1
          fi
          case "$VERIFICATION_MODE" in
            preflight|strict) ;;
            *) echo "Unsupported verification mode; refusing execution." >&2; exit 1 ;;
          esac

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify isolated executor and read-only schema state
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          if ! az containerapp job show             --name "$AZURE_MIGRATION_JOB_NAME"             --resource-group "$AZURE_RESOURCE_GROUP"             --output none 2>/dev/null; then
            echo "Dedicated migration job is not provisioned." >&2
            exit 1
          fi

          stored_args=$(az containerapp job show             --name "$AZURE_MIGRATION_JOB_NAME"             --resource-group "$AZURE_RESOURCE_GROUP"             --query "properties.template.containers[0].args | [0]" -o tsv)
          if [ "$stored_args" != "scripts/run-production-migration-plan.sh" ]; then
            echo "Migration job is not resting in read-only plan mode." >&2
            exit 1
          fi

          principal_id=$(az containerapp job identity show             --name "$AZURE_MIGRATION_JOB_NAME"             --resource-group "$AZURE_RESOURCE_GROUP"             --query principalId -o tsv)
          if [ -z "$principal_id" ] || [ "$principal_id" = "None" ]; then
            echo "Dedicated migration job has no managed identity." >&2
            exit 1
          fi
          app_principal_id=$(az containerapp identity show             --name "$AZURE_CONTAINER_APP_NAME"             --resource-group "$AZURE_RESOURCE_GROUP"             --query principalId -o tsv)
          if [ -n "$app_principal_id" ] && [ "$app_principal_id" != "None" ] && [ "$principal_id" = "$app_principal_id" ]; then
            echo "Migration executor and serving app must not share an identity." >&2
            exit 1
          fi

          ready_revision=$(az containerapp show             --name "$AZURE_CONTAINER_APP_NAME"             --resource-group "$AZURE_RESOURCE_GROUP"             --query properties.latestReadyRevisionName -o tsv)
          image=$(az containerapp revision show             --name "$AZURE_CONTAINER_APP_NAME"             --resource-group "$AZURE_RESOURCE_GROUP"             --revision "$ready_revision"             --query "properties.template.containers[0].image" -o tsv)

          container_json=$(az containerapp job show             --name "$AZURE_MIGRATION_JOB_NAME"             --resource-group "$AZURE_RESOURCE_GROUP"             --query "properties.template.containers[0]" -o json)
          container_name=$(jq -r '.name // empty' <<<"$container_json")
          cpu=$(jq -r '.resources.cpu // empty' <<<"$container_json")
          memory=$(jq -r '.resources.memory // empty' <<<"$container_json")
          server=$(jq -r '.env[]? | select(.name == "MSSQL_SERVER") | .value // empty' <<<"$container_json")
          database=$(jq -r '.env[]? | select(.name == "MSSQL_DATABASE") | .value // empty' <<<"$container_json")

          # Schema acceptance must target the same database as the serving app.
          # Compare internally; do not publish connection values.
          app_env=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query 'properties.template.containers[0].env' -o json)
          app_server=$(jq -r '.[] | select(.name=="MSSQL_SERVER") | .value // empty' <<<"$app_env")
          app_database=$(jq -r '.[] | select(.name=="MSSQL_DATABASE") | .value // empty' <<<"$app_env")
          if [ -z "$app_server" ] || [ -z "$app_database" ] || [ "${server,,}" != "${app_server,,}" ] || [ "$database" != "$app_database" ]; then
            echo 'Executor and serving application database target could not be matched.' >&2
            exit 1
          fi

          for value in ready_revision image container_name cpu memory server database; do
            if [ -z "${!value:-}" ] || [ "${!value}" = "None" ]; then
              echo "Missing executor verification prerequisite: $value" >&2
              exit 1
            fi
          done

          # Both entrypoints are read-only and require the isolated identity.
          verification_script="scripts/run-production-migration-verify.sh"
          verification_marker="Strict read-only migration verification passed for 16 managed migrations;"
          if [ "$VERIFICATION_MODE" = "preflight" ]; then
            verification_script="scripts/run-production-migration-preflight.sh"
            verification_marker="Read-only executor preflight passed for 16 managed migrations;"
          fi

          # Per-execution overrides do not change the resting job definition.
          execution_name=$(az containerapp job start             --name "$AZURE_MIGRATION_JOB_NAME"             --resource-group "$AZURE_RESOURCE_GROUP"             --container-name "$container_name"             --image "$image"             --cpu "$cpu"             --memory "$memory"             --command /bin/sh             --args "$verification_script"             --env-vars               MSSQL_SERVER="$server"               MSSQL_DATABASE="$database"               MSSQL_MIGRATION_DEDICATED_EXECUTOR=true             --query name -o tsv)

          if [ -z "$execution_name" ]; then
            echo "Azure did not return a verification execution name." >&2
            exit 1
          fi

          echo "Read-only executor $VERIFICATION_MODE verification: $execution_name"
          echo "Image: $image"
          echo "Ready serving revision: $ready_revision"
          echo "Dedicated executor identity: $principal_id"

          # Retain curated status evidence in the GitHub run; never publish
          # raw SQL inspection details or full Container Apps logs.
          capture_verification_evidence() {
            local log_file
            log_file="$(mktemp)"
            local found=0

            # Container Apps log delivery can lag successful job completion.
            for evidence_attempt in $(seq 1 12); do
              if az containerapp job logs show \
                --name "$AZURE_MIGRATION_JOB_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --execution "$execution_name" \
                --container "$container_name" \
                --tail 200 \
                --format text > "$log_file" 2>/dev/null \
                && grep -Fq "$verification_marker" "$log_file"; then
                found=1
                break
              fi
              sleep 5
            done

            if [ "$found" -ne 1 ]; then
              echo "Executor succeeded but required $VERIFICATION_MODE evidence was unavailable. Do not claim acceptance." >&2
              rm -f "$log_file"
              return 1
            fi

            migration_ids="20260920_01_add_tenancy_billing_adjustments
            20260920_02_create_platform_admins
            20260920_03_backfill_legacy_app_user_memberships
            20260926_01_add_rentee_property_unit_associations
            20261005_01_add_property_utility_configs
            20261006_01_repair_auth_store_runtime_columns
            20261018_01_invoice_payment_references
            20261019_01_invoice_master_data
            20261020_01_immutable_invoice_pdf_archive
            20261023_01_create_public_signup_challenges
            20261024_01_create_public_signup_rate_limits
            20261026_02_property_iso_country
            20261026_01_public_listing_preferences
            20261028_01_property_enquiries
            20261028_02_property_viewings
            20261028_03_property_applications"

            for migration_id in $migration_ids; do
              if [ "$VERIFICATION_MODE" = "strict" ]; then
                if ! grep -Eq "VERIFY[[:space:]]+$migration_id[[:space:]]+LEDGERED[[:space:]]+SCHEMA_OK([[:space:]]|$)" "$log_file"; then
                  echo "Missing strict ledger/schema evidence for $migration_id." >&2
                  rm -f "$log_file"
                  return 1
                fi
              elif ! grep -Eq "PREFLIGHT[[:space:]]+$migration_id[[:space:]]+(LEDGERED|SATISFIED_UNTRACKED|PENDING)[[:space:]]" "$log_file"; then
                echo "Missing read-only preflight state for $migration_id." >&2
                rm -f "$log_file"
                return 1
              fi
            done

            {
              echo "### Production migration executor — $VERIFICATION_MODE read-only evidence"
              echo
              echo "Execution: $execution_name"
              echo "Serving revision: $ready_revision"
              echo "Serving image: $image"
              echo "Dedicated executor identity and migration permissions checked."
              echo
              if [ "$VERIFICATION_MODE" = "strict" ]; then
                echo "| Migration | Ledger | Schema |"
                echo "| --- | --- | --- |"
                for migration_id in $migration_ids; do
                  echo "| $migration_id | LEDGERED | SCHEMA_OK |"
                done
                echo
                echo "**16/16 ledger/schema checks passed.** Raw Azure logs are not published."
              else
                echo "Pre-apply preflight inspected all sixteen migrations with no database writes."
                echo "Preflight allows PENDING and SATISFIED_UNTRACKED. It does not certify an applied schema."
                echo "Production apply still requires separate authorization; strict acceptance must follow apply."
                echo "Raw Azure logs are not published."
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            echo "Retained sixteen redacted $VERIFICATION_MODE results for execution $execution_name."
            rm -f "$log_file"
          }

          # Poll at a conservative cadence to avoid Azure control-plane throttling.
          # A transient HTTP 429 is inconclusive: keep the existing execution
          # name and retry, never start a second job or claim verification.
          poll_error_file="$(mktemp)"
          trap 'rm -f "$poll_error_file"' EXIT
          for attempt in $(seq 1 36); do
            if status=$(az containerapp job execution show \
              --name "$AZURE_MIGRATION_JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --query properties.status -o tsv 2>"$poll_error_file"); then
              case "$status" in
                Succeeded)
                  capture_verification_evidence
                  echo "Read-only executor $VERIFICATION_MODE verification passed with sixteen retained migration results."
                  exit 0
                  ;;
                Failed|Stopped)
                  echo "Executor verification failed: $status; inspect execution logs." >&2
                  exit 1
                  ;;
                Running|Pending|Processing|Unknown|"")
                  echo "Executor has not reached a terminal state (attempt $attempt/36)."
                  ;;
                *)
                  echo "Executor returned nonterminal status: $status (attempt $attempt/36)."
                  ;;
              esac
            elif grep -Eqi 'Too Many Requests|(^|[^0-9])429([^0-9]|$)|throttl|RateLimitExceeded' "$poll_error_file"; then
              echo "Azure API throttled execution-status query (HTTP 429); retrying the same read-only execution (attempt $attempt/36)." >&2
            else
              echo "Azure execution-status query failed with a non-throttling error; no verification claim." >&2
              exit 1
            fi
            sleep 25
          done
          echo "Executor status could not be verified within the bounded polling window; no readiness claim." >&2
          exit 1
