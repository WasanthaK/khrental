name: Genuine sandbox paid inventory acceptance
on:
  pull_request:
    paths:
      - 'scripts/verify-deployed-paid-inventory.mjs'
      - '.github/workflows/verify-deployed-paid-inventory.yml'
  workflow_dispatch:
    inputs:
      expected_build:
        description: Exact accepted serving application SHA
        required: true
        type: string
      operation_id:
        description: Isolated synthetic fixture UUID (fresh except cleanup)
        required: true
        type: string
      scenario:
        description: Acceptance case (do not repeat an already accepted case)
        required: true
        type: choice
        default: zero-stock-cancellation
        options:
          - cleanup-cessation-renewal
          - cessation-renewal
          - restoration-renewal
          - split-renewal
          - zero-stock-cancellation
          - http-hosted-checkout
          - cleanup-hosted-checkout
          - http-transitions
          - http-promotion
          - http-permissions
          - promotion
          - transitions
      confirmation:
        description: VERIFY-PAID-INVENTORY
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: khrental-production
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check scripts/verify-deployed-paid-inventory.mjs
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_BUILD: ${{ inputs.expected_build }}
      OPERATION_ID: ${{ inputs.operation_id }}
      SCENARIO: ${{ inputs.scenario }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify reviewed source and serving build
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = VERIFY-PAID-INVENTORY
          [[ "$SCENARIO" == zero-stock-cancellation || "$SCENARIO" == split-renewal || "$SCENARIO" == restoration-renewal || "$SCENARIO" == cleanup-cessation-renewal || "$SCENARIO" == cessation-renewal || "$SCENARIO" == promotion || "$SCENARIO" == transitions || "$SCENARIO" == http-permissions || "$SCENARIO" == http-promotion || "$SCENARIO" == http-transitions || "$SCENARIO" == http-hosted-checkout || "$SCENARIO" == cleanup-hosted-checkout ]]
          [[ "$EXPECTED_BUILD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OPERATION_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]
          curl -fsS --max-time 30 https://app.quixo.homes/build-info.json | jq -e --arg sha "$EXPECTED_BUILD" '.buildSha==$sha'
          git merge-base --is-ancestor "$EXPECTED_BUILD" "$GITHUB_SHA"
          while IFS= read -r changed; do
            case "$changed" in
              docs/*|*.md|tests/*|scripts/test-rental-offers-sql.mjs|scripts/test-rental-offers-browser.mjs|scripts/verify-deployed-stock-expiry.mjs|.github/workflows/verify-deployed-stock-expiry.yml|scripts/verify-deployed-retained-history.mjs|.github/workflows/verify-deployed-retained-history.yml|scripts/verify-deployed-reservation-http.mjs|.github/workflows/verify-deployed-reservation-http.yml|scripts/verify-deployed-paid-inventory.mjs|.github/workflows/verify-deployed-paid-inventory.yml|.github/workflows/diagnose-container-revision.yml) ;;
              *) echo "Unverified runtime difference: $changed" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$EXPECTED_BUILD" "$GITHUB_SHA")
          node --check scripts/verify-deployed-paid-inventory.mjs
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 3d42a180-fda5-4013-afcc-fdba10266f9b
      - name: Temporarily enable inventory acceptance and scope write enforcement
        if: inputs.scenario == 'http-promotion' || inputs.scenario == 'http-transitions' || inputs.scenario == 'http-hosted-checkout'
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          az containerapp show -g khrental-prod-rg -n khrental-app -o json > "$RUNNER_TEMP/enforcement-before.json"
          jq -e '.properties.configuration.activeRevisionsMode=="Single" and
            .properties.latestRevisionName==.properties.latestReadyRevisionName and
            .properties.template.scale.minReplicas==1 and .properties.template.scale.maxReplicas==1' "$RUNNER_TEMP/enforcement-before.json" >/dev/null
          jq '[.properties.template.containers[0].env[]? | select(.name=="MANAGEMENT_INVENTORY_SCHEMA_READY" or .name=="MANAGEMENT_CESSATION_SCHEMA_READY" or .name=="MANAGEMENT_RESTORATION_SCHEMA_READY" or .name=="MANAGEMENT_SPLIT_SCHEMA_READY" or .name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED" or .name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_TENANT_IDS")]' "$RUNNER_TEMP/enforcement-before.json" > "$RUNNER_TEMP/enforcement-original.json"
          jq -e 'all(.[]; has("value")) and all(.[]; .name!="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED" or .value=="false")' "$RUNNER_TEMP/enforcement-original.json" >/dev/null
          image=$(jq -r '.properties.template.containers[0].image' "$RUNNER_TEMP/enforcement-before.json")
          test "${image##*:}" = "$EXPECTED_BUILD"
          echo 'RESTORE_ENFORCEMENT=true' >> "$GITHUB_ENV"
          az containerapp update -g khrental-prod-rg -n khrental-app --set-env-vars "MANAGEMENT_INVENTORY_SCHEMA_READY=true" "MANAGEMENT_CESSATION_SCHEMA_READY=true" "MANAGEMENT_RESTORATION_SCHEMA_READY=true" "MANAGEMENT_SPLIT_SCHEMA_READY=true" "MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED=true" "MANAGEMENT_BILLING_WRITE_ENFORCEMENT_TENANT_IDS=$OPERATION_ID" -o none
          ready=false
          for attempt in $(seq 1 60); do
            az containerapp show -g khrental-prod-rg -n khrental-app -o json > "$RUNNER_TEMP/enforcement-ready.json"
            if jq -e '.properties.latestRevisionName==.properties.latestReadyRevisionName' "$RUNNER_TEMP/enforcement-ready.json" >/dev/null; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true
          jq -e --arg id "$OPERATION_ID" 'any(.properties.template.containers[0].env[]; .name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED" and .value=="true") and any(.properties.template.containers[0].env[]; .name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_TENANT_IDS" and .value==$id)' "$RUNNER_TEMP/enforcement-ready.json" >/dev/null
          jq -r '"HTTP_SCOPE_ENABLED="+.properties.latestReadyRevisionName' "$RUNNER_TEMP/enforcement-ready.json" > enforcement-config.txt
      - name: Verify selected inventory scenario through deployed service and sandbox
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          az containerapp show -g khrental-prod-rg -n khrental-app -o json > "$RUNNER_TEMP/app-before.json"
          jq -e '.properties.configuration.activeRevisionsMode=="Single" and .properties.latestRevisionName==.properties.latestReadyRevisionName and .properties.template.scale.minReplicas==1 and .properties.template.scale.maxReplicas==1' "$RUNNER_TEMP/app-before.json" >/dev/null
          revision=$(jq -r '.properties.latestReadyRevisionName' "$RUNNER_TEMP/app-before.json")
          image=$(jq -r '.properties.template.containers[0].image' "$RUNNER_TEMP/app-before.json")
          test "${image##*:}" = "$EXPECTED_BUILD"
          digest=$(sha256sum scripts/verify-deployed-paid-inventory.mjs | cut -d ' ' -f 1)
          # One short Azure connection. Fetch only this reviewed commit and verify
          # exact script bytes before execution; no unpinned remote code or retry.
          command="node --input-type=module -e \"const fs=await import('node:fs');const c=await import('node:crypto');const r=await fetch('https://raw.githubusercontent.com/WasanthaK/khrental/$GITHUB_SHA/scripts/verify-deployed-paid-inventory.mjs',{signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error('Source unavailable');const b=await r.text();if(c.createHash('sha256').update(b).digest('hex')!=='$digest')throw Error('Source mismatch');const p='/tmp/paid-inventory-$OPERATION_ID.mjs';fs.writeFileSync(p,b,{flag:'wx'});process.env.PAID_INVENTORY_OPERATION='$OPERATION_ID';process.env.PAID_INVENTORY_SCENARIO='$SCENARIO';try{await import('file://'+p)}finally{fs.unlinkSync(p)}\""
          test "${#command}" -lt 2000
          printf -v invocation '%q ' az containerapp exec -g khrental-prod-rg -n khrental-app --revision "$revision" --command "$command"
          script -q -e -c "$invocation" /dev/null | tee paid-inventory.txt
          if grep -Eq 'PAID_INVENTORY_FAILED=|PAID_INVENTORY_CLEANUP_FAILED' paid-inventory.txt; then exit 1; fi
          if [ "$SCENARIO" = cleanup-cessation-renewal ]; then
            grep -q 'PAID_RENEWAL_CLEANUP_OWNERSHIP=' paid-inventory.txt
            grep -Eo 'PAID_INVENTORY_CLEANUP=\{[^}]+\}' paid-inventory.txt | tr -d '\r' | sed 's/^PAID_INVENTORY_CLEANUP=//' > paid-inventory-summary.json
            jq -e '.verified and .fixtureInactive and .subscriptionCanceled and .recordsRetained' paid-inventory-summary.json
          elif [ "$SCENARIO" = cleanup-hosted-checkout ]; then
            grep -Eo 'PAID_HOSTED_CLEANUP_PASS=\{[^}]+\}' paid-inventory.txt | tr -d '\r' | sed 's/^PAID_HOSTED_CLEANUP_PASS=//' > paid-inventory-summary.json
            jq -e '.verified and .sessionExpired and .noSubscription and .fixtureInactive and .protectedBillingUnchanged and .recordsRetained' paid-inventory-summary.json
          else
            grep -Eo 'PAID_INVENTORY_PASS=\{[^}]+\}' paid-inventory.txt | tr -d '\r' | sed 's/^PAID_INVENTORY_PASS=//' > paid-inventory-summary.json
            jq -e --arg scenario "$SCENARIO" '.scenario==$scenario and .passed and .fixtureInactive and .subscriptionCanceled and .protectedBillingUnchanged and (.httpAccepted==($scenario=="http-permissions" or $scenario=="http-promotion" or $scenario=="http-transitions" or $scenario=="http-hosted-checkout")) and (.uiAccepted==false) and (if $scenario=="http-hosted-checkout" then .hostedCheckoutCompleted==true elif $scenario=="zero-stock-cancellation" then .zeroStockCancellationAccepted==true and .renewalInvoiceCreated==false and .inventoryQuantity==0 and .subscriptionCanceledAtBoundary==true elif $scenario=="split-renewal" then .actualRenewalAccepted==true and .renewalQuantity==4 and .renewalAmountMinor==2000 elif $scenario=="restoration-renewal" then .actualRenewalAccepted==true and .renewalQuantity==2 and .renewalAmountMinor==1000 elif $scenario=="cessation-renewal" then .actualRenewalAccepted==true and .renewalQuantity==1 and .renewalAmountMinor==500 else true end) and (.checks|length)==(if $scenario=="restoration-renewal" then 12 elif $scenario=="http-transitions" then 17 elif $scenario=="http-promotion" then 12 else 10 end)' paid-inventory-summary.json
          fi
      - name: Restore exact original feature and enforcement configuration
        if: always() && env.RESTORE_ENFORCEMENT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for name in MANAGEMENT_INVENTORY_SCHEMA_READY MANAGEMENT_CESSATION_SCHEMA_READY MANAGEMENT_RESTORATION_SCHEMA_READY MANAGEMENT_SPLIT_SCHEMA_READY MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED MANAGEMENT_BILLING_WRITE_ENFORCEMENT_TENANT_IDS; do
            if jq -e --arg name "$name" 'any(.[]; .name==$name)' "$RUNNER_TEMP/enforcement-original.json" >/dev/null; then
              value=$(jq -r --arg name "$name" '.[] | select(.name==$name) | .value' "$RUNNER_TEMP/enforcement-original.json")
              args+=(--set-env-vars "$name=$value")
            else
              args+=(--remove-env-vars "$name")
            fi
          done
          # Separate set/remove lists avoid repeated argparse options dropping values.
          set_values=(); remove_names=()
          for ((i=0;i<${#args[@]};i+=2)); do
            if [ "${args[i]}" = --set-env-vars ]; then set_values+=("${args[i+1]}"); else remove_names+=("${args[i+1]}"); fi
          done
          restore=(); if [ "${#set_values[@]}" -gt 0 ]; then restore+=(--set-env-vars "${set_values[@]}"); fi
          if [ "${#remove_names[@]}" -gt 0 ]; then restore+=(--remove-env-vars "${remove_names[@]}"); fi
          az containerapp update -g khrental-prod-rg -n khrental-app "${restore[@]}" -o none
          ready=false
          for attempt in $(seq 1 60); do
            az containerapp show -g khrental-prod-rg -n khrental-app -o json > "$RUNNER_TEMP/enforcement-restored.json"
            if jq -e '.properties.latestRevisionName==.properties.latestReadyRevisionName' "$RUNNER_TEMP/enforcement-restored.json" >/dev/null; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true
          jq '[.properties.template.containers[0].env[]? | select(.name=="MANAGEMENT_INVENTORY_SCHEMA_READY" or .name=="MANAGEMENT_CESSATION_SCHEMA_READY" or .name=="MANAGEMENT_RESTORATION_SCHEMA_READY" or .name=="MANAGEMENT_SPLIT_SCHEMA_READY" or .name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_ENABLED" or .name=="MANAGEMENT_BILLING_WRITE_ENFORCEMENT_TENANT_IDS")] | sort_by(.name)' "$RUNNER_TEMP/enforcement-restored.json" > "$RUNNER_TEMP/enforcement-actual.json"
          jq 'sort_by(.name)' "$RUNNER_TEMP/enforcement-original.json" > "$RUNNER_TEMP/enforcement-expected.json"
          diff -u "$RUNNER_TEMP/enforcement-expected.json" "$RUNNER_TEMP/enforcement-actual.json"
          image=$(jq -r '.properties.template.containers[0].image' "$RUNNER_TEMP/enforcement-restored.json")
          test "${image##*:}" = "$EXPECTED_BUILD"
          curl -fsS --retry 4 --retry-delay 3 --max-time 30 https://app.quixo.homes/api/health >/dev/null
          jq -r '"HTTP_SCOPE_RESTORED="+.properties.latestReadyRevisionName' "$RUNNER_TEMP/enforcement-restored.json" | tee -a enforcement-config.txt
      - name: Verify restored configuration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/app-before.json" ]; then exit 0; fi
          az containerapp show -g khrental-prod-rg -n khrental-app -o json > "$RUNNER_TEMP/app-after.json"
          if [ "$SCENARIO" = http-promotion ] || [ "$SCENARIO" = http-transitions ] || [ "$SCENARIO" = http-hosted-checkout ]; then
            cp "$RUNNER_TEMP/enforcement-before.json" "$RUNNER_TEMP/app-before.json"
            jq -e '.properties.latestRevisionName==.properties.latestReadyRevisionName' "$RUNNER_TEMP/app-after.json" >/dev/null
            for side in before after; do
              jq -S 'if .properties.configuration.activeRevisionsMode=="Single" and
                (.properties.configuration.ingress.traffic|length)==1 and
                .properties.configuration.ingress.traffic[0].weight==100 and
                (.properties.configuration.ingress.traffic[0].revisionName==.properties.latestReadyRevisionName or (.properties.configuration.ingress.traffic[0].latestRevision==true and .properties.configuration.ingress.traffic[0].revisionName==null)) and
                ((.properties.configuration.ingress.traffic[0]|keys)-["latestRevision","revisionName","weight"]|length)==0
              then .properties.configuration.ingress.traffic=[{latestRevision:true,weight:100}]
              else error("Unexpected traffic configuration") end |
              {template:.properties.template,configuration:.properties.configuration} | .template.containers |= map(.env |= sort_by(.name))' "$RUNNER_TEMP/app-$side.json" > "$RUNNER_TEMP/config-$side.json"
            done
          else
            for side in before after; do
              jq -S '{template:.properties.template,configuration:.properties.configuration,ready:.properties.latestReadyRevisionName}' "$RUNNER_TEMP/app-$side.json" > "$RUNNER_TEMP/config-$side.json"
            done
          fi
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          before=json.loads((root/'config-before.json').read_text())
          after=json.loads((root/'config-after.json').read_text())
          def differences(a,b,path='config'):
              if type(a)!=type(b): return [path]
              if isinstance(a,dict):
                  return [p for k in sorted(set(a)|set(b)) for p in ([path+'.'+k] if k not in a or k not in b else differences(a[k],b[k],path+'.'+k))]
              if isinstance(a,list):
                  if len(a)!=len(b): return [path+'.length']
                  return [p for i,(x,y) in enumerate(zip(a,b)) for p in differences(x,y,path+'['+str(i)+']')]
              return [] if a==b else [path]
          paths=differences(before,after)
          result={'equal':not paths,'differentPaths':paths}
          Path('restored-config-comparison.json').write_text(json.dumps(result)+'\n')
          print('RESTORED_CONFIG_COMPARISON='+json.dumps(result))
          raise SystemExit(bool(paths))
          PY
      - name: Verify public build and SQL health independently
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://app.quixo.homes/build-info.json | jq -e --arg sha "$EXPECTED_BUILD" '.buildSha==$sha'
          curl -fsS --retry 3 --retry-delay 3 --max-time 30 https://app.quixo.homes/api/mssql/health | jq -e '.ok and .connection=="ready"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paid-inventory-role-acceptance
          path: |
            paid-inventory.txt
            paid-inventory-summary.json
            enforcement-config.txt
            restored-config-comparison.json
          retention-days: 30

