name: Run production database migrations

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'scripts/run-production-migrations.mjs'
      - 'scripts/probe-production-db.mjs'
      - '.github/workflows/run-production-db-migrations.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only or apply pending migrations
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      through:
        description: Apply/plan migrations in order through this target
        required: true
        default: all
        type: choice
        options:
          - all
          - 20260920_01_add_tenancy_billing_adjustments
          - 20260920_02_create_platform_admins
          - 20260920_03_backfill_legacy_app_user_memberships
      confirmation:
        description: For apply mode, type APPLY-PRODUCTION exactly
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: khrental-production-db-migrations
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app
  MIGRATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'plan' }}
  MIGRATION_THROUGH: ${{ github.event_name == 'workflow_dispatch' && inputs.through || 'all' }}
  MIGRATION_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}

jobs:
  migrate:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'plan' }} production migrations
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate migration mode and confirmation
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$MIGRATION_MODE" != "plan" ]; then
            echo "Automatic production migration runs are restricted to plan mode." >&2
            exit 1
          fi

          if [ "$MIGRATION_MODE" = "apply" ] && [ "$MIGRATION_CONFIRMATION" != "APPLY-PRODUCTION" ]; then
            echo "Apply mode requires confirmation text APPLY-PRODUCTION." >&2
            exit 1
          fi

      - name: Install migration dependencies
        run: npm ci

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve production database target
        shell: bash
        env:
          MSSQL_SERVER_CONFIG: ${{ vars.MSSQL_SERVER || secrets.MSSQL_SERVER }}
          MSSQL_DATABASE_CONFIG: ${{ vars.MSSQL_DATABASE || secrets.MSSQL_DATABASE }}
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          server="${MSSQL_SERVER_CONFIG:-}"
          database="${MSSQL_DATABASE_CONFIG:-}"

          if [ -z "$server" ]; then
            server=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[0].env[?name=='MSSQL_SERVER'].value | [0]" \
              -o tsv)
          fi

          if [ -z "$database" ]; then
            database=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[0].env[?name=='MSSQL_DATABASE'].value | [0]" \
              -o tsv)
          fi

          if [ -z "$server" ] || [ "$server" = "None" ]; then
            echo "Unable to resolve MSSQL_SERVER. Configure the Production environment variable MSSQL_SERVER." >&2
            exit 1
          fi

          if [ -z "$database" ] || [ "$database" = "None" ]; then
            echo "Unable to resolve MSSQL_DATABASE. Configure the Production environment variable MSSQL_DATABASE." >&2
            exit 1
          fi

          echo "MSSQL_SERVER=$server" >> "$GITHUB_ENV"
          echo "MSSQL_DATABASE=$database" >> "$GITHUB_ENV"
          echo "Resolved production database endpoint: $server / $database"

      - name: Obtain Azure SQL access token
        shell: bash
        run: |
          set -euo pipefail
          token=$(az account get-access-token \
            --resource https://database.windows.net/ \
            --query accessToken \
            -o tsv)
          if [ -z "$token" ]; then
            echo "Azure OIDC login did not return an Azure SQL access token." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "MSSQL_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Probe direct production database access from GitHub runner
        id: db_probe
        shell: bash
        env:
          MSSQL_MIGRATION_USER: ${{ secrets.MSSQL_MIGRATION_USER }}
          MSSQL_MIGRATION_PASSWORD: ${{ secrets.MSSQL_MIGRATION_PASSWORD }}
        run: |
          set +e
          node scripts/probe-production-db.mjs > db-probe.txt 2>&1
          probe_exit=$?
          set -e
          cat db-probe.txt

          if [ "$probe_exit" -eq 0 ]; then
            echo "status=reachable" >> "$GITHUB_OUTPUT"
            echo "GitHub runner can reach and authenticate to production SQL directly."
          else
            echo "status=container" >> "$GITHUB_OUTPUT"
            echo "Direct GitHub-runner SQL access is unavailable (probe exit ${probe_exit})."
            echo "Read-only plan mode will use the serving Container App's restricted runtime identity instead."
          fi

      - name: Run migration directly when privileged SQL access is available
        if: steps.db_probe.outputs.status == 'reachable'
        shell: bash
        env:
          MSSQL_MIGRATION_USER: ${{ secrets.MSSQL_MIGRATION_USER }}
          MSSQL_MIGRATION_PASSWORD: ${{ secrets.MSSQL_MIGRATION_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/run-production-migrations.mjs \
            --mode="$MIGRATION_MODE" \
            --through="$MIGRATION_THROUGH" | tee migration-output.txt

          {
            echo '### Production database migration result'
            echo
            echo '```text'
            cat migration-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse apply without direct privileged migration access
        if: steps.db_probe.outputs.status == 'container' && env.MIGRATION_MODE == 'apply'
        shell: bash
        run: |
          echo "The GitHub-hosted runner does not currently have authenticated privileged production SQL access." >&2
          echo "No firewall rule will be opened and the restricted web identity will not be granted DDL permission." >&2
          echo "Apply requires a dedicated privileged migration executor inside the production network." >&2
          exit 1

      - name: Wait for this commit to be the serving Container App revision
        if: steps.db_probe.outputs.status == 'container' && env.MIGRATION_MODE == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          fqdn=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          for attempt in $(seq 1 75); do
            build_info=$(curl --fail --silent --show-error "https://${fqdn}/build-info.json" 2>/dev/null || true)
            if echo "$build_info" | grep -Fq "\"buildSha\":\"${GITHUB_SHA}\""; then
              echo "Serving Container App revision now matches ${GITHUB_SHA}."
              exit 0
            fi
            echo "Waiting for Container App to serve ${GITHUB_SHA} (attempt ${attempt}/75)..."
            sleep 8
          done

          echo "Container App did not begin serving ${GITHUB_SHA} within the migration-plan wait window." >&2
          exit 1

      - name: Run read-only migration plan inside the Container App
        if: steps.db_probe.outputs.status == 'container' && env.MIGRATION_MODE == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          ready_revision=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestReadyRevisionName \
            -o tsv)

          echo "Running read-only plan inside ready revision: $ready_revision"

          az containerapp exec \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$ready_revision" \
            --command "/bin/sh -c 'MSSQL_MIGRATION_USE_MANAGED_IDENTITY=true node scripts/run-production-migrations.mjs --mode=plan --through=${MIGRATION_THROUGH}'" \
            | tee migration-output.txt

          {
            echo '### Production database migration result'
            echo
            echo 'Executed read-only inside the serving Container App because direct privileged SQL access was unavailable to the GitHub-hosted runner.'
            echo
            echo '```text'
            cat migration-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
