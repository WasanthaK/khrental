name: Run production database migrations

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'scripts/run-production-migrations.mjs'
      - 'scripts/probe-production-db.mjs'
      - '.github/workflows/run-production-db-migrations.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only or apply pending migrations
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      through:
        description: Apply/plan migrations in order through this target
        required: true
        default: all
        type: choice
        options:
          - all
          - 20260920_01_add_tenancy_billing_adjustments
          - 20260920_02_create_platform_admins
          - 20260920_03_backfill_legacy_app_user_memberships
          - 20260922_01_create_rentee_property_assignments
      confirmation:
        description: For apply mode, type APPLY-PRODUCTION exactly
        required: false
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: khrental-production-db-migrations
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app
  MIGRATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'plan' }}
  MIGRATION_THROUGH: ${{ github.event_name == 'workflow_dispatch' && inputs.through || 'all' }}
  MIGRATION_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}

jobs:
  migrate:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'plan' }} production migrations
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate migration mode and confirmation
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$MIGRATION_MODE" != "plan" ]; then
            echo "Automatic production migration runs are restricted to plan mode." >&2
            exit 1
          fi

          if [ "$MIGRATION_MODE" = "apply" ] && [ "$MIGRATION_CONFIRMATION" != "APPLY-PRODUCTION" ]; then
            echo "Apply mode requires confirmation text APPLY-PRODUCTION." >&2
            exit 1
          fi

      - name: Install migration dependencies
        run: npm ci

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve production database target
        shell: bash
        env:
          MSSQL_SERVER_CONFIG: ${{ vars.MSSQL_SERVER || secrets.MSSQL_SERVER }}
          MSSQL_DATABASE_CONFIG: ${{ vars.MSSQL_DATABASE || secrets.MSSQL_DATABASE }}
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          server="${MSSQL_SERVER_CONFIG:-}"
          database="${MSSQL_DATABASE_CONFIG:-}"

          if [ -z "$server" ]; then
            server=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[0].env[?name=='MSSQL_SERVER'].value | [0]" \
              -o tsv)
          fi

          if [ -z "$database" ]; then
            database=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[0].env[?name=='MSSQL_DATABASE'].value | [0]" \
              -o tsv)
          fi

          if [ -z "$server" ] || [ "$server" = "None" ]; then
            echo "Unable to resolve MSSQL_SERVER. Configure the Production environment variable MSSQL_SERVER." >&2
            exit 1
          fi

          if [ -z "$database" ] || [ "$database" = "None" ]; then
            echo "Unable to resolve MSSQL_DATABASE. Configure the Production environment variable MSSQL_DATABASE." >&2
            exit 1
          fi

          echo "MSSQL_SERVER=$server" >> "$GITHUB_ENV"
          echo "MSSQL_DATABASE=$database" >> "$GITHUB_ENV"
          echo "Resolved production database endpoint: $server / $database"

      - name: Obtain Azure SQL access token
        shell: bash
        run: |
          set -euo pipefail
          token=$(az account get-access-token \
            --resource https://database.windows.net/ \
            --query accessToken \
            -o tsv)
          if [ -z "$token" ]; then
            echo "Azure OIDC login did not return an Azure SQL access token." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "MSSQL_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Probe direct production database access from GitHub runner
        id: db_probe
        shell: bash
        env:
          MSSQL_MIGRATION_USER: ${{ secrets.MSSQL_MIGRATION_USER }}
          MSSQL_MIGRATION_PASSWORD: ${{ secrets.MSSQL_MIGRATION_PASSWORD }}
        run: |
          set +e
          node scripts/probe-production-db.mjs > db-probe.txt 2>&1
          probe_exit=$?
          set -e
          cat db-probe.txt

          if [ "$probe_exit" -eq 0 ]; then
            echo "status=reachable" >> "$GITHUB_OUTPUT"
            echo "GitHub runner can reach and authenticate to production SQL directly."
          else
            echo "status=container" >> "$GITHUB_OUTPUT"
            echo "Direct GitHub-runner SQL access is unavailable (probe exit ${probe_exit})."
            echo "The migration workflow will keep plan mode read-only and use an isolated in-network job for an explicitly confirmed apply."
          fi

      - name: Run migration directly when privileged SQL access is available
        if: steps.db_probe.outputs.status == 'reachable'
        shell: bash
        env:
          MSSQL_MIGRATION_USER: ${{ secrets.MSSQL_MIGRATION_USER }}
          MSSQL_MIGRATION_PASSWORD: ${{ secrets.MSSQL_MIGRATION_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/run-production-migrations.mjs \
            --mode="$MIGRATION_MODE" \
            --through="$MIGRATION_THROUGH" | tee migration-output.txt

          {
            echo '### Production database migration result'
            echo
            echo '```text'
            cat migration-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for this commit to be the serving Container App revision
        if: steps.db_probe.outputs.status == 'container'
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          fqdn=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          for attempt in $(seq 1 75); do
            build_info=$(curl --fail --silent --show-error "https://${fqdn}/build-info.json" 2>/dev/null || true)
            if echo "$build_info" | grep -Fq "\"buildSha\":\"${GITHUB_SHA}\""; then
              echo "Serving Container App revision now matches ${GITHUB_SHA}."
              exit 0
            fi
            echo "Waiting for Container App to serve ${GITHUB_SHA} (attempt ${attempt}/75)..."
            sleep 8
          done

          echo "Container App did not begin serving ${GITHUB_SHA} within the migration wait window." >&2
          exit 1

      - name: Apply migration in isolated Container Apps Job
        if: steps.db_probe.outputs.status == 'container' && env.MIGRATION_MODE == 'apply'
        shell: bash
        env:
          MSSQL_MIGRATION_USER: ${{ secrets.MSSQL_MIGRATION_USER }}
          MSSQL_MIGRATION_PASSWORD: ${{ secrets.MSSQL_MIGRATION_PASSWORD }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          job_name="khrental-db-migrate"
          environment_id=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.environmentId \
            -o tsv)
          image=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            -o tsv)

          if [ -z "$environment_id" ] || [ "$environment_id" = "None" ]; then
            echo "Unable to resolve the production Container Apps environment." >&2
            exit 1
          fi
          if [ -z "$image" ] || [ "$image" = "None" ]; then
            echo "Unable to resolve the serving production image." >&2
            exit 1
          fi
          if ! echo "$image" | grep -Fq ":${GITHUB_SHA}"; then
            echo "Refusing migration: serving image does not match workflow SHA. image=$image sha=${GITHUB_SHA}" >&2
            exit 1
          fi

          az containerapp job delete \
            --name "$job_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --yes --output none 2>/dev/null || true

          cleanup() {
            az containerapp job delete \
              --name "$job_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --yes --output none 2>/dev/null || true
          }
          trap cleanup EXIT

          secret_args=()
          env_args=(
            "MSSQL_SERVER=$MSSQL_SERVER"
            "MSSQL_DATABASE=$MSSQL_DATABASE"
          )

          if [ -n "${MSSQL_MIGRATION_USER:-}" ] || [ -n "${MSSQL_MIGRATION_PASSWORD:-}" ]; then
            if [ -z "${MSSQL_MIGRATION_USER:-}" ] || [ -z "${MSSQL_MIGRATION_PASSWORD:-}" ]; then
              echo "Both MSSQL_MIGRATION_USER and MSSQL_MIGRATION_PASSWORD are required when SQL migration credentials are configured." >&2
              exit 1
            fi
            echo "::add-mask::$MSSQL_MIGRATION_USER"
            echo "::add-mask::$MSSQL_MIGRATION_PASSWORD"
            secret_args+=(
              "mssql-migration-user=$MSSQL_MIGRATION_USER"
              "mssql-migration-password=$MSSQL_MIGRATION_PASSWORD"
            )
            env_args+=(
              "MSSQL_MIGRATION_USER=secretref:mssql-migration-user"
              "MSSQL_MIGRATION_PASSWORD=secretref:mssql-migration-password"
            )
          else
            if [ -z "${MSSQL_ACCESS_TOKEN:-}" ]; then
              echo "No privileged migration authentication is available." >&2
              exit 1
            fi
            secret_args+=("mssql-access-token=$MSSQL_ACCESS_TOKEN")
            env_args+=("MSSQL_ACCESS_TOKEN=secretref:mssql-access-token")
          fi

          echo "Using an isolated in-network migration job; no firewall rule or web-runtime DDL elevation is required."

          az containerapp job create \
            --name "$job_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --environment "$environment_id" \
            --trigger-type Manual \
            --replica-timeout 900 \
            --replica-retry-limit 0 \
            --replica-completion-count 1 \
            --parallelism 1 \
            --image "$image" \
            --cpu 0.5 \
            --memory 1.0Gi \
            --command "/bin/sh" \
            --args "-c" "node scripts/run-production-migrations.mjs --mode=apply --through=${MIGRATION_THROUGH}" \
            --registry-server ghcr.io \
            --registry-username "$GHCR_USERNAME" \
            --registry-password "$GHCR_TOKEN" \
            --secrets "${secret_args[@]}" \
            --env-vars "${env_args[@]}" \
            --output none

          execution_name=$(az containerapp job start \
            --name "$job_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query name -o tsv)

          if [ -z "$execution_name" ]; then
            echo "Container Apps migration job did not return an execution name." >&2
            exit 1
          fi

          final_status=""
          for attempt in $(seq 1 120); do
            status=$(az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --query properties.status -o tsv 2>/dev/null || true)
            case "${status,,}" in
              succeeded) final_status="succeeded"; break ;;
              failed)
                echo "Container Apps migration execution failed: $execution_name" >&2
                exit 1
                ;;
            esac
            echo "Waiting for migration execution $execution_name (status=${status:-pending}, attempt $attempt/120)..."
            sleep 5
          done

          if [ "$final_status" != "succeeded" ]; then
            echo "Migration execution did not complete successfully within the wait window." >&2
            exit 1
          fi

          ready_revision=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestReadyRevisionName \
            -o tsv)

          echo "Migration job succeeded. Verifying the applied ledger/schema read-only from ready revision: $ready_revision"
          exec_command="az containerapp exec --name '$AZURE_CONTAINER_APP_NAME' --resource-group '$AZURE_RESOURCE_GROUP' --revision '$ready_revision' --command \"/bin/sh -c 'MSSQL_MIGRATION_USE_MANAGED_IDENTITY=true node scripts/run-production-migrations.mjs --mode=plan --through=${MIGRATION_THROUGH}'\""
          script -q -e -c "$exec_command" /dev/null | tee migration-output.txt

          {
            echo '### Production database migration result'
            echo
            echo 'Applied through an isolated Container Apps Job because the GitHub-hosted runner could not reach production SQL directly.'
            echo 'The web runtime identity remained read-only for migration planning.'
            echo
            echo '```text'
            cat migration-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run read-only migration plan inside the Container App
        if: steps.db_probe.outputs.status == 'container' && env.MIGRATION_MODE == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          ready_revision=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestReadyRevisionName \
            -o tsv)

          echo "Running read-only plan inside ready revision: $ready_revision"

          exec_command="az containerapp exec --name '$AZURE_CONTAINER_APP_NAME' --resource-group '$AZURE_RESOURCE_GROUP' --revision '$ready_revision' --command \"/bin/sh -c 'MSSQL_MIGRATION_USE_MANAGED_IDENTITY=true node scripts/run-production-migrations.mjs --mode=plan --through=${MIGRATION_THROUGH}'\""
          script -q -e -c "$exec_command" /dev/null | tee migration-output.txt

          {
            echo '### Production database migration result'
            echo
            echo 'Executed read-only inside the serving Container App because direct privileged SQL access was unavailable to the GitHub-hosted runner.'
            echo
            echo '```text'
            cat migration-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"