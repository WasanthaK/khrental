name: Browser protected billing smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test-browser-billing-unauthenticated.mjs'
      - 'src/routes.jsx'
      - 'src/api/storage/authenticatedTenantRoute.js'
      - 'tests/evia-audit-http.test.js'
      - 'scripts/verify-evia-real-session-audit-http.mjs'
      - 'src/components/common/ProtectedRoute.jsx'
      - 'src/pages/InvoiceManagementDashboard.jsx'
      - 'src/pages/rentee/**'
      - 'src/pages/ManagementPricing.jsx'
      - 'src/pages/ManagementSubscription.jsx'
      - 'src/pages/TenancyOnboarding.jsx'
      - 'src/pages/TenancyExit.jsx'
      - 'src/pages/RenteeDetails.jsx'
      - 'src/utils/propertyDetailFields.js'
      - 'scripts/test-rentee-details-browser.mjs'
      - 'src/utils/helpers.js'
      - 'tests/tenancy-currency.test.js'
      - 'src/services/DocumentService.js'
      - 'src/utils/documentUtils.js'
      - 'scripts/test-r5-layout-browser.mjs'
      - 'tests/fixtures/management-billing/**'
      - 'tests/fixtures/security/**'
      - 'src/utils/sanitizeHtml.js'
      - 'src/components/agreements/**'
      - 'src/components/common/RichTextEditor.jsx'
      - 'src/pages/AgreementDetails.jsx'
      - 'src/pages/AgreementTemplateForm.jsx'
      - 'scripts/verify-management-billing-browser.mjs'
      - '.github/workflows/test-browser-protected-billing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:browser:billing-unauthenticated
      - name: Management subscription, pricing and complimentary access screens
        env:
          BILLING_SCREENSHOT_DIR: management-billing-screens
        run: node scripts/verify-management-billing-browser.mjs
      - name: Future contract layout and move-in screen
        run: node scripts/test-r5-layout-browser.mjs
      - name: Renter detail agreement currency and protected property photographs
        run: node scripts/test-rentee-details-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-contract-onboarding-proof
          path: r5-browser-proof/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-billing-screens
          path: management-billing-screens/
          if-no-files-found: ignore
