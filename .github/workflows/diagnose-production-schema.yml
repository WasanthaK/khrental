name: Diagnose production schema

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-production-schema.mjs'
      - '.github/workflows/diagnose-production-schema.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: khrental-production-schema-diagnostic
  cancel-in-progress: true

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app

jobs:
  diagnose:
    name: read-only production schema check
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic source for strict revision parity
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for this commit and MSSQL to be serving
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          fqdn=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "PRODUCTION_FQDN=$fqdn" >> "$GITHUB_ENV"

          serving=false
          for attempt in $(seq 1 75); do
            build_info=$(curl --max-time 20 --fail --silent --show-error "https://${fqdn}/build-info.json" 2>/dev/null || true)
            serving_sha=$(jq -r '.buildSha // empty' <<<"$build_info" 2>/dev/null || true)
            if [ "$serving_sha" = "$GITHUB_SHA" ]; then
              echo "Serving revision matches ${GITHUB_SHA}."
              serving=true
              break
            fi

            # A CI/docs-only GitHub commit does not redeploy the container.
            # Accept an ancestor only after verifying EVERY changed file is
            # non-runtime; application/SQL/migration changes stay fail-closed.
            if [[ "$serving_sha" =~ ^[a-f0-9]{40}$ ]] && \
               git cat-file -e "${serving_sha}^{commit}" 2>/dev/null && \
               git merge-base --is-ancestor "$serving_sha" "$GITHUB_SHA"; then
              parity_ok=true
              while IFS= read -r changed_file; do
                [ -z "$changed_file" ] && continue
                case "$changed_file" in
                  docs/*|*.md|tests/*|.github/workflows/*) ;;
                  *) parity_ok=false; break ;;
                esac
              done < <(git diff --name-only "$serving_sha" "$GITHUB_SHA")
              if [ "$parity_ok" = "true" ]; then
                echo "Read-only diagnostic verified serving SHA ${serving_sha} as an ancestor with CI/docs-only changes to ${GITHUB_SHA}."
                serving=true
                break
              fi
            fi

            echo "Waiting for verified non-drift production revision (attempt ${attempt}/75)..."
            sleep 8
          done

          if [ "$serving" != "true" ]; then
            echo "Production did not begin serving ${GITHUB_SHA} within the diagnostic wait window." >&2
            exit 1
          fi

          for attempt in $(seq 1 20); do
            mssql_health=$(curl --max-time 20 --fail --silent --show-error "https://${fqdn}/api/mssql/health" 2>/dev/null || true)
            if echo "$mssql_health" | grep -Fq '"connection":"ready"'; then
              echo "Production MSSQL connection is ready."
              exit 0
            fi
            echo "Waiting for production MSSQL readiness (attempt ${attempt}/20)..."
            sleep 10
          done

          echo "Production MSSQL did not become ready within the diagnostic wait window." >&2
          exit 1

      - name: Run read-only schema check inside Container App
        shell: bash
        run: |
          set -euo pipefail
          ready_revision=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestReadyRevisionName \
            -o tsv)

          echo "Checking schema inside ready revision: $ready_revision"
          exec_command="az containerapp exec --name '$AZURE_CONTAINER_APP_NAME' --resource-group '$AZURE_RESOURCE_GROUP' --revision '$ready_revision' --command 'node scripts/check-production-schema.mjs'"

          success=false
          for attempt in 1 2 3; do
            : > schema-diagnostic.txt
            set +e
            script -q -e -c "$exec_command" /dev/null | tee schema-diagnostic.txt
            set -e

            if grep -Fq 'SCHEMA_DIAGNOSTIC_OK' schema-diagnostic.txt; then
              success=true
              break
            fi

            echo "Read-only schema diagnostic did not complete successfully (attempt ${attempt}/3)."
            sleep 10
          done

          if [ "$success" != "true" ]; then
            echo "Read-only schema diagnostic failed after 3 attempts." >&2
            cat schema-diagnostic.txt >&2
            exit 1
          fi

          {
            echo '### Read-only production schema diagnostic'
            echo
            echo '```text'
            cat schema-diagnostic.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
