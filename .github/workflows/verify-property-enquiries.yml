name: Verify property enquiries
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/api/enquiries/**'
      - 'src/pages/PropertyEnquiry.jsx'
      - 'src/pages/OwnerEnquiries.jsx'
      - 'src/utils/enquiryReturnPath.js'
      - 'src/utils/publicSignupPasswordPolicy.js'
      - 'src/services/seekerContextClient.js'
      - 'src/routes.jsx'
      - 'src/main.jsx'
      - 'src/App.jsx'
      - 'src/pages/Login.jsx'
      - 'src/hooks/useAuth.jsx'
      - 'scripts/test-renter-auth-browser.mjs'
      - 'tests/seeker-session-continuation.test.js'
      - 'src/pages/SeekerSignUp.jsx'
      - 'src/pages/VerifySeekerEmail.jsx'
      - 'src/api/auth/publicSignup*.js'
      - 'src/utils/seekerVerificationFragment.js'
      - 'src/components/auth/VerifiedSeekerBoundary.jsx'
      - 'src/services/requestContext.js'
      - 'migrations/20261028_01_property_enquiries.sql'
      - 'migrations/20261028_02_property_viewings.sql'
      - 'scripts/inspect-property-viewings-schema.mjs'
      - 'src/components/properties/PropertyViewing.jsx'
      - 'src/components/properties/PropertyApplication.jsx'
      - 'src/components/properties/PropertyOffer.jsx'
      - 'src/pages/RentalJourney.jsx'
      - 'migrations/20261029_01_rental_offers_and_holds.sql'
      - 'scripts/*rental-offer*'
      - 'tests/rental-offers.test.js'
      - '.github/workflows/release-rental-offers.yml'
      - 'src/api/platform/tenancyOnboardingRouter.js'
      - 'tests/property-applications.test.js'
      - 'migrations/20261028_03_property_applications.sql'
      - 'scripts/inspect-property-applications-schema.mjs'
      - 'scripts/check-application-release-readiness.mjs'
      - '.github/workflows/release-property-applications.yml'
      - 'src/utils/viewingTime.js'
      - 'tests/property-viewings.test.js'
      - 'scripts/inspect-property-enquiries-schema.mjs'
      - 'src/api/publicListings/router.js'
      - 'tests/public-signup-release-policy.test.js'
      - 'scripts/check-enquiry-release-readiness.mjs'
      - '.github/workflows/release-property-enquiries.yml'
      - '.github/workflows/release-property-viewings.yml'
      - 'scripts/check-viewing-release-readiness.mjs'
      - 'tests/property-enquiries.test.js'
      - 'tests/enquiry-registration-continuation.test.js'
      - 'scripts/test-property-enquiries-*.mjs'
      - 'scripts/test-seeker-verification-browser.mjs'
      - '.github/workflows/verify-property-enquiries.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enquiry-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  enquiry-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Renter authentication lifecycle through actual provider
        run: node scripts/test-renter-auth-browser.mjs
      - name: Seeker verification through actual application entry
        run: node scripts/test-seeker-verification-browser.mjs
      - run: node --test tests/seeker-session-continuation.test.js tests/rental-offers.test.js tests/property-applications.test.js tests/property-viewings.test.js tests/public-signup-release-policy.test.js tests/property-enquiries.test.js tests/enquiry-registration-continuation.test.js tests/verified-seeker-browser-routing.test.js tests/auth-flow-isolation.test.js tests/seeker-email-verification-ui-contract.test.js tests/public-signup-verification-presentation.test.js tests/public-signup-sendgrid-adapter.test.js
      - run: npm run build
      - name: Exact migration and concurrent store on disposable SQL Server
        env:
          PROPERTY_RENTAL_OFFERS_SCHEMA_READY: 'true'
        run: node scripts/test-property-enquiries-sqlserver.mjs
      - name: Isolated real-component browser acceptance
        env:
          ENQUIRY_PROOF_DIR: enquiry-browser-proof
        run: node scripts/test-property-enquiries-browser.mjs
      - name: Rental offers and agreement continuation browser proof
        run: node scripts/test-rental-offers-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enquiry-browser-proof
          path: enquiry-browser-proof/
          if-no-files-found: ignore
      - name: No production effects
        run: echo 'No production schema, release flags, public signup or extra cloud replicas changed.'
