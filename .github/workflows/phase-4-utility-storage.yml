name: Phase 4 utility media storage refactor

on:
  push:
    branches:
      - phase-4-utility-media-storage

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-utility-media-storage
          fetch-depth: 0
      - name: Apply focused utility storage refactor
        run: python scripts/phase4_utility_storage.py
      - name: Commit refactor
        run: |
          rm .github/workflows/phase-4-utility-storage.yml scripts/phase4_utility_storage.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 4 move utility photos to tenant storage API"
          git push origin HEAD:phase-4-utility-media-storage
