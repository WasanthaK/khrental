name: Apply P0.3 accept-invite route fix

on:
  push:
    branches: [p0.3-accept-invite-auth-session-fix]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Run P0.3 accept invite route fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0.3-accept-invite-auth-session-fix
          fetch-depth: 0
      - name: Apply focused fix
        run: python scripts/apply-p03-accept-invite-route-fix.py
      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes.jsx tests/invitation-lifecycle-ui.test.js
          git commit -m "Fix invitation acceptance in authenticated sessions"
          git push origin HEAD:p0.3-accept-invite-auth-session-fix
