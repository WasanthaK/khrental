name: Prepare isolated production migration executor

on:
  push:
    branches:
      - phase-5-release-hardening

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Run isolated migration executor refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5-release-hardening
          fetch-depth: 0
      - name: Apply refactor
        run: python scripts/prepare-isolated-migration-job.py
      - name: Commit and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/prepare-isolated-migration-job.yml
          rm scripts/prepare-isolated-migration-job.py
          git add .github/workflows/run-production-db-migrations.yml tests/membership-access-model.test.js .github/workflows/prepare-isolated-migration-job.yml scripts/prepare-isolated-migration-job.py
          git commit -m "Add isolated production migration job fallback"
          git push origin HEAD:phase-5-release-hardening
