name: Preflight legacy tenant memberships

on:
  push:
    branches:
      - chore/preflight-legacy-memberships
    paths:
      - 'scripts/preflight-legacy-memberships.mjs'
      - '.github/workflows/preflight-legacy-memberships.yml'

permissions:
  contents: read
  id-token: write

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app

jobs:
  preflight:
    name: read-only missing membership preflight
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install database dependencies
        run: npm ci

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve production database target
        shell: bash
        env:
          MSSQL_SERVER_CONFIG: ${{ vars.MSSQL_SERVER || secrets.MSSQL_SERVER }}
          MSSQL_DATABASE_CONFIG: ${{ vars.MSSQL_DATABASE || secrets.MSSQL_DATABASE }}
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          server="${MSSQL_SERVER_CONFIG:-}"
          database="${MSSQL_DATABASE_CONFIG:-}"

          if [ -z "$server" ]; then
            server=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[0].env[?name=='MSSQL_SERVER'].value | [0]" \
              -o tsv)
          fi

          if [ -z "$database" ]; then
            database=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[0].env[?name=='MSSQL_DATABASE'].value | [0]" \
              -o tsv)
          fi

          if [ -z "$server" ] || [ "$server" = "None" ]; then
            echo "Unable to resolve MSSQL_SERVER." >&2
            exit 1
          fi

          if [ -z "$database" ] || [ "$database" = "None" ]; then
            echo "Unable to resolve MSSQL_DATABASE." >&2
            exit 1
          fi

          echo "MSSQL_SERVER=$server" >> "$GITHUB_ENV"
          echo "MSSQL_DATABASE=$database" >> "$GITHUB_ENV"
          echo "Resolved production database endpoint: $server / $database"

      - name: Obtain Azure SQL access token
        shell: bash
        run: |
          set -euo pipefail
          token=$(az account get-access-token \
            --resource https://database.windows.net/ \
            --query accessToken \
            -o tsv)
          if [ -z "$token" ]; then
            echo "Azure OIDC login did not return an Azure SQL access token." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "MSSQL_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Prove direct authenticated production SQL access
        shell: bash
        env:
          MSSQL_MIGRATION_USER: ${{ secrets.MSSQL_MIGRATION_USER }}
          MSSQL_MIGRATION_PASSWORD: ${{ secrets.MSSQL_MIGRATION_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/probe-production-db.mjs

      - name: Inspect only users missing their legacy tenant membership
        shell: bash
        env:
          MSSQL_MIGRATION_USER: ${{ secrets.MSSQL_MIGRATION_USER }}
          MSSQL_MIGRATION_PASSWORD: ${{ secrets.MSSQL_MIGRATION_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/preflight-legacy-memberships.mjs | tee preflight.txt

          if ! grep -Fq 'LEGACY_MEMBERSHIP_PREFLIGHT_OK' preflight.txt; then
            echo "Read-only legacy-membership preflight did not complete." >&2
            exit 1
          fi

          {
            echo '### Legacy tenant-membership preflight'
            echo
            echo '```text'
            cat preflight.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
