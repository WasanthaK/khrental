name: Preflight legacy tenant memberships

on:
  push:
    branches:
      - chore/preflight-legacy-memberships
    paths:
      - '.github/workflows/preflight-legacy-memberships.yml'

permissions:
  contents: read
  id-token: write

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app

jobs:
  preflight:
    name: read-only missing membership preflight
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for production MSSQL readiness
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          fqdn=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          for attempt in $(seq 1 20); do
            health=$(curl --max-time 20 --fail --silent --show-error "https://${fqdn}/api/mssql/health" 2>/dev/null || true)
            if echo "$health" | grep -Fq '"connection":"ready"'; then
              echo "Production MSSQL connection is ready."
              exit 0
            fi
            echo "Waiting for MSSQL readiness (attempt ${attempt}/20)..."
            sleep 10
          done

          echo "Production MSSQL did not become ready." >&2
          exit 1

      - name: Inspect users missing their legacy tenant membership
        shell: bash
        run: |
          set -euo pipefail

          payload_b64=''
          exec_command="az containerapp exec --name '$AZURE_CONTAINER_APP_NAME' --resource-group '$AZURE_RESOURCE_GROUP' --command \"/bin/sh -c 'echo ${payload_b64} | base64 -d > /tmp/preflight.js && node /tmp/preflight.js'\""

          success=false
          for attempt in 1 2 3 4; do
            : > preflight.txt
            set +e
            script -q -e -c "$exec_command" /dev/null | tee preflight.txt
            exec_exit=${PIPESTATUS[0]}
            set -e

            if [ "$exec_exit" -eq 0 ] && grep -Fq 'LEGACY_MEMBERSHIP_PREFLIGHT_OK' preflight.txt; then
              success=true
              break
            fi

            echo "Container exec preflight did not complete (attempt ${attempt}/4)."
            sleep 10
          done

          if [ "$success" != "true" ]; then
            echo "Preflight query did not complete successfully." >&2
            cat preflight.txt >&2
            exit 1
          fi

          {
            echo '### Legacy tenant-membership preflight'
            echo
            echo '```text'
            cat preflight.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
