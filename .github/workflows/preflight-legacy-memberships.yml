name: Preflight legacy tenant memberships

on:
  push:
    branches:
      - chore/preflight-legacy-memberships
    paths:
      - '.github/workflows/preflight-legacy-memberships.yml'

permissions:
  contents: read
  id-token: write

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app

jobs:
  preflight:
    name: isolated read-only membership preflight
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Capture and verify current production state
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          mode=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.activeRevisionsMode \
            -o tsv)
          if [ "${mode,,}" != "single" ]; then
            echo "Expected production to be in single-revision mode, found: $mode" >&2
            exit 1
          fi

          fqdn=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          revision=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestReadyRevisionName \
            -o tsv)
          container=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.template.containers[0].name \
            -o tsv)

          build_info=$(curl --max-time 20 --fail --silent --show-error "https://${fqdn}/build-info.json")
          build_sha=$(echo "$build_info" | jq -r '.buildSha')
          if [ -z "$build_sha" ] || [ "$build_sha" = "null" ]; then
            echo "Could not read the current public build fingerprint." >&2
            exit 1
          fi

          ready=false
          for attempt in $(seq 1 20); do
            health=$(curl --max-time 20 --fail --silent --show-error "https://${fqdn}/api/mssql/health" 2>/dev/null || true)
            if echo "$health" | grep -Fq '"connection":"ready"'; then
              ready=true
              break
            fi
            echo "Waiting for production MSSQL readiness (attempt ${attempt}/20)..."
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "Production MSSQL is not ready; refusing to create the diagnostic revision." >&2
            exit 1
          fi

          echo "PRODUCTION_FQDN=$fqdn" >> "$GITHUB_ENV"
          echo "CURRENT_REVISION=$revision" >> "$GITHUB_ENV"
          echo "CURRENT_CONTAINER=$container" >> "$GITHUB_ENV"
          echo "ORIGINAL_BUILD_SHA=$build_sha" >> "$GITHUB_ENV"
          echo "Production baseline: revision=$revision build=$build_sha mode=$mode"

      - name: Pin production traffic and enable isolated revision mode
        shell: bash
        run: |
          set -euo pipefail
          az containerapp revision set-mode \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --mode multiple \
            --output none
          echo "MODE_CHANGED=true" >> "$GITHUB_ENV"

          az containerapp ingress traffic set \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision-weight "$CURRENT_REVISION=100" \
            --output none

          traffic=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.traffic \
            -o json)
          echo "$traffic"
          echo "$traffic" | jq -e --arg revision "$CURRENT_REVISION" \
            'length == 1 and .[0].revisionName == $revision and .[0].weight == 100' >/dev/null
          echo "Production traffic is pinned 100% to $CURRENT_REVISION."

      - name: Create zero-traffic diagnostic revision
        shell: bash
        run: |
          set -euo pipefail
          suffix="legacychk${GITHUB_RUN_NUMBER}"
          diag_revision="${AZURE_CONTAINER_APP_NAME}--${suffix}"
          payload_b64=''
          diag_command="echo ${payload_b64} | base64 -d > /tmp/preflight.js && node /tmp/preflight.js; rc=\$?; echo DIAGNOSTIC_PROCESS_EXIT=\$rc; sleep 300"

          az containerapp revision copy \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --from-revision "$CURRENT_REVISION" \
            --revision-suffix "$suffix" \
            --container-name "$CURRENT_CONTAINER" \
            --min-replicas 1 \
            --max-replicas 1 \
            --command /bin/sh \
            --args -c "$diag_command" \
            --output none

          echo "DIAG_REVISION=$diag_revision" >> "$GITHUB_ENV"
          echo "DIAG_CREATED=true" >> "$GITHUB_ENV"

          traffic=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.traffic \
            -o json)
          echo "$traffic" | jq -e --arg revision "$CURRENT_REVISION" \
            'length == 1 and .[0].revisionName == $revision and .[0].weight == 100' >/dev/null
          echo "Diagnostic revision created with zero production traffic: $diag_revision"

      - name: Read diagnostic revision logs
        shell: bash
        run: |
          set -euo pipefail
          found=false
          : > diagnostic.log

          for attempt in $(seq 1 24); do
            replica=$(az containerapp replica list \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$DIAG_REVISION" \
              --query '[0].name' \
              -o tsv 2>/dev/null || true)

            if [ -n "$replica" ] && [ "$replica" != "None" ]; then
              az containerapp logs show \
                --name "$AZURE_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision "$DIAG_REVISION" \
                --type console \
                --tail 200 \
                --format text > diagnostic.log 2>&1 || true

              if grep -Fq 'LEGACY_MEMBERSHIP_PREFLIGHT_OK' diagnostic.log; then
                found=true
                break
              fi

              if grep -Fq 'DIAGNOSTIC_PROCESS_EXIT=' diagnostic.log; then
                break
              fi
            fi

            echo "Waiting for diagnostic output (attempt ${attempt}/24)..."
            sleep 5
          done

          cat diagnostic.log
          if [ "$found" != "true" ]; then
            echo "The isolated read-only query did not return its success marker." >&2
            exit 1
          fi

          {
            echo '### Legacy tenant-membership preflight'
            echo
            echo '```text'
            cat diagnostic.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore single-revision production state
        if: always()
        shell: bash
        run: |
          set +e

          if [ "${DIAG_CREATED:-false}" = "true" ] && [ -n "${DIAG_REVISION:-}" ]; then
            az containerapp revision deactivate \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$DIAG_REVISION" \
              --output none || true
          fi

          if [ "${MODE_CHANGED:-false}" = "true" ] && [ -n "${CURRENT_REVISION:-}" ]; then
            az containerapp ingress traffic set \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision-weight "$CURRENT_REVISION=100" \
              --output none
            traffic_rc=$?

            az containerapp revision set-mode \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --mode single \
              --output none
            mode_rc=$?
          else
            traffic_rc=0
            mode_rc=0
          fi

          if [ "$traffic_rc" -ne 0 ] || [ "$mode_rc" -ne 0 ]; then
            echo "Failed to restore Container App revision configuration." >&2
            exit 1
          fi

          if [ -n "${PRODUCTION_FQDN:-}" ] && [ -n "${ORIGINAL_BUILD_SHA:-}" ]; then
            restored=false
            for attempt in $(seq 1 20); do
              build_info=$(curl --max-time 20 --fail --silent --show-error "https://${PRODUCTION_FQDN}/build-info.json" 2>/dev/null || true)
              db_health=$(curl --max-time 20 --fail --silent --show-error "https://${PRODUCTION_FQDN}/api/mssql/health" 2>/dev/null || true)
              if echo "$build_info" | grep -Fq "\"buildSha\":\"${ORIGINAL_BUILD_SHA}\"" \
                && echo "$db_health" | grep -Fq '"connection":"ready"'; then
                restored=true
                break
              fi
              echo "Waiting for production verification after cleanup (attempt ${attempt}/20)..."
              sleep 10
            done

            if [ "$restored" != "true" ]; then
              echo "Production did not verify cleanly after diagnostic cleanup." >&2
              exit 1
            fi
          fi

          final_mode=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.activeRevisionsMode \
            -o tsv)
          if [ "${final_mode,,}" != "single" ]; then
            echo "Production revision mode was not restored to Single: $final_mode" >&2
            exit 1
          fi

          echo "Production restored: single-revision mode, original build, live MSSQL."
