name: KH Rentals invoice checks on appleserv
on:
  push:
    branches:
      - feature/invoice-admin-validation-20261019
      - feature/invoice-document-snapshot-20261020

permissions:
  contents: read

concurrency:
  group: appleserv-khrental-invoice
  cancel-in-progress: false

jobs:
  invoice:
    if: github.repository == 'WasanthaK/khrental'
    runs-on: [self-hosted, Linux, X64, appleserv-khrental]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node dependencies
        run: npm ci
      - name: Validate invoice master controls
        run: npm run test:invoice-master
      - name: Validate candidate invoice PDF snapshots
        run: node --test tests/invoice-pdf-candidate.test.js
      - name: Validate archived invoice exact-byte contract
        run: node --test tests/invoice-archive-candidate.test.js
      - name: Validate guarded archive publishing and recovery
        run: node --test tests/invoice-archive-write-candidate.test.js
      - name: Validate atomic local invoice archive storage
        run: node --test tests/invoice-archive-local-proof.test.js
      - name: Validate authorization
        run: npm run test:authorization
      - name: Verify migrations on disposable SQL Server 2022
        run: node scripts/test-production-migrations-sqlserver.mjs
