name: KH Rentals invoice checks on appleserv
on:
  push:
    branches:
      - feature/invoice-admin-validation-20261019

permissions:
  contents: read

concurrency:
  group: appleserv-khrental-invoice
  cancel-in-progress: false

jobs:
  invoice:
    if: github.repository == 'WasanthaK/khrental'
    runs-on: [self-hosted, Linux, X64, appleserv-khrental]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node dependencies
        run: npm ci
      - name: Validate invoice master controls
        run: npm run test:invoice-master
      - name: Validate authorization
        run: npm run test:authorization
      - name: Verify migrations on disposable SQL Server 2022
        run: node scripts/test-production-migrations-sqlserver.mjs
