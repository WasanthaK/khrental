name: Verify serving Quixo public journey (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-live-public-readonly.mjs'
      - '.github/workflows/verify-live-public-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify public routes, deployed filters, catalog isolation, app health
        run: node scripts/verify-live-public-readonly.mjs
