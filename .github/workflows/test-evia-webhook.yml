name: Test Evia webhook

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/api/evia/**'
      - 'src/api/mssql/agreementWritePolicy.js'
      - 'src/components/agreements/AgreementActions.jsx'
      - 'tests/evia-webhook.test.js'
      - 'tests/agreement-signing-authority.test.js'
      - 'tests/evia-completed-documents.test.js'
      - 'src/api/storage/**'
      - 'tests/evia-storage-retention.test.js'
      - 'src/api/storage/authenticatedTenantRoute.js'
      - 'tests/evia-audit-http.test.js'
      - 'tests/evia-historic-audit.test.js'
      - 'tests/evia-archive-crash-recovery.test.js'
      - 'scripts/verify-evia-real-session-audit-http.mjs'
      - 'scripts/test-billing-two-tenant-sqlserver.mjs'
      - 'src/components/agreements/AgreementDocument.jsx'
      - 'src/hooks/useAuthenticatedAgreementDocument.js'
      - 'scripts/verify-phase4-agreement-signed-document-browser.mjs'
      - '.github/workflows/test-evia-webhook.yml'
  push:
    branches: [main]
    paths:
      - 'src/api/evia/**'
      - 'src/api/mssql/agreementWritePolicy.js'
      - 'src/components/agreements/AgreementActions.jsx'
      - 'tests/evia-webhook.test.js'
      - 'tests/evia-completed-documents.test.js'
      - 'src/api/storage/**'
      - 'tests/evia-storage-retention.test.js'
      - 'src/api/storage/authenticatedTenantRoute.js'
      - 'tests/evia-audit-http.test.js'
      - 'tests/evia-historic-audit.test.js'
      - 'tests/evia-archive-crash-recovery.test.js'
      - 'scripts/verify-evia-real-session-audit-http.mjs'
      - 'scripts/test-billing-two-tenant-sqlserver.mjs'
      - 'src/components/agreements/AgreementDocument.jsx'
      - 'src/hooks/useAuthenticatedAgreementDocument.js'
      - 'scripts/verify-phase4-agreement-signed-document-browser.mjs'
      - '.github/workflows/test-evia-webhook.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/agreement-signing-authority.test.js tests/evia-webhook.test.js tests/evia-completed-documents.test.js tests/evia-audit-http.test.js tests/evia-archive-crash-recovery.test.js tests/evia-historic-audit.test.js tests/evia-storage-retention.test.js
