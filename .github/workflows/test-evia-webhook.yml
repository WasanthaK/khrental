name: Test Evia webhook

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/api/evia/**'
      - 'tests/evia-webhook.test.js'
      - 'tests/evia-completed-documents.test.js'
      - 'src/api/storage/**'
      - 'tests/evia-storage-retention.test.js'
      - 'src/api/storage/authenticatedTenantRoute.js'
      - 'tests/evia-audit-http.test.js'
      - 'tests/evia-historic-audit.test.js'
      - 'tests/evia-archive-crash-recovery.test.js'
      - 'scripts/verify-evia-real-session-audit-http.mjs'
      - 'scripts/test-billing-two-tenant-sqlserver.mjs'
      - 'server.js'
      - '.github/workflows/test-evia-webhook.yml'
  push:
    branches: [main]
    paths:
      - 'src/api/evia/**'
      - 'tests/evia-webhook.test.js'
      - 'tests/evia-completed-documents.test.js'
      - 'src/api/storage/**'
      - 'tests/evia-storage-retention.test.js'
      - 'src/api/storage/authenticatedTenantRoute.js'
      - 'tests/evia-audit-http.test.js'
      - 'tests/evia-historic-audit.test.js'
      - 'tests/evia-archive-crash-recovery.test.js'
      - 'scripts/verify-evia-real-session-audit-http.mjs'
      - 'scripts/test-billing-two-tenant-sqlserver.mjs'
      - 'server.js'
      - '.github/workflows/test-evia-webhook.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/evia-webhook.test.js tests/evia-completed-documents.test.js tests/evia-audit-http.test.js tests/evia-archive-crash-recovery.test.js tests/evia-historic-audit.test.js
