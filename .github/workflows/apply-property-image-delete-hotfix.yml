name: Apply property image delete hotfix

on:
  push:
    branches:
      - hotfix-property-image-delete-path

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-property-image-delete-path
          fetch-depth: 0

      - name: Patch image delete URL parsing
        run: python3 .github/scripts/patch_property_image_delete.py

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PropertyForm.jsx src/pages/PropertyDetails.jsx
          git commit -m "Fix property image deletion for current storage URLs"
          git push origin HEAD:hotfix-property-image-delete-path
