name: R5 genuine sandbox Checkout response-loss acceptance
on:
  pull_request:
    paths:
      - 'scripts/verify-deployed-checkout-recovery.mjs'
      - '.github/workflows/verify-deployed-checkout-recovery.yml'
      - 'tests/checkout-recovery-harness.test.mjs'
  workflow_dispatch:
    inputs:
      expected_build:
        description: Exact accepted serving application SHA
        required: true
        type: string
      operation_id:
        description: Fresh fixture UUID for verify; exact used UUID for inspect or cleanup
        required: true
        type: string
      mode:
        description: Inspect or clean up an existing attempt without replaying verify
        required: true
        type: choice
        default: verify
        options: [verify, inspect, cleanup]
      scenario:
        description: Fresh scenario to verify, or the original fixture scenario for inspect or cleanup
        required: true
        type: choice
        default: completed-before-recovery
        options: [open, expired-before-recovery, completed-before-recovery]
      confirmation:
        description: VERIFY-CHECKOUT-RECOVERY, INSPECT-CHECKOUT-RECOVERY or CLEANUP-CHECKOUT-RECOVERY
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: khrental-production
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate syntax and the harness-to-workflow proof contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-deployed-checkout-recovery.mjs
          python3 - <<'PY'
          import ast, re, subprocess, textwrap
          from pathlib import Path
          lines = Path('.github/workflows/verify-deployed-checkout-recovery.yml').read_text().splitlines()
          checked = 0
          for index, line in enumerate(lines):
              match = re.fullmatch(r'( +)run: \|', line)
              if not match:
                  continue
              indent = len(match.group(1)) + 2
              block = []
              for following in lines[index + 1:]:
                  if following.strip() and len(following) - len(following.lstrip()) < indent:
                      break
                  block.append(following[indent:])
              subprocess.run(['bash', '-n'], input='\n'.join(block) + '\n', text=True, check=True)
              checked += 1
          assert checked >= 5, 'Workflow shell blocks were not found'
          source = '\n'.join(lines) + '\n'
          gate = textwrap.dedent(source.split("          python3 - <<'CHECKOUT_RECOVERY_PROOF'\n", 1)[1].split('          CHECKOUT_RECOVERY_PROOF\n', 1)[0])
          live = textwrap.dedent(source.split("          cat > \"$RUNNER_TEMP/checkout-live-output.py\" <<'CHECKOUT_RECOVERY_LIVE'\n", 1)[1].split('          CHECKOUT_RECOVERY_LIVE\n', 1)[0])
          compile(live, 'checkout-live-output.py', 'exec')
          assignments = [node for node in ast.walk(ast.parse(gate)) if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == 'expected_checks_by_scenario' for target in node.targets)]
          assert len(assignments) == 1, 'Proof check allowlist was not found'
          expected = ast.literal_eval(assignments[0].value)
          harness = Path('scripts/verify-deployed-checkout-recovery.mjs').read_text()
          actual = {name for call in re.findall(r'\bcheck\(([^;]+)\)', harness) for name in re.findall(r"'([a-z][a-z0-9_]+)'", call)}
          assert set(expected) == {'open', 'expired-before-recovery', 'completed-before-recovery'}
          assert len(expected['open']) == len(set(expected['open'])) == 12
          assert len(expected['expired-before-recovery']) == len(set(expected['expired-before-recovery'])) == 13
          assert len(expected['completed-before-recovery']) == len(set(expected['completed-before-recovery'])) == 16
          assert actual == {name for names in expected.values() for name in names}, 'Harness and workflow evidence contracts differ'
          print(f'Validated {checked} shell blocks, live marker sanitizer and exact scenario proof check sets without executing deployed work')
          PY
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 22
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_BUILD: ${{ inputs.expected_build }}
      CHECKOUT_RECOVERY_OPERATION: ${{ inputs.operation_id }}
      CHECKOUT_RECOVERY_MODE: ${{ inputs.mode }}
      CHECKOUT_RECOVERY_SCENARIO: ${{ inputs.scenario }}
      CHECKOUT_RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact reviewed source, mode and serving build
        shell: bash
        run: |
          set -euo pipefail
          case "$CHECKOUT_RECOVERY_MODE:$CHECKOUT_RECOVERY_CONFIRMATION" in
            verify:VERIFY-CHECKOUT-RECOVERY|inspect:INSPECT-CHECKOUT-RECOVERY|cleanup:CLEANUP-CHECKOUT-RECOVERY) ;;
            *) echo 'CHECKOUT_RECOVERY_BLOCKED=invalid_mode_confirmation' >&2; exit 1 ;;
          esac
          case "$CHECKOUT_RECOVERY_SCENARIO" in
            open|expired-before-recovery|completed-before-recovery) ;;
            *) echo 'CHECKOUT_RECOVERY_BLOCKED=invalid_scenario' >&2; exit 1 ;;
          esac
          [[ "$CHECKOUT_RECOVERY_OPERATION" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]
          [[ "$EXPECTED_BUILD" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_BUILD" = e0f7e821b8e511898836f71df86fde2fa8399463
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$CHECKOUT_RECOVERY_MODE" = verify ] && [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo 'CHECKOUT_RECOVERY_BLOCKED=inspect_original_operation_before_retry' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$EXPECTED_BUILD" "$GITHUB_SHA"
          git diff --name-only -z "$EXPECTED_BUILD" "$GITHUB_SHA" > "$RUNNER_TEMP/checkout-source-diff.txt"
          while IFS= read -r -d '' changed; do
            case "$changed" in
              docs/*|tests/*|scripts/verify-deployed-paid-inventory.mjs|.github/workflows/verify-deployed-paid-inventory.yml|scripts/verify-deployed-checkout-recovery.mjs|.github/workflows/verify-deployed-checkout-recovery.yml) ;;
              *) echo "Unverified runtime difference: $changed" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/checkout-source-diff.txt"
          node --check scripts/verify-deployed-checkout-recovery.mjs
          curl -fsS --max-time 30 https://app.quixo.homes/build-info.json | jq -e --arg sha "$EXPECTED_BUILD" '.buildSha==$sha' >/dev/null
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 3d42a180-fda5-4013-afcc-fdba10266f9b
      - name: Capture single-replica configuration and Ready revision
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          az extension add --name containerapp --upgrade --yes >/dev/null
          az containerapp show -g khrental-prod-rg -n khrental-app -o json > "$RUNNER_TEMP/checkout-app-before.json"
          jq -e '.properties.configuration.activeRevisionsMode=="Single" and
            .properties.latestRevisionName==.properties.latestReadyRevisionName and
            .properties.template.scale.minReplicas==1 and .properties.template.scale.maxReplicas==1 and
            (.properties.template.containers|length)==1 and
            (.properties.configuration.ingress.traffic|length)==1 and
            .properties.configuration.ingress.traffic[0].weight==100 and
            (.properties.configuration.ingress.traffic[0].revisionName==.properties.latestReadyRevisionName or
             (.properties.configuration.ingress.traffic[0].latestRevision==true and .properties.configuration.ingress.traffic[0].revisionName==null))' "$RUNNER_TEMP/checkout-app-before.json" >/dev/null
          revision=$(jq -r '.properties.latestReadyRevisionName' "$RUNNER_TEMP/checkout-app-before.json")
          image=$(jq -r '.properties.template.containers[0].image' "$RUNNER_TEMP/checkout-app-before.json")
          [[ "$revision" =~ ^khrental-app--[a-z0-9-]+$ ]]
          test "${image##*:}" = "$EXPECTED_BUILD"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Run selected mode once through the unchanged deployed service
        id: execute
        env:
          SERVING_REVISION: ${{ steps.baseline.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          digest=$(sha256sum scripts/verify-deployed-checkout-recovery.mjs | cut -d ' ' -f 1)
          remote="/tmp/checkout-recovery-$CHECKOUT_RECOVERY_OPERATION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$CHECKOUT_RECOVERY_MODE-$CHECKOUT_RECOVERY_SCENARIO.mjs"
          # One bounded connection, pinned source bytes, exclusive temporary file.
          # Never retry an ambiguous execution; inspect its original operation UUID.
          command="node --input-type=module -e \"const fs=await import('node:fs');const c=await import('node:crypto');const r=await fetch('https://raw.githubusercontent.com/WasanthaK/khrental/$GITHUB_SHA/scripts/verify-deployed-checkout-recovery.mjs',{signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error('Source unavailable');const b=await r.text();if(c.createHash('sha256').update(b).digest('hex')!=='$digest')throw Error('Source mismatch');const p='$remote';fs.writeFileSync(p,b,{flag:'wx'});process.env.CHECKOUT_RECOVERY_OPERATION='$CHECKOUT_RECOVERY_OPERATION';process.env.CHECKOUT_RECOVERY_MODE='$CHECKOUT_RECOVERY_MODE';process.env.CHECKOUT_RECOVERY_SCENARIO='$CHECKOUT_RECOVERY_SCENARIO';process.env.CHECKOUT_RECOVERY_CONFIRMATION='$CHECKOUT_RECOVERY_CONFIRMATION';try{await import('file://'+p)}finally{fs.unlinkSync(p)}\""
          test "${#command}" -lt 2000
          printf -v invocation '%q ' az containerapp exec -g khrental-prod-rg -n khrental-app --revision "$SERVING_REVISION" --command "$command"
          # Flush the local PTY and Azure Python output. The service transport can
          # still delay delivery; exact fixture metadata permits read-only discovery.
          # Only schema-validated IDs/counts are public while raw bytes stay private.
          cat > "$RUNNER_TEMP/checkout-live-output.py" <<'CHECKOUT_RECOVERY_LIVE'
          import json, os, re, sys
          from pathlib import Path
          operation = os.environ['CHECKOUT_RECOVERY_OPERATION']
          mode = os.environ['CHECKOUT_RECOVERY_MODE']
          scenario = os.environ['CHECKOUT_RECOVERY_SCENARIO']
          invalid = False
          def forward(line):
              global invalid
              line = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', line).strip()
              match = re.fullmatch(r'CHECKOUT_RECOVERY_(READY|WAITING)=(.*)', line)
              if not match:
                  return
              try:
                  value = json.loads(match.group(2))
                  assert isinstance(value, dict)
                  assert value.get('operation') == operation
                  assert value.get('mode') == mode == 'verify'
                  assert value.get('scenario') == scenario == 'completed-before-recovery'
                  keys = {'operation', 'mode', 'scenario'}
                  if match.group(1) == 'READY':
                      assert set(value) == keys | {'commandId', 'customerId', 'sessionId', 'waitSeconds'}
                      assert value['commandId'] == operation
                      assert isinstance(value['customerId'], str) and re.fullmatch(r'cus_[A-Za-z0-9]+', value['customerId'])
                      assert isinstance(value['sessionId'], str) and re.fullmatch(r'cs_test_[A-Za-z0-9]+', value['sessionId'])
                      assert type(value['waitSeconds']) is int and value['waitSeconds'] == 600
                  else:
                      assert set(value) == keys | {'elapsedSeconds'}
                      assert type(value['elapsedSeconds']) is int and 0 <= value['elapsedSeconds'] <= 600
              except (ValueError, AssertionError, TypeError):
                  invalid = True
                  return
              print('CHECKOUT_RECOVERY_LIVE_' + match.group(1) + '=' + json.dumps(value, separators=(',', ':')), flush=True)
          pending = b''
          with (Path(os.environ['RUNNER_TEMP']) / 'checkout-result.txt').open('wb') as raw:
              while chunk := sys.stdin.buffer.read1(65536):
                  raw.write(chunk)
                  raw.flush()
                  pending += chunk
                  while b'\n' in pending:
                      line, pending = pending.split(b'\n', 1)
                      forward(line.decode('utf-8', errors='replace'))
              if pending:
                  forward(pending.decode('utf-8', errors='replace'))
          raise SystemExit(invalid)
          CHECKOUT_RECOVERY_LIVE
          set +e
          PYTHONUNBUFFERED=1 script -q -e -f -c "$invocation" /dev/null 2>&1 | python3 -u "$RUNNER_TEMP/checkout-live-output.py"
          execution_status=("${PIPESTATUS[@]}")
          set -e
          remote_rc=${execution_status[0]}
          stream_rc=${execution_status[1]}
          printf '%s\n' "$remote_rc" > "$RUNNER_TEMP/checkout-exit-code.txt"
          printf '%s\n' "$stream_rc" > "$RUNNER_TEMP/checkout-live-exit-code.txt"
          echo "CHECKOUT_RECOVERY_EXEC_EXIT_CODE=$remote_rc"
          echo "CHECKOUT_RECOVERY_STREAM_EXIT_CODE=$stream_rc"
          if [ "$remote_rc" = 0 ]; then exit "$stream_rc"; fi
          exit "$remote_rc"
      - name: Retain sanitized evidence and require mode-specific proof
        if: always() && steps.execute.outcome != 'skipped'
        env:
          SERVING_REVISION: ${{ steps.baseline.outputs.revision }}
        shell: bash
        run: |
          python3 - <<'CHECKOUT_RECOVERY_PROOF'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          operation = os.environ['CHECKOUT_RECOVERY_OPERATION']
          mode = os.environ['CHECKOUT_RECOVERY_MODE']
          scenario = os.environ['CHECKOUT_RECOVERY_SCENARIO']
          raw_path = root / 'checkout-result.txt'
          raw = raw_path.read_text(errors='replace') if raw_path.exists() else ''
          raw = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', raw)
          rc_path = root / 'checkout-exit-code.txt'
          rc = int(rc_path.read_text()) if rc_path.exists() else -1
          stream_path = root / 'checkout-live-exit-code.txt'
          stream_rc = int(stream_path.read_text()) if stream_path.exists() else -1
          records, errors = [], []
          def safe(value):
              if isinstance(value, dict):
                  return all(not re.search(r'secret|password|authorization|access.?token|refresh.?token|email|checkout.?url|success.?url|cancel.?url|card.?number|(?:^|[_-])(?:cvc|cvv|pan)(?:$|[_-])', key, re.I) and safe(item) for key, item in value.items())
              if isinstance(value, list):
                  return all(safe(item) for item in value)
              if isinstance(value, str):
                  return not re.search(r'https?://|(?:sk|rk|pk)_(?:test|live)_|[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}', value, re.I)
              return value is None or isinstance(value, (bool, int, float))
          for line in raw.splitlines():
              match = re.fullmatch(r'CHECKOUT_RECOVERY_(CHECK|PROGRESS|READY|WAITING|CLEANUP|PASS|INSPECT|FAILED|CLEANUP_FAILED)=(.*)', line.strip())
              if not match:
                  continue
              try:
                  value = json.loads(match.group(2))
                  assert isinstance(value, dict)
                  assert safe(value)
                  assert value.get('operation') == operation
                  assert value.get('mode') == mode
                  assert value.get('scenario') == scenario
              except (ValueError, AssertionError, TypeError):
                  errors.append('invalid_or_unsafe_marker')
                  continue
              records.append((match.group(1), value))
          if rc != 0:
              errors.append('remote_execution_unconfirmed')
          if stream_rc != 0:
              errors.append('live_output_unconfirmed')
          if any(kind in ['FAILED', 'CLEANUP_FAILED'] for kind, _ in records):
              errors.append('harness_failed')
          selected = {'verify': 'PASS', 'inspect': 'INSPECT', 'cleanup': 'CLEANUP'}.get(mode)
          finals = [value for kind, value in records if kind == selected]
          result = finals[0] if len(finals) == 1 else {'operation': operation, 'mode': mode, 'scenario': scenario}
          if len(finals) != 1 or result.get('mode') != mode or result.get('scenario') != scenario:
              errors.append('missing_or_ambiguous_final_proof')
          expected_checks_by_scenario = {
              'open': ['preflight_and_protected_baseline', 'private_pending_stock_without_credentials', 'genuine_customer_checkpoint_without_duplicate', 'single_checkout_effect_response_discarded', 'original_pending_journal_and_checkout_intent', 'unique_bound_checkout_exhaustive_readback', 'natural_sql_backoff_without_clock_edits', 'original_checkout_recovered_once', 'completed_exact_retry_without_provider_write', 'no_payment_subscription_invoice_or_stock_promotion', 'protected_accounts_clocks_and_worker_scope_unchanged', 'cleanup_retains_all_journal_and_stock_history'],
              'expired-before-recovery': ['preflight_and_protected_baseline', 'private_pending_stock_without_credentials', 'genuine_customer_checkpoint_without_duplicate', 'single_checkout_effect_response_discarded', 'original_pending_journal_and_checkout_intent', 'unique_bound_checkout_exhaustive_readback', 'original_session_expired_before_recovery', 'natural_sql_backoff_without_clock_edits', 'expired_checkout_recovered_to_terminal_result', 'expired_checkout_retry_refused_without_provider_write', 'no_payment_subscription_invoice_or_stock_promotion', 'protected_accounts_clocks_and_worker_scope_unchanged', 'cleanup_retains_all_journal_and_stock_history'],
              'completed-before-recovery': ['preflight_and_protected_baseline', 'private_pending_stock_without_credentials', 'genuine_customer_checkpoint_without_duplicate', 'single_checkout_effect_response_discarded', 'original_pending_journal_and_checkout_intent', 'unique_bound_checkout_exhaustive_readback', 'hosted_payment_completed_before_recovery', 'natural_sql_backoff_without_clock_edits', 'completed_checkout_recovered_to_terminal_result', 'completed_checkout_retry_refused_without_provider_write', 'paid_recovery_keeps_stock_pending_until_refresh', 'paid_refresh_promotes_exact_private_stock', 'paid_refresh_retry_preserves_billing_and_promotion', 'single_paid_checkout_and_financial_effect', 'protected_accounts_clocks_and_worker_scope_unchanged', 'cleanup_retains_all_journal_and_stock_history']
          }
          if scenario not in expected_checks_by_scenario:
              errors.append('invalid_scenario')
          cleanup = [value for kind, value in records if kind == 'CLEANUP']
          def identifier(value, pattern):
              return isinstance(value, str) and re.fullmatch(pattern, value) is not None
          def integers(value, expected):
              return all(type(value.get(key)) is int and value[key] == count for key, count in expected.items())
          def paid_cleanup(value, allow_expiry_race=False):
              required = ['verified', 'fixtureInactive', 'recordsRetained', 'protectedBillingUnchanged', 'workerScopeUnchanged', 'sessionCompleted', 'subscriptionCanceled', 'initialInvoicePreserved', 'noAdditionalFinancialObjects']
              denied = ['noSession', 'sessionExpired', 'noSubscription', 'noInvoice', 'noPayment']
              retained = [value.get(key) for key in ['pendingStockRetained', 'promotedStockRetained']]
              expiration = (integers(value, {'cleanupPosts': 0}) and value.get('expiryResponseRecovered', False) is False) or (allow_expiry_race and integers(value, {'cleanupPosts': 1}) and value.get('expiryResponseRecovered') is True)
              return all(value.get(key) is True for key in required) and all(value.get(key) is False for key in denied) and expiration and type(value.get('cleanupCancellationRequests')) is int and value['cleanupCancellationRequests'] in [0, 1] and all(type(count) is int and count in [0, 1] for count in retained) and sum(retained) == 1
          def live_marker(kind, value):
              keys = {'operation', 'mode', 'scenario'}
              if mode != 'verify' or scenario != 'completed-before-recovery':
                  return False
              if kind == 'READY':
                  return set(value) == keys | {'commandId', 'customerId', 'sessionId', 'waitSeconds'} and value.get('commandId') == operation and value.get('customerId') == result.get('customerId') and value.get('sessionId') == result.get('sessionId') and identifier(value.get('customerId'), r'cus_[A-Za-z0-9]+') and identifier(value.get('sessionId'), r'cs_test_[A-Za-z0-9]+') and integers(value, {'waitSeconds': 600})
              return set(value) == keys | {'elapsedSeconds'} and type(value.get('elapsedSeconds')) is int and 0 <= value['elapsedSeconds'] <= 600
          live = [(index, kind, value) for index, (kind, value) in enumerate(records) if kind in ['READY', 'WAITING']]
          if any(not live_marker(kind, value) for _, kind, value in live):
              errors.append('hosted_wait_marker_unconfirmed')
          if mode == 'verify':
              completed = scenario == 'completed-before-recovery'
              required = ['passed', 'sandbox', 'responseDiscarded', 'originalIdempotencyKeyPreserved', 'originalRecoveryRetryStable', 'fixtureInactive', 'recordsRetained', 'protectedBillingUnchanged', 'workerScopeUnchanged', 'processLocalStagingReadiness']
              denied = ['automaticWorkerAccepted', 'httpAccepted', 'uiAccepted', 'credentialLoginAccepted', 'wholeProcessCrashAccepted', 'naturalCheckoutExpiryTimingAccepted', 'liveChargingEnabled', 'servingConfigurationChanged']
              counts = {'customerPosts': 1, 'checkoutPosts': 1, 'recoveryProviderWrites': 0, 'checkoutSessions': 1, 'subscriptionsCreated': int(completed), 'invoicesCreated': int(completed), 'paymentIntentsCreated': int(completed), 'chargesCreated': int(completed), 'actualProperties': int(completed), 'actualUnits': 0}
              counts.update(prepExpiryPosts=1 if scenario == 'expired-before-recovery' else 0, cleanupPosts=1 if scenario == 'open' else 0)
              if completed:
                  required += ['hostedCheckoutCompleted', 'pendingStockPreservedUntilRefresh', 'stockPromotedOnce', 'stockPrivate', 'promotedStockRetained', 'initialInvoicePreserved', 'noAdditionalFinancialObjects', 'subscriptionCanceled', 'sessionCompleted']
                  denied += ['sessionExpired', 'prepExpiryResponseRecovered']
                  counts.update(refreshProviderWrites=0, cleanupCancellationRequests=1, initialInvoiceAmountMinor=500, billedQuantity=1, promotionAuditCount=1)
                  if result.get('currency') != 'usd' or any(key in result and result[key] is not False for key in ['stockUnchanged', 'pendingStockPreserved']):
                      errors.append('paid_stock_or_currency_unconfirmed')
                  if not all(identifier(result.get(key), pattern) for key, pattern in [('subscriptionId', r'sub_[A-Za-z0-9]+'), ('initialInvoiceId', r'in_[A-Za-z0-9]+'), ('paymentIntentId', r'pi_[A-Za-z0-9]+'), ('chargeId', r'ch_[A-Za-z0-9]+')]):
                      errors.append('paid_financial_identity_unconfirmed')
              else:
                  required += ['stockUnchanged', 'pendingStockPreserved', 'sessionExpired']
              if not all(result.get(key) is True for key in required) or not all(result.get(key) is False for key in denied) or not integers(result, counts) or any(kind == 'INSPECT' for kind, _ in records):
                  errors.append('acceptance_contract_unconfirmed')
              if result.get('exactRetryAccepted') is not (scenario == 'open'):
                  errors.append('checkout_retry_outcome_unconfirmed')
              if completed:
                  if len(cleanup) != 1 or not paid_cleanup(cleanup[0]) or not integers(cleanup[0], {'cleanupCancellationRequests': 1, 'pendingStockRetained': 0, 'promotedStockRetained': 1}):
                      errors.append('paid_cleanup_unconfirmed')
                  ready = [index for index, kind, _ in live if kind == 'READY']
                  waiting = [(index, value.get('elapsedSeconds')) for index, kind, value in live if kind == 'WAITING']
                  before_wait = [index for index, (kind, value) in enumerate(records) if kind == 'CHECK' and value.get('name') == 'unique_bound_checkout_exhaustive_readback']
                  after_wait = [index for index, (kind, value) in enumerate(records) if kind == 'CHECK' and value.get('name') == 'hosted_payment_completed_before_recovery']
                  elapsed = [seconds for _, seconds in waiting]
                  if len(ready) != 1 or len(before_wait) != 1 or len(after_wait) != 1 or not before_wait[0] < ready[0] < after_wait[0] or any(not ready[0] < index < after_wait[0] for index, _ in waiting) or any(type(seconds) is not int for seconds in elapsed) or elapsed != sorted(set(elapsed)):
                      errors.append('hosted_wait_sequence_unconfirmed')
              else:
                  if len(cleanup) != 1 or not all(cleanup[0].get(key) is True for key in ['verified', 'fixtureInactive', 'sessionExpired', 'recordsRetained', 'noSubscription', 'noInvoice', 'noPayment', 'protectedBillingUnchanged', 'workerScopeUnchanged']):
                      errors.append('cleanup_unconfirmed')
                  if len(cleanup) != 1 or cleanup[0].get('noSession') is not False or not integers(cleanup[0], {'cleanupPosts': counts['cleanupPosts']}):
                      errors.append('cleanup_expiration_count_unconfirmed')
              if scenario in ['expired-before-recovery', 'completed-before-recovery']:
                  guidance = 'Checkout completed. Refresh subscription status.' if completed else 'Checkout expired. Open sandbox checkout again.'
                  terminal = {'sessionId': result.get('sessionId'), 'requiresNewSession': True, 'message': guidance}
                  terminal_result = result.get('terminalResult')
                  if not identifier(result.get('sessionId'), r'cs_test_[A-Za-z0-9]+') or not isinstance(terminal_result, dict) or terminal_result.get('requiresNewSession') is not True or terminal_result != terminal or not all(result.get(key) is True for key in ['terminalRequiresNewSession', 'terminalGuidanceAccepted', 'checkoutRetryRejected']) or result.get('terminalHasHostedUrl') is not False or result.get('checkoutRetryCode') != 'BILLING_REVIEW_EXPIRED':
                      errors.append('terminal_result_unconfirmed')
              expected_checks = expected_checks_by_scenario.get(scenario, [])
              checks = result.get('checks')
              observed = [value.get('name') for kind, value in records if kind == 'CHECK']
              if checks != expected_checks or observed != expected_checks:
                  errors.append('check_sequence_unconfirmed')
          elif mode == 'inspect':
              if not all(result.get(key) is True for key in ['readOnly', 'protectedBillingUnchanged', 'workerScopeUnchanged']) or not all(type(result.get(key)) is int and result[key] == 0 for key in ['providerWrites', 'localWrites']) or any(kind in ['PASS', 'CLEANUP'] for kind, _ in records):
                  errors.append('inspection_contract_unconfirmed')
          elif mode == 'cleanup':
              unpaid = all(result.get(key) is True for key in ['verified', 'fixtureInactive', 'recordsRetained', 'noSubscription', 'noInvoice', 'noPayment', 'protectedBillingUnchanged', 'workerScopeUnchanged']) and (result.get('sessionExpired') is True or result.get('noSession') is True)
              paid = scenario == 'completed-before-recovery' and paid_cleanup(result, allow_expiry_race=True)
              if not (unpaid or paid) or any(kind in ['PASS', 'INSPECT'] for kind, _ in records):
                  errors.append('cleanup_contract_unconfirmed')
          else:
              errors.append('invalid_mode')
          summary = {'operation': operation, 'mode': mode, 'scenario': scenario, 'sourceSha': os.environ['GITHUB_SHA'], 'servingBuild': os.environ['EXPECTED_BUILD'], 'servingRevision': os.environ['SERVING_REVISION'], 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'workflowProofValid': not errors, 'remoteExitCode': rc, 'liveOutputExitCode': stream_rc, 'errors': sorted(set(errors)), 'proof': result}
          log = ''.join('CHECKOUT_RECOVERY_' + kind + '=' + json.dumps(value, separators=(',', ':')) + '\n' for kind, value in records)
          Path('checkout-recovery.txt').write_text(log)
          Path('checkout-recovery-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(log, end='')
          print('CHECKOUT_RECOVERY_PROOF=' + json.dumps({'valid': not errors, 'errors': summary['errors']}))
          raise SystemExit(bool(errors))
          CHECKOUT_RECOVERY_PROOF
      - name: Verify complete application configuration stayed unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ ! -s "$RUNNER_TEMP/checkout-app-before.json" ]; then
            echo '{"equal":null,"notCaptured":true}' > checkout-config-comparison.json
            exit 0
          fi
          az containerapp show -g khrental-prod-rg -n khrental-app -o json > "$RUNNER_TEMP/checkout-app-after.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          def config(side):
              properties = json.loads((root / f'checkout-app-{side}.json').read_text())['properties']
              return {'template': properties['template'], 'configuration': properties['configuration'], 'ready': properties['latestReadyRevisionName'], 'latest': properties['latestRevisionName']}
          def differences(a, b, path='config'):
              if type(a) is not type(b):
                  return [path]
              if isinstance(a, dict):
                  return [p for key in sorted(set(a) | set(b)) for p in ([path + '.' + key] if key not in a or key not in b else differences(a[key], b[key], path + '.' + key))]
              if isinstance(a, list):
                  return [path + '.length'] if len(a) != len(b) else [p for i, (x, y) in enumerate(zip(a, b)) for p in differences(x, y, path + '[' + str(i) + ']')]
              return [] if a == b else [path]
          paths = differences(config('before'), config('after'))
          result = {'equal': not paths, 'differentPaths': paths}
          Path('checkout-config-comparison.json').write_text(json.dumps(result) + '\n')
          print('CHECKOUT_RECOVERY_CONFIG_COMPARISON=' + json.dumps(result))
          raise SystemExit(bool(paths))
          PY
      - name: Verify public build and SQL health independently
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          build_ok=false
          sql_ok=false
          if curl -fsS --max-time 30 https://app.quixo.homes/build-info.json | jq -e --arg sha "$EXPECTED_BUILD" '.buildSha==$sha' >/dev/null; then build_ok=true; fi
          if curl -fsS --retry 3 --retry-delay 3 --max-time 30 https://app.quixo.homes/api/mssql/health | jq -e '.ok and .connection=="ready"' >/dev/null; then sql_ok=true; fi
          jq -n --argjson build "$build_ok" --argjson sql "$sql_ok" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{buildVerified:$build,sqlHealthy:$sql,verifiedAt:$at}' | tee checkout-public-health.json
          test "$build_ok" = true && test "$sql_ok" = true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkout-operation-recovery-${{ inputs.scenario }}-${{ inputs.mode }}
          path: |
            checkout-recovery.txt
            checkout-recovery-summary.json
            checkout-config-comparison.json
            checkout-public-health.json
          if-no-files-found: warn
          retention-days: 30
