name: Test cancelled agreement deletion

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/api/mssql/agreementDeleteRouter.js'
      - 'src/api/mssql/compositeRouter.js'
      - 'src/pages/AgreementList.jsx'
      - 'tests/agreement-delete.test.js'
      - '.github/workflows/test-agreement-delete.yml'
  push:
    branches: [main]
    paths:
      - 'src/api/mssql/agreementDeleteRouter.js'
      - 'src/api/mssql/compositeRouter.js'
      - 'src/pages/AgreementList.jsx'
      - 'tests/agreement-delete.test.js'
      - '.github/workflows/test-agreement-delete.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/agreement-delete.test.js
