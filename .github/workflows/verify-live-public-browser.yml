name: Verify live Quixo public browser journey (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-live-public-browser.mjs'
      - '.github/workflows/verify-live-public-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check real public search, filter and selected property at desktop/mobile
        run: node scripts/verify-live-public-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-public-browser-proof
          path: live-public-browser-proof/
          if-no-files-found: ignore
