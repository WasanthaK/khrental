name: Inspect retained Evia package metadata
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Count completion metadata using existing runtime SQL connection
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          ready_revision=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestReadyRevisionName -o tsv)
          test -n "$ready_revision"
          fqdn=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --silent --show-error --max-time 120 "https://$fqdn/api/mssql/health" >/dev/null
          replica=$(az containerapp replica list --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$ready_revision" --query '[0].name' -o tsv)
          test -n "$replica"
          cat > metadata-readonly.js <<'JS'
          (async()=>{let{runSingleQuery:q}=await import('./src/api/mssql/query.js');let r=await q(`SELECT COUNT(*) n,SUM(CASE WHEN LOWER(JSON_QUERY(raw_data,'$.payloadKeys')) LIKE '%"completedpackage"%' THEN 1 ELSE 0 END) package_keys,SUM(CASE WHEN LOWER(JSON_QUERY(raw_data,'$.payloadKeys')) LIKE '%"data"%' OR LOWER(JSON_QUERY(raw_data,'$.payloadKeys')) LIKE '%"payload"%' OR LOWER(JSON_QUERY(raw_data,'$.payloadKeys')) LIKE '%"eventdata"%' THEN 1 ELSE 0 END) opaque_envelopes,SUM(CASE WHEN JSON_QUERY(raw_data,'$.payloadKeys') IS NOT NULL THEN 1 ELSE 0 END) keys_recorded FROM dbo.webhook_events WHERE ISJSON(raw_data)=1 AND createdat>=DATEADD(hour,-24,SYSUTCDATETIME()) AND (TRY_CONVERT(int,event_id)=3 OR event_type IN('request.completed','signing_completed'))`);console.log('EVIA_PACKAGE_METADATA_COUNTS='+JSON.stringify(r));console.log('EVIA_PACKAGE_METADATA_READONLY_OK');process.exit(0)})().catch(()=>{console.error('EVIA_PACKAGE_METADATA_READONLY_FAILED');process.exit(1)})
          JS
          encoded=$(base64 -w0 metadata-readonly.js)
          remote_command="node -e \"eval(Buffer.from('$encoded','base64').toString())\""
          printf -v exec_command '%q ' az containerapp exec --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$ready_revision" --replica "$replica" --command "$remote_command"
          script -q -e -c "$exec_command" /dev/null | tee metadata-result.txt
          grep -Fq EVIA_PACKAGE_METADATA_READONLY_OK metadata-result.txt
