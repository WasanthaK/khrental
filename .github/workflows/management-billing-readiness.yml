name: Management billing sandbox readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/api/managementBilling/**'
      - 'scripts/check-management-billing-readiness.mjs'
      - '.github/workflows/management-billing-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Inspect configured sandbox only
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
        run: node scripts/check-management-billing-readiness.mjs
