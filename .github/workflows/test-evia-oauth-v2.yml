name: Test Evia V2 integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/api/evia/oauthV2.js'
      - 'src/services/eviaSignService.js'
      - 'src/services/eviaV2SigningService.js'
      - 'tests/evia-oauth-v2.test.js'
      - 'tests/evia-audit-oauth-client.test.js'
      - 'tests/evia-signing-v2.test.js'
      - 'scripts/verify-evia-real-session-audit-http.mjs'
      - 'Dockerfile'
      - '.github/workflows/test-evia-oauth-v2.yml'
  push:
    branches: [main]
    paths:
      - 'src/api/evia/oauthV2.js'
      - 'src/services/eviaSignService.js'
      - 'src/services/eviaV2SigningService.js'
      - 'tests/evia-oauth-v2.test.js'
      - 'tests/evia-audit-oauth-client.test.js'
      - 'tests/evia-signing-v2.test.js'
      - 'scripts/verify-evia-real-session-audit-http.mjs'
      - 'Dockerfile'
      - '.github/workflows/test-evia-oauth-v2.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/evia-audit-oauth-client.test.js tests/evia-oauth-v2.test.js tests/evia-signing-v2.test.js
