name: Build and deploy KH Rentals container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('khrental-pr-{0}', github.event.pull_request.number) || 'khrental-production' }}
  cancel-in-progress: true

env:
  CONTAINER_PORT: '5174'
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app
  PASSWORD_RESET_BASE_URL: https://khrental-app.proudpebble-f58b5187.southeastasia.azurecontainerapps.io

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:authorization
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Evia Sign OAuth
        uses: azure/cli@v2
        env:
          EVIA_CLIENT_ID: ${{ secrets.EVIA_SIGN_CLIENT_ID || secrets.VITE_EVIA_SIGN_CLIENT_ID || secrets.CLIENT_ID || secrets.CLIENTID }}
          EVIA_CLIENT_SECRET: ${{ secrets.EVIA_SIGN_CLIENT_SECRET || secrets.VITE_EVIA_SIGN_CLIENT_SECRET || secrets.CLIENT_SECRET || secrets.CLIENTSECRET || secrets.SECRET }}
        with:
          inlineScript: |
            set -euo pipefail

            if [ -z "${EVIA_CLIENT_ID:-}" ]; then
              echo "Evia Client ID is not configured in the GitHub Production environment." >&2
              exit 1
            fi

            if [ -z "${EVIA_CLIENT_SECRET:-}" ]; then
              echo "Evia Client Secret is not configured under any supported secret name in the GitHub Production environment." >&2
              exit 1
            fi

            az extension add --name containerapp --upgrade --yes
            az containerapp secret set \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets evia-sign-client-secret="$EVIA_CLIENT_SECRET" \
              --output none

            az containerapp update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set-env-vars \
                EVIA_SIGN_CLIENT_ID="$EVIA_CLIENT_ID" \
                VITE_EVIA_SIGN_CLIENT_ID="$EVIA_CLIENT_ID" \
                EVIA_SIGN_CLIENT_SECRET=secretref:evia-sign-client-secret \
              --output none

      - name: Configure server-side email delivery
        uses: azure/cli@v2
        env:
          SENDGRID_API_KEY: ${{ secrets.TWILIO_SENDGRID_API_KEY || secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: contact@quixo.online
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME || secrets.VITE_EMAIL_FROM_NAME || 'KH Rentals' }}
        with:
          inlineScript: |
            set -euo pipefail

            if [ -z "$SENDGRID_API_KEY" ]; then
              echo "TWILIO_SENDGRID_API_KEY (or SENDGRID_API_KEY) is not configured in GitHub." >&2
              exit 1
            fi

            if [ -z "$EMAIL_FROM" ]; then
              echo "EMAIL_FROM (or VITE_EMAIL_FROM) is not configured in GitHub." >&2
              exit 1
            fi

            az extension add --name containerapp --upgrade --yes
            az containerapp secret set \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets sendgrid-api-key="$SENDGRID_API_KEY" \
              --output none
            az containerapp update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set-env-vars \
                TWILIO_SENDGRID_API_KEY=secretref:sendgrid-api-key \
                EMAIL_FROM="$EMAIL_FROM" \
                EMAIL_FROM_NAME="$EMAIL_FROM_NAME" \
                VITE_USE_MSSQL_API=true \
                PASSWORD_RESET_BASE_URL="$PASSWORD_RESET_BASE_URL" \
              --output none

      - name: Set up Node for R2 validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate durable R2 storage
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          for required in R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "$required is not configured in the GitHub Production environment." >&2
              exit 1
            fi
          done

          node scripts/validate-r2-connection.mjs

      - name: Configure durable R2 storage
        uses: azure/cli@v2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          inlineScript: |
            set -euo pipefail

            az extension add --name containerapp --upgrade --yes
            az containerapp secret set \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets \
                r2-access-key-id="$R2_ACCESS_KEY_ID" \
                r2-secret-access-key="$R2_SECRET_ACCESS_KEY" \
              --output none

            az containerapp update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set-env-vars \
                STORAGE_DRIVER=r2 \
                R2_ACCOUNT_ID="$R2_ACCOUNT_ID" \
                R2_BUCKET="$R2_BUCKET" \
                R2_ACCESS_KEY_ID=secretref:r2-access-key-id \
                R2_SECRET_ACCESS_KEY=secretref:r2-secret-access-key \
              --output none

      - name: Deploy immutable image to the serving revision
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az extension add --name containerapp --upgrade --yes

            az containerapp revision set-mode \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --mode single \
              --output none

            az containerapp ingress update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --target-port "$CONTAINER_PORT"

            az containerapp update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "${{ steps.image.outputs.name }}:${{ github.sha }}" \
              --command "/bin/sh" \
              --args "scripts/start-container.sh"

      - name: Verify latest revision readiness and public browser build
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az extension add --name containerapp --upgrade --yes

            fqdn=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)

            revision_mode=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.configuration.activeRevisionsMode -o tsv)

            if [ "${revision_mode,,}" != "single" ]; then
              echo "Production Container App is not in single-revision mode: $revision_mode" >&2
              exit 1
            fi

            startup_command=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[0].command[0]" -o tsv)

            startup_arg=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[0].args[0]" -o tsv)

            if [ "$startup_command" != "/bin/sh" ] || [ "$startup_arg" != "scripts/start-container.sh" ]; then
              echo "Unexpected production startup command. command=${startup_command:-none}; arg=${startup_arg:-none}" >&2
              exit 1
            fi

            echo "Verified production startup command: $startup_command $startup_arg"

            latest_revision=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.latestRevisionName -o tsv)

            echo "Latest Azure revision: $latest_revision"

            ready_revision=""
            for attempt in $(seq 1 30); do
              ready_revision=$(az containerapp show \
                --name "$AZURE_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --query properties.latestReadyRevisionName -o tsv)

              if [ "$ready_revision" = "$latest_revision" ]; then
                echo "Latest revision is ready: $latest_revision"
                break
              fi

              echo "Waiting for $latest_revision to become ready (latest ready: ${ready_revision:-none}, attempt $attempt/30)..."
              sleep 6
            done

            ready_revision=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.latestReadyRevisionName -o tsv)

            if [ "$ready_revision" != "$latest_revision" ]; then
              echo "Latest revision did not become ready. Latest: $latest_revision; ready: ${ready_revision:-none}" >&2
              echo "Revision state:" >&2
              az containerapp revision show \
                --name "$AZURE_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision "$latest_revision" \
                --query "{name:name,active:properties.active,healthState:properties.healthState,provisioningState:properties.provisioningState,runningState:properties.runningState,replicas:properties.replicas,trafficWeight:properties.trafficWeight}" \
                -o jsonc || true

              echo "Latest revision system logs:" >&2
              az containerapp logs show \
                --name "$AZURE_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision "$latest_revision" \
                --type system \
                --tail 100 \
                --format text || true

              echo "Latest revision console logs:" >&2
              az containerapp logs show \
                --name "$AZURE_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision "$latest_revision" \
                --type console \
                --tail 100 \
                --format text || true
              exit 1
            fi

            health=$(curl --fail --retry 10 --retry-delay 6 "https://${fqdn}/api/health")
            echo "$health"
            curl --fail --retry 10 --retry-delay 6 "https://${fqdn}/api/mssql/health"

            build_info=$(curl --fail --retry 10 --retry-delay 6 "https://${fqdn}/build-info.json")
            echo "Public build fingerprint: $build_info"

            if ! echo "$build_info" | grep -Fq "\"buildSha\":\"${GITHUB_SHA}\""; then
              echo "Public FQDN is not serving the just-deployed commit ${GITHUB_SHA}." >&2
              exit 1
            fi

            runtime_config=$(curl --fail --retry 10 --retry-delay 6 "https://${fqdn}/env-config.js")

            if ! echo "$runtime_config" | grep -Fq "VITE_USE_MSSQL_API: 'true'"; then
              echo "Production browser runtime is not configured to use the MSSQL API." >&2
              exit 1
            fi

            if ! echo "$runtime_config" | grep -Eq "VITE_EVIA_SIGN_CLIENT_ID: '[^']+'"; then
              echo "Production browser runtime is missing the Evia Sign Client ID." >&2
              exit 1
            fi

            # Regression guard: recovery validation must remain anonymous even if
            # the browser still has a stale/expired Authorization token. An
            # intentionally invalid reset token is safe and must produce a normal
            # validation response rather than AUTH_CONTEXT_REQUIRED/INVALID_SESSION.
            reset_probe=$(curl --fail --retry 5 --retry-delay 3 \
              -H 'Authorization: Bearer intentionally-stale-production-probe' \
              "https://${fqdn}/api/platform/auth/reset-password/validate?token=intentionally-invalid-production-probe")
            echo "Password recovery anonymous probe: $reset_probe"

            if ! echo "$reset_probe" | grep -Fq '"valid":false'; then
              echo "Password recovery validation did not return the expected anonymous invalid-token response." >&2
              exit 1
            fi

            if echo "$reset_probe" | grep -Eq 'AUTH_CONTEXT_REQUIRED|INVALID_SESSION'; then
              echo "Password recovery was incorrectly blocked by stale authentication context." >&2
              exit 1
            fi

            echo "Production public FQDN is serving ${GITHUB_SHA} from ready revision $latest_revision with deterministic startup, live MSSQL connectivity, expected browser runtime configuration, and anonymous password recovery validation."
