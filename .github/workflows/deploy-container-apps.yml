name: Build and deploy KH Rentals container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: khrental-production
  cancel-in-progress: true

env:
  CONTAINER_PORT: '5174'
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:authorization
      - run: npm run build

  migrate-staff-property-assignments:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 7
    needs: verify
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Run idempotent staff-property migration in production
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          fqdn=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --retry 10 --retry-delay 6 "https://${fqdn}/api/health" >/dev/null

          migration_payload=$(base64 -w0 migrations/20260915_01_create_staff_property_assignments.sql)
          runner_payload=$(base64 -w0 <<NODE
          import fs from 'node:fs';

          const rawEnvironment = fs.readFileSync('/proc/1/environ');
          for (const entry of rawEnvironment.toString('utf8').split('\0')) {
            const separator = entry.indexOf('=');
            if (separator > 0) {
              process.env[entry.slice(0, separator)] = entry.slice(separator + 1);
            }
          }

          const { closeMssqlPool, getMssqlPool } = await import('/app/src/api/mssql/pool.js');
          const migrationSql = Buffer.from('${migration_payload}', 'base64').toString('utf8');
          const pool = await getMssqlPool();

          try {
            await pool.request().batch(migrationSql);
            const verification = await pool.request().query(`
              SELECT
                CASE WHEN OBJECT_ID(N'dbo.staff_property_assignments', N'U') IS NULL THEN 0 ELSE 1 END AS table_exists,
                CASE WHEN OBJECT_ID(N'dbo.staff_property_assignments', N'U') IS NULL THEN 0
                     ELSE (SELECT COUNT(*) FROM dbo.staff_property_assignments) END AS assignment_count;
            `);
            const row = verification.recordset?.[0];
            if (!row || Number(row.table_exists) !== 1) {
              throw new Error('staff_property_assignments was not created or could not be verified.');
            }
            console.log(`KH_MIGRATION_OK assignments=${Number(row.assignment_count) || 0}`);
          } finally {
            await closeMssqlPool();
          }
          NODE
          )

          remote_command="command -v base64 >/dev/null 2>&1 && command -v chroot >/dev/null 2>&1 || tdnf install -y coreutils >/dev/null; printf '%s' '$runner_payload' | base64 -d > /proc/1/root/tmp/run-staff-property-migration.mjs && chroot /proc/1/root /usr/local/bin/node /tmp/run-staff-property-migration.mjs"

          set +e
          migration_output=$(timeout 180s az containerapp debug \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --command "$remote_command" 2>&1)
          debug_status=$?
          set -e

          echo "$migration_output"
          if grep -q 'KH_MIGRATION_OK' <<<"$migration_output"; then
            echo "Production migration succeeded (Azure debug status: $debug_status)."
            exit 0
          fi

          echo "Production migration failed or was not confirmed (Azure debug status: $debug_status)." >&2
          exit 1

  deploy:
    if: github.event_name != 'pull_request'
    needs:
      - verify
      - migrate-staff-property-assignments
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Configure server-side email delivery
        uses: azure/cli@v2
        env:
          SENDGRID_API_KEY: ${{ secrets.TWILIO_SENDGRID_API_KEY || secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: contact@quixo.online
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME || secrets.VITE_EMAIL_FROM_NAME || 'KH Rentals' }}
        with:
          inlineScript: |
            set -euo pipefail

            if [ -z "$SENDGRID_API_KEY" ]; then
              echo "TWILIO_SENDGRID_API_KEY (or SENDGRID_API_KEY) is not configured in GitHub." >&2
              exit 1
            fi

            if [ -z "$EMAIL_FROM" ]; then
              echo "EMAIL_FROM (or VITE_EMAIL_FROM) is not configured in GitHub." >&2
              exit 1
            fi

            az extension add --name containerapp --upgrade --yes
            az containerapp secret set \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets sendgrid-api-key="$SENDGRID_API_KEY" \
              --output none
            az containerapp update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set-env-vars \
                TWILIO_SENDGRID_API_KEY=secretref:sendgrid-api-key \
                EMAIL_FROM="$EMAIL_FROM" \
                EMAIL_FROM_NAME="$EMAIL_FROM_NAME" \
              --output none

      - name: Deploy immutable image
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az extension add --name containerapp --upgrade --yes
            az containerapp ingress update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --target-port "$CONTAINER_PORT"
            az containerapp update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "${{ steps.image.outputs.name }}:${{ github.sha }}"

      - name: Verify deployment health
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            fqdn=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)
            curl --fail --retry 10 --retry-delay 6 "https://${fqdn}/api/health"
