name: Build and deploy KH Rentals container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: khrental-production
  cancel-in-progress: true

env:
  CONTAINER_PORT: '5174'
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app
  PASSWORD_RESET_BASE_URL: https://khrental-app.proudpebble-f58b5187.southeastasia.azurecontainerapps.io

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:authorization
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Configure server-side email delivery
        uses: azure/cli@v2
        env:
          SENDGRID_API_KEY: ${{ secrets.TWILIO_SENDGRID_API_KEY || secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: contact@quixo.online
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME || secrets.VITE_EMAIL_FROM_NAME || 'KH Rentals' }}
        with:
          inlineScript: |
            set -euo pipefail

            if [ -z "$SENDGRID_API_KEY" ]; then
              echo "TWILIO_SENDGRID_API_KEY (or SENDGRID_API_KEY) is not configured in GitHub." >&2
              exit 1
            fi

            if [ -z "$EMAIL_FROM" ]; then
              echo "EMAIL_FROM (or VITE_EMAIL_FROM) is not configured in GitHub." >&2
              exit 1
            fi

            az extension add --name containerapp --upgrade --yes
            az containerapp secret set \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets sendgrid-api-key="$SENDGRID_API_KEY" \
              --output none
            az containerapp update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set-env-vars \
                TWILIO_SENDGRID_API_KEY=secretref:sendgrid-api-key \
                EMAIL_FROM="$EMAIL_FROM" \
                EMAIL_FROM_NAME="$EMAIL_FROM_NAME" \
                VITE_USE_MSSQL_API=false \
                PASSWORD_RESET_BASE_URL="$PASSWORD_RESET_BASE_URL" \
              --output none

      - name: Set up Node for R2 validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate durable R2 storage
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          for required in R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "$required is not configured in the GitHub Production environment." >&2
              exit 1
            fi
          done

          node scripts/validate-r2-connection.mjs

      - name: Configure durable R2 storage
        uses: azure/cli@v2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          inlineScript: |
            set -euo pipefail

            az extension add --name containerapp --upgrade --yes
            az containerapp secret set \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets \
                r2-access-key-id="$R2_ACCESS_KEY_ID" \
                r2-secret-access-key="$R2_SECRET_ACCESS_KEY" \
              --output none

            az containerapp update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set-env-vars \
                STORAGE_DRIVER=r2 \
                R2_ACCOUNT_ID="$R2_ACCOUNT_ID" \
                R2_BUCKET="$R2_BUCKET" \
                R2_ACCESS_KEY_ID=secretref:r2-access-key-id \
                R2_SECRET_ACCESS_KEY=secretref:r2-secret-access-key \
              --output none

      - name: Deploy immutable image with guarded cleanup
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az extension add --name containerapp --upgrade --yes
            az containerapp ingress update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --target-port "$CONTAINER_PORT"
            az containerapp update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "${{ steps.image.outputs.name }}:${{ github.sha }}" \
              --set-env-vars CLEANUP_KNOWN_TEST_AGREEMENTS=true

      - name: Verify deployment health
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            fqdn=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)
            curl --fail --retry 10 --retry-delay 6 "https://${fqdn}/api/health"

      - name: Verify one-time agreement cleanup
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az extension add --name containerapp --upgrade --yes
            revision=$(az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.latestRevisionName -o tsv)

            for attempt in $(seq 1 10); do
              logs=$(az containerapp logs show \
                --name "$AZURE_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision "$revision" \
                --type console \
                --tail 300 \
                --format text 2>/dev/null || true)
              echo "$logs"

              if echo "$logs" | grep -Eq 'Deleted [0-9]+ known Draft/Review agreement test row|Known test agreement rows are already absent'; then
                echo "Guarded test agreement cleanup confirmed."
                exit 0
              fi

              sleep 6
            done

            echo "Could not confirm guarded agreement cleanup in the latest revision logs." >&2
            exit 1
