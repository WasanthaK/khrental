name: Audit R2 direct public access (read only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-r2-public-access.yml'
      - 'scripts/audit-r2-public-access.mjs'
      - 'tests/audit-r2-public-access.test.js'
      - 'docs/INFRASTRUCTURE-HANDOVER.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khrental-r2-public-access-audit
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/audit-r2-public-access.mjs
      - run: node --test tests/audit-r2-public-access.test.js

  audit:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect managed and custom domain settings without changes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_JURISDICTION: ${{ vars.R2_JURISDICTION }}
          CLOUDFLARE_R2_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_R2_AUDIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-r2-public-access.mjs > "$RUNNER_TEMP/r2-public-access-audit.json"
      - name: Retain redacted audit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/r2-public-access-audit.json"
          if [ ! -s "$result" ]; then
            echo "R2 audit did not produce evidence; not accepted." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$result"
          {
            echo '## R2 direct public access'
            echo 'Redacted read-only result; no object or bucket settings changed.'
            echo '~~~json'
            cat "$result"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
