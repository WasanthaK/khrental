name: Diagnose Container Apps revision
# dual-table 24h correlation

on:
  push:
    branches:
      - diagnose/sql-credit-state
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app

jobs:
  diagnose:
    name: read-only P0.3 privacy inspection
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Discover production Log Analytics tables without reading messages
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          latest_revision=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          ready_revision=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestReadyRevisionName -o tsv)
          environment_id=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.environmentId -o tsv)
          workspace_id=$(az containerapp env show --ids "$environment_id" --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)

          echo "Latest revision: $latest_revision"
          echo "Latest ready revision: $ready_revision"

          az monitor log-analytics query \
            --workspace "$workspace_id" \
            --analytics-query "union withsource=TableName * | where TimeGenerated > ago(24h) | summarize RowCount=count() by TableName | order by RowCount desc" \
            --output table
