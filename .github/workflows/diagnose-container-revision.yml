name: Diagnose Container Apps revision
# rerun

on:
  push:
    branches:
      - diagnose/sql-credit-state
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app

jobs:
  diagnose:
    name: read-only P0.3 privacy inspection
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect production logs without printing log content
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null

          latest_revision=$(az containerapp show             --name "$AZURE_CONTAINER_APP_NAME"             --resource-group "$AZURE_RESOURCE_GROUP"             --query properties.latestRevisionName -o tsv)
          ready_revision=$(az containerapp show             --name "$AZURE_CONTAINER_APP_NAME"             --resource-group "$AZURE_RESOURCE_GROUP"             --query properties.latestReadyRevisionName -o tsv)

          echo "Latest revision: $latest_revision"
          echo "Latest ready revision: $ready_revision"

          replica=$(az containerapp replica list \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$latest_revision" \
            --query '[0].name' -o tsv 2>/dev/null || true)

          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT

          if [ -n "$replica" ]; then
            az containerapp logs show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$latest_revision" \
              --replica "$replica" \
              --type console \
              --tail 300 \
              --format text > "$tmp"
          else
            az containerapp logs show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --type console \
              --tail 300 \
              --format text > "$tmp"
          fi

          count() {
            local pattern="$1"
            { grep -Eio "$pattern" "$tmp" || true; } | wc -l | tr -d ' '
          }

          email_delivery_events=$(count '"event"[[:space:]]*:[[:space:]]*"email[^"]*"|email\.delivery|sendgrid')
          email_addresses=$(count '[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}')
          invitation_urls=$(count 'accept-invite\?token=|/accept-invite[^[:space:]]*token=')
          token_values=$(count '"(token|invitationToken|resetToken)"[[:space:]]*:[[:space:]]*"[^"]+"|[?&](token|reset_token)=[^&[:space:]]+')
          password_values=$(count '"password"[[:space:]]*:[[:space:]]*"[^"]+"')
          sendgrid_keys=$(count 'SG\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}')
          body_markers=$(count 'Complete Your Account Setup|<!DOCTYPE html|<html|Invitation to KH Rentals')

          echo "P0.3 privacy spot-check summary (log content intentionally suppressed):"
          echo "email_delivery_event_matches=$email_delivery_events"
          echo "email_address_matches=$email_addresses"
          echo "invitation_url_matches=$invitation_urls"
          echo "token_value_matches=$token_values"
          echo "password_value_matches=$password_values"
          echo "sendgrid_key_matches=$sendgrid_keys"
          echo "email_body_marker_matches=$body_markers"

          sensitive_total=$((email_addresses + invitation_urls + token_values + password_values + sendgrid_keys + body_markers))
          echo "sensitive_match_total=$sensitive_total"

          if [ "$sensitive_total" -ne 0 ]; then
            echo "::error::Sensitive-content pattern detected in recent production console logs. Raw matching content was not printed."
            exit 1
          fi
