name: Inspect Evia service authentication (read-only)

on:
  push:
    branches: [diag/evia-service-auth-20261108]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Sign in to Azure with existing Production OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 3d42a180-fda5-4013-afcc-fdba10266f9b
      - name: Inspect existing service credentials without returning tokens or document data
        shell: bash
        run: |
          set -euo pipefail
          cat > evia-service-auth-readonly.mjs <<'JS'
          (async()=>{const o=[],l=new Set(["unsupported_grant_type","invalid_client","invalid_grant","invalid_scope","invalid_request","unauthorized_client","access_denied"]),a=async(e,t,i)=>{try{const s=await fetch(t,{...i,redirect:"error",signal:AbortSignal.timeout(2e4)}),d=(s.headers.get("content-type")||"").includes("application/json"),n=d?await s.json():{},_=n.access_token||n.accessToken||n.authToken||n.token,r=typeof n.scope=="string"?n.scope.split(/\s+/):[],c={method:e,status:s.status,json:d,tokenPresent:s.ok&&typeof _=="string"&&_.length>0,scopeReported:r.length>0,documentsReadReported:r.includes("documents:read"),auditReadReported:r.includes("audit:read")};return l.has(n.error)&&(c.errorCode=n.error),o.push(c),c}catch{const s={method:e,networkError:!0,tokenPresent:!1};return o.push(s),s}},p=process.env.EVIA_SIGN_API_KEY||"";if(p){const e={method:"POST",headers:{"Content-Type":"application/json","X-Api-Key":p,Accept:"application/json"},body:"{}"},t=await a("integration_key_origin","https://evia.enadocapp.com/api/v2/oauth/exchange",e);!t.tokenPresent&&t.status===404&&await a("integration_key_sign_base","https://evia.enadocapp.com/_apis/sign/api/v2/oauth/exchange",e)}else o.push({method:"integration_key",notConfigured:!0,tokenPresent:!1});if(!o.some(e=>e.tokenPresent)){const e=process.env.EVIA_SIGN_CLIENT_ID||"",t=process.env.EVIA_SIGN_CLIENT_SECRET||"";if(e&&t){const i=new URLSearchParams({grant_type:"client_credentials",client_id:e,client_secret:t,scope:"documents:read audit:read"});await a("api_app_read_only","https://evia.enadocapp.com/_apis/falcon/auth/api/v2/token",{method:"POST",headers:{Authorization:"Basic "+Buffer.from(e+":"+t).toString("base64"),"Content-Type":"application/x-www-form-urlencoded",Accept:"application/json"},body:i.toString()})}else o.push({method:"api_app_read_only",notConfigured:!0,tokenPresent:!1})}console.log("R5_SERVICE_AUTH_READONLY="+JSON.stringify({serviceAuthenticationEstablished:o.some(e=>e.tokenPresent),results:o}))})().catch(()=>{console.log("R5_SERVICE_AUTH_READONLY_FAILED"),process.exitCode=1});
          JS
          encoded=$(base64 -w0 evia-service-auth-readonly.mjs)
          command="node --input-type=module -e \"eval(Buffer.from('$encoded','base64').toString())\""
          printf -v command_quoted '%q' "$command"
          az extension add --name containerapp --upgrade --yes >/dev/null
          ready_revision=$(az containerapp show --name khrental-app --resource-group khrental-prod-rg --query properties.latestReadyRevisionName -o tsv)
          exec_command="az containerapp exec --name khrental-app --resource-group khrental-prod-rg --revision '$ready_revision' --command $command_quoted"
          script -q -e -c "$exec_command" /dev/null | tee evia-service-auth-result.txt
          grep -Fq 'R5_SERVICE_AUTH_READONLY={' evia-service-auth-result.txt
