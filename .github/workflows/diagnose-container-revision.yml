name: Inspect Evia service authentication (read-only)

on:
  push:
    branches: [diag/evia-service-auth-20261108]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Sign in to Azure with existing Production OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 3d42a180-fda5-4013-afcc-fdba10266f9b
      - name: Inspect existing service credentials without returning tokens or document data
        shell: bash
        run: |
          set -euo pipefail
          cat > evia-service-auth-readonly.mjs <<'JS'
          (async () => {
            const results = [];
            const knownErrors = new Set(['unsupported_grant_type', 'invalid_client', 'invalid_grant', 'invalid_scope', 'invalid_request', 'unauthorized_client', 'access_denied']);
            const probe = async (method, url, options) => {
              try {
                const response = await fetch(url, { ...options, redirect: 'error', signal: AbortSignal.timeout(20000) });
                const json = (response.headers.get('content-type') || '').includes('application/json');
                const data = json ? await response.json() : {};
                const token = data.access_token || data.accessToken || data.authToken || data.token;
                const scopes = typeof data.scope === 'string' ? data.scope.split(/\s+/) : [];
                const result = { method, status: response.status, json,
                  tokenPresent: response.ok && typeof token === 'string' && token.length > 0,
                  scopeReported: scopes.length > 0,
                  documentsReadReported: scopes.includes('documents:read'), auditReadReported: scopes.includes('audit:read') };
                if (knownErrors.has(data.error)) result.errorCode = data.error;
                results.push(result);
                return result;
              } catch { const result = { method, networkError: true, tokenPresent: false }; results.push(result); return result; }
            };
            const apiKey = process.env.EVIA_SIGN_API_KEY || '';
            if (apiKey) {
              const options = { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Api-Key': apiKey, Accept: 'application/json' }, body: '{}' };
              const first = await probe('integration_key_origin', 'https://evia.enadocapp.com/api/v2/oauth/exchange', options);
              if (!first.tokenPresent && first.status === 404) {
                await probe('integration_key_sign_base', 'https://evia.enadocapp.com/_apis/sign/api/v2/oauth/exchange', options);
              }
            } else { results.push({ method: 'integration_key', notConfigured: true, tokenPresent: false }); }
            if (!results.some(item => item.tokenPresent)) {
              const clientId = process.env.EVIA_SIGN_CLIENT_ID || '';
              const clientSecret = process.env.EVIA_SIGN_CLIENT_SECRET || '';
              if (clientId && clientSecret) {
                const body = new URLSearchParams({ grant_type: 'client_credentials', client_id: clientId, client_secret: clientSecret, scope: 'documents:read audit:read' });
                await probe('api_app_read_only', 'https://evia.enadocapp.com/_apis/falcon/auth/api/v2/token', {
                  method: 'POST', headers: { Authorization: 'Basic ' + Buffer.from(clientId + ':' + clientSecret).toString('base64'),
                    'Content-Type': 'application/x-www-form-urlencoded', Accept: 'application/json' }, body: body.toString()
                });
              } else { results.push({ method: 'api_app_read_only', notConfigured: true, tokenPresent: false }); }
            }
            console.log('R5_SERVICE_AUTH_READONLY=' + JSON.stringify({ serviceAuthenticationEstablished: results.some(item => item.tokenPresent), results }));
          })().catch(() => { console.log('R5_SERVICE_AUTH_READONLY_FAILED'); process.exitCode = 1; });
          JS
          encoded=$(base64 -w0 evia-service-auth-readonly.mjs)
          command="node --input-type=module -e \"eval(Buffer.from('$encoded','base64').toString())\""
          printf -v command_quoted '%q' "$command"
          az extension add --name containerapp --upgrade --yes >/dev/null
          ready_revision=$(az containerapp show --name khrental-app --resource-group khrental-prod-rg --query properties.latestReadyRevisionName -o tsv)
          exec_command="az containerapp exec --name khrental-app --resource-group khrental-prod-rg --revision '$ready_revision' --command $command_quoted"
          script -q -e -c "$exec_command" /dev/null | tee evia-service-auth-result.txt
          grep -Fq 'R5_SERVICE_AUTH_READONLY={' evia-service-auth-result.txt
