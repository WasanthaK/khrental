name: Diagnose Container Apps revision

on:
  push:
    branches: [diag/r5-retention-readonly-20261107]
  workflow_dispatch:
    inputs:
      restart_latest:
        description: 'Restart the latest revision before checking it'
        required: true
        type: boolean
        default: false
      expected_build:
        description: Optional exact serving build to verify without deployment
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
  AZURE_RESOURCE_GROUP: khrental-prod-rg
  AZURE_CONTAINER_APP_NAME: khrental-app

jobs:
  diagnose:
    name: inspect production revision
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect completion metadata without document contents or credentials
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes >/dev/null
          ready_revision=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestReadyRevisionName -o tsv)
          command="node --input-type=module -e \"eval(Buffer.from('','base64').toString())\""
          printf -v command_quoted '%q' "$command"
          exec_command="az containerapp exec --name '$AZURE_CONTAINER_APP_NAME' --resource-group '$AZURE_RESOURCE_GROUP' --revision '$ready_revision' --command $command_quoted"
          script -q -e -c "$exec_command" /dev/null | tee retention-diagnostic.txt
          grep -Fq 'R5_RETENTION_READONLY={' retention-diagnostic.txt
