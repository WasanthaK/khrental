name: Bind Quixo.Homes application custom domain

# Runs once when this workflow is merged; can be rerun by an authorized operator.
# A domain binding does not redeploy the app or remove its Azure hostname.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bind-quixo-app-domain.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: quixo-homes-app-domain-binding
  cancel-in-progress: false

jobs:
  bind-domain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 35
    env:
      AZURE_SUBSCRIPTION_ID: 3d42a180-fda5-4013-afcc-fdba10266f9b
      AZURE_RESOURCE_GROUP: khrental-prod-rg
      AZURE_CONTAINER_APP_NAME: khrental-app
      EXPECTED_ENVIRONMENT: khrental-prod-env
      DOMAIN: app.quixo.homes
    steps:
      - name: Sign in to Azure with existing production OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate DNS and bind managed HTTPS certificate
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors

          fqdn="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          verification="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" --query 'properties.customDomainVerificationId' -o tsv)"
          environment_id="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" --query 'properties.environmentId' -o tsv)"
          environment="${environment_id##*/}"
          if [ "$environment" != "$EXPECTED_ENVIRONMENT" ] || [ -z "$verification" ] || [ -z "$fqdn" ]; then
            echo "Production Container App identity/configuration did not match expected target." >&2
            exit 1
          fi

          echo "Checking CNAME $DOMAIN => $fqdn and TXT asuid.$DOMAIN"
          dns_ready=0
          for attempt in $(seq 1 12); do
            cname="$(dig +short CNAME "$DOMAIN" | head -n 1 | sed 's/\.$//' | tr '[:upper:]' '[:lower:]')"
            txt="$(dig +short TXT "asuid.$DOMAIN" | tr -d '"' | tr -d '[:space:]')"
            if [ "$cname" = "$fqdn" ] && [ "$txt" = "$verification" ]; then
              dns_ready=1
              echo "DNS ownership and direct Container App CNAME verified."
              break
            fi
            echo "DNS not yet ready ($attempt/12): CNAME found=${cname:-none}, TXT match=$([ "$txt" = "$verification" ] && echo yes || echo no)"
            if [ "$attempt" -lt 12 ]; then sleep 15; fi
          done
          if [ "$dns_ready" -ne 1 ]; then
            echo "DNS failed verification. No Azure hostname/certificate changes made." >&2
            exit 1
          fi

          existing="$(az containerapp hostname list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" --query '[].name' -o tsv)"
          if ! printf '%s\n' "$existing" | grep -Fxq "$DOMAIN"; then
            az containerapp hostname add -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" --hostname "$DOMAIN" --only-show-errors
          else
            echo "Hostname already registered; preserving existing binding."
          fi

          binding="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" --query "properties.configuration.ingress.customDomains[?name=='app.quixo.homes'].bindingType | [0]" -o tsv)"
          if [ "$binding" != "SniEnabled" ]; then
            az containerapp hostname bind -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" --hostname "$DOMAIN" --environment "$environment" --validation-method CNAME --only-show-errors
          else
            echo "Existing SNI certificate binding found."
          fi

          az containerapp hostname list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" -o json
          binding="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_NAME" --query "properties.configuration.ingress.customDomains[?name=='app.quixo.homes'].bindingType | [0]" -o tsv)"
          [ "$binding" = "SniEnabled" ] || { echo "Managed HTTPS binding was not confirmed." >&2; exit 1; }

      - name: Verify HTTPS from the new hostname
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "https://app.quixo.homes/api/health" | jq -e '.ok == true'
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "https://app.quixo.homes/api/mssql/health" | jq -e '.ok == true and .provider == "mssql" and .connection == "ready"'
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "https://app.quixo.homes/build-info.json" | jq -e '.buildSha | length > 10'
          echo "Verified app.quixo.homes HTTPS, application health, MSSQL and serving build fingerprint."
