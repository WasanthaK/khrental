name: Read current Evia API documentation
on:
  push:
    branches: [fix/evia-audit-download]
    paths: ['.github/workflows/diagnose-evia-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current public documentation
        run: |
          node --input-type=module <<'JS'
          for (const path of [
            '/llms.txt',
            '/evia-sign-api/v2/authorization-and-authentication.md',
            '/evia-sign-api/v2/webhook-management.md',
            '/evia-sign-api/document.md'
          ]) {
            const response = await fetch('https://docs.sign.enadocapp.com' + path);
            console.log('PUBLIC_DOC', path, response.status);
            const body = await response.text();
            if (response.ok && !body.trim().startsWith('<')) console.log(body.slice(0,60000));
          }
          JS
