name: Verify Evia audit retrieval with curl
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 4
    steps:
      - name: Curl configured integration and existing audit read-only
        env:
          EVIA_API_KEY: ${{ secrets.EVIA_SIGN_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tempfile
          from urllib.parse import urlparse
          key = os.environ.get("EVIA_API_KEY", "")
          if not key or "\r" in key or "\n" in key:
              raise SystemExit("Configured integration key unavailable or invalid.")
          origin = "https://evia.enadocapp.com"
          request_id = "5CD08BD4-87A7-4E06-BE61-8EDC44E3AF7C"
          def request(label, url, headers, method="GET"):
              with tempfile.TemporaryDirectory() as directory:
                  output = pathlib.Path(directory) / "response"
                  args = ["curl", "--silent", "--show-error", "--proto", "=https",
                          "--connect-timeout", "10", "--max-time", "25",
                          "--max-filesize", "52428800", "--max-redirs", "0",
                          "--request", method, "--header", "@-", "--output", str(output),
                          "--write-out", "%{json}"]
                  if method == "POST":
                      args.extend(["--data", "{}"])
                  args.append(url)
                  run = subprocess.run(args, input="\n".join(headers) + "\n",
                                       text=True, capture_output=True, timeout=35)
                  try:
                      meta = json.loads(run.stdout)
                  except (ValueError, TypeError):
                      meta = {}
                  status = meta.get("http_code", 0)
                  ctype = meta.get("content_type") or ""
                  body = output.read_bytes() if output.exists() else b""
                  print(label, "curl_exit", run.returncode, "status", status,
                        "type", ctype, "bytes", len(body), flush=True)
                  return status, ctype, body
          for base in ["/api/v2", "/_apis/sign/api/v2"]:
              status, ctype, body = request("EXCHANGE " + base,
                  origin + base + "/oauth/exchange",
                  ["Content-Type: application/json", "X-Api-Key: " + key], "POST")
              if not (200 <= status < 300 and "application/json" in ctype):
                  continue
              try:
                  payload = json.loads(body)
              except ValueError:
                  print("INVALID_JSON", flush=True)
                  continue
              token = payload.get("access_token") or payload.get("accessToken")
              print("TOKEN_RETURNED", bool(token), flush=True)
              if not isinstance(token, str) or not token or "\r" in token or "\n" in token:
                  continue
              status, ctype, body = request("COMPLETED_LIST",
                  origin + "/_apis/sign/api/v2/requests/" + request_id + "/documents",
                  ["Authorization: Bearer " + token, "Accept: application/json"])
              if not (200 <= status < 300 and "application/json" in ctype):
                  continue
              data = json.loads(body)
              docs = data if isinstance(data, list) else data.get("documents", [])
              audits = [d for d in docs if str(d.get("documentName") or d.get("DocumentName", "")).lower() == "audit_trail.pdf"]
              print("DOCUMENT_COUNT", len(docs), "AUDIT_COUNT", len(audits), flush=True)
              if len(audits) != 1:
                  continue
              url = audits[0].get("downloadUrl") or audits[0].get("DownloadUrl")
              parsed = urlparse(url) if isinstance(url, str) else None
              trusted = parsed and parsed.scheme == "https" and parsed.netloc == "evia.enadocapp.com" and parsed.path.startswith("/_apis/sign/api/v2/documents/") and not parsed.fragment
              if not trusted:
                  print("AUDIT_DOWNLOAD_URL_REJECTED", flush=True)
                  continue
              status, ctype, body = request("AUDIT_DOWNLOAD", url, ["Authorization: Bearer " + token])
              print("AUDIT_PDF_VALID", 200 <= status < 300 and body.startswith(b"%PDF-"), flush=True)
          PY
