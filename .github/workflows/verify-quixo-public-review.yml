name: Verify Quixo.Homes public review-only website
on:
  pull_request:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'scripts/verify-r4-public-review-browser.mjs'
      - '.github/workflows/verify-quixo-public-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify release paths in a localhost Chromium browser
        run: node scripts/verify-r4-public-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-browse-proof
          path: verification-browse-proof/
          if-no-files-found: ignore
      - name: Report isolated preview boundary
        run: echo "R4 layout and any LK live-client path verified on localhost with synthetic fixtures only; no production requests, signup or enquiries"
