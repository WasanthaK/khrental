name: Verify Quixo.Homes public review-only website
on:
  pull_request:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'src/components/DatabaseReadiness.jsx'
      - 'src/utils/databaseReadiness.js'
      - 'scripts/test-database-wakeup-browser.mjs'
      - 'scripts/verify-r4-public-review-browser.mjs'
      - '.github/workflows/verify-quixo-public-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify release paths in a localhost Chromium browser
        run: node scripts/verify-r4-public-review-browser.mjs
      - name: Verify database wake-up and draft preservation on desktop and mobile
        run: node scripts/test-database-wakeup-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-browse-proof
          path: |
            verification-browse-proof/
            wakeup-browser-proof/
          if-no-files-found: ignore
      - name: Report isolated preview boundary
        run: echo "R4 layout and any LK live-client path verified on localhost with synthetic fixtures only; no production requests, signup or enquiries"
